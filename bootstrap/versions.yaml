# Every version the Platform bootstrap pins. The templates read this file,
# and so does the kind harness (test/e2e) to build a cluster that matches the
# node. A change reaches the Platform when its bootstrap pin moves.

argocd:
  # cloud-init installs ArgoCD from this chart and the argocd Application
  # takes over with the same version. Must match argocd_chart_version in
  # infra/platform/variables.tf.
  chart: 10.9.2
  repository: https://argoproj.github.io/argo-helm

# The Helm release cloud-init downloads to render the argo-cd chart above.
# sha256 is the published checksum of the linux amd64 tarball.
helm:
  version: v3.22.0
  sha256:
    linuxAmd64: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb

certManager:
  chart: v1.21.2
  repository: https://charts.jetstack.io

externalDNS:
  chart: 1.22.0
  repository: https://kubernetes-sigs.github.io/external-dns/

cloudnativePG:
  chart: 0.29.0
  repository: https://cloudnative-pg.github.io/charts
  # The Barman Cloud plugin that ships base backups and WAL to Object Storage.
  barmanCloudPluginChart: 0.8.0

k8sMonitoring:
  chart: 4.5.2
  repository: https://grafana.github.io/helm-charts

oauth2Proxy:
  chart: 10.7.0
  # The oauth2-proxy binary the chart installs at this chart version.
  appVersion: 7.15.3
  repository: https://oauth2-proxy.github.io/manifests

# KSOPS is a kustomize plugin, not a chart: the image ships the ksops binary
# and a matching kustomize, which an init container installs into the repo
# server.
ksops:
  image: viaductoss/ksops:v4.5.1

# What the node runs, so the kind harness can mimic it. k3s bundles its own
# build of the Traefik chart and pins the Traefik image separately;
# helm-controller is the k3s component that reads the HelmChartConfig the
# bootstrap writes.
k3s:
  version: v1.36.4+k3s1
  traefik:
    chart: 40.1.4+up40.1.0
    # k3s installs the CRD chart first, then the chart proper.
    crdChartURL: https://github.com/k3s-io/k3s-charts/raw/main/assets/traefik-crd/traefik-crd-40.1.4+up40.1.0.tgz
    chartURL: https://github.com/k3s-io/k3s-charts/raw/main/assets/traefik/traefik-40.1.4+up40.1.0.tgz
    image: "3.7.8"
  helmController: v0.17.7

# The kind node image whose Kubernetes version matches the k3s version above.
kind:
  nodeImage: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
