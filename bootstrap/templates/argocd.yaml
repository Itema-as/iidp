{{- $v := include "iidp-bootstrap.versions" . | fromYaml }}
{{- $host := include "iidp-bootstrap.argocdHost" . }}
# ArgoCD managing itself. cloud-init installs ArgoCD by rendering the same
# argo-cd chart with helm template, so every object already has the shape
# this Application expects and a sync only ever patches. Installing from the
# upstream install.yaml instead would leave Deployments with different
# (immutable) selectors, which the first sync would have to replace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ $v.argocd.repository }}
    chart: argo-cd
    targetRevision: {{ $v.argocd.chart | quote }}
    helm:
      releaseName: argocd
      valuesObject:
        # Names every object argocd-<component>, as cloud-init and the kind
        # harness do when they install ArgoCD, so this Application's first
        # sync patches the running objects instead of creating new ones.
        fullnameOverride: argocd
        global:
          domain: {{ $host }}
        crds:
          install: true
          keep: true
        configs:
          cm:
            # No local admin account: everyone signs in through Entra ID.
            admin.enabled: false
            # KSOPS is a kustomize exec plugin; kustomize refuses to run
            # plugins without both flags.
            kustomize.buildOptions: --enable-alpha-plugins --enable-exec
            dex.config: |
              connectors:
                - type: microsoft
                  id: microsoft
                  name: Microsoft Entra ID
                  config:
                    # From the Secret argocd-entra in the argocd namespace,
                    # labelled app.kubernetes.io/part-of=argocd so ArgoCD
                    # substitutes the values (SOPS-encrypted in the Platform
                    # repository, decrypted by KSOPS).
                    clientID: $argocd-entra:clientID
                    clientSecret: $argocd-entra:clientSecret
                    tenant: $argocd-entra:tenant
                    redirectURI: {{ .Values.argocdURL }}/api/dex/callback
                    # Groups come back as object ids so the RBAC mapping
                    # below survives a group rename.
                    groupNameFormat: id
                    onlySecurityGroups: true
          params:
            # Traefik terminates TLS with the wildcard certificate.
            server.insecure: true
          rbac:
            policy.default: role:readonly
            {{- if .Values.argocdAdminGroup }}
            policy.csv: |
              g, {{ .Values.argocdAdminGroup }}, role:admin
            {{- end }}
        server:
          ingress:
            enabled: true
            ingressClassName: traefik
            hostname: {{ $host }}
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              # TLS with no secret of its own: Traefik serves the default
              # store's wildcard certificate (see platform-tls).
              traefik.ingress.kubernetes.io/router.tls: "true"
        # Kept on explicitly: Preview Environments are ApplicationSets. A
        # small request because the node and the kind runner are near their
        # CPU request ceiling; the limit keeps a leak from starving the node.
        applicationSet:
          replicas: 1
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
        repoServer:
          # KSOPS: the init container copies ksops and its kustomize into an
          # emptyDir that shadows the repo server's kustomize; sops reads the
          # age key cloud-init put in the Secret sops-age.
          initContainers:
            - name: install-ksops
              image: {{ $v.ksops.image }}
              command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
              volumeMounts:
                - mountPath: /custom-tools
                  name: custom-tools
          volumes:
            - name: custom-tools
              emptyDir: {}
            - name: sops-age
              secret:
                secretName: sops-age
          volumeMounts:
            - mountPath: /usr/local/bin/kustomize
              name: custom-tools
              subPath: kustomize
            - mountPath: /usr/local/bin/ksops
              name: custom-tools
              subPath: ksops
            - mountPath: /.config/sops/age
              name: sops-age
              readOnly: true
          env:
            - name: XDG_CONFIG_HOME
              value: /.config
            - name: SOPS_AGE_KEY_FILE
              value: /.config/sops/age/keys.txt
  destination:
    {{- include "iidp-bootstrap.destination" . | nindent 4 }}
    namespace: argocd
  syncPolicy:
    {{- include "iidp-bootstrap.syncPolicy" (list "ApplyOutOfSyncOnly=true") | nindent 4 }}
