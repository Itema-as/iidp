{{- $v := include "iidp-bootstrap.versions" . | fromYaml }}
{{- $host := include "iidp-bootstrap.argocdHost" . }}
# ArgoCD managing itself. cloud-init installs ArgoCD by rendering this same
# argo-cd chart with helm template (fullnameOverride: argocd, crds.install:
# true, the same minimum values as below) and applying the output
# server-side; from the first sync of this Application the chart just keeps
# managing what it already stood up: Dex with the Entra ID connector, RBAC,
# the ingress, and the KSOPS tooling in the repo server.
#
# This used to install from the upstream install.yaml instead, whose
# Deployments and StatefulSet select pods differently from the chart's (a
# selector is immutable), so the first sync had to delete and recreate them
# (Replace=true,Force=true), including the application controller's own
# StatefulSet. That takeover raced the controller's replacement of itself
# against the repo server's, and lost often enough on a 2-vCPU runner to
# make `kind bootstrap` flaky even with the controller deferred to its own
# sync wave (docs/implementation-notes/04-bootstrap.md, "The takeover race"
# and "Installing from the chart, not the upstream manifests"). Installing
# from the chart from the start means every object already has the shape
# the chart expects, so a sync only ever patches: no Replace, no sync wave.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ $v.argocd.repository }}
    chart: argo-cd
    targetRevision: {{ $v.argocd.chart | quote }}
    helm:
      releaseName: argocd
      valuesObject:
        # Name resources argocd-<component>, matching the initial install
        # (both cloud-init and the harness render this same chart with
        # fullnameOverride: argocd), so the selectors this sync sees are the
        # ones already running and it only ever patches.
        fullnameOverride: argocd
        global:
          domain: {{ $host }}
        crds:
          install: true
          keep: true
        configs:
          cm:
            # Nobody logs in with a local account (docs/design.md, Access).
            admin.enabled: false
            # KSOPS is a kustomize exec plugin; kustomize refuses to run
            # plugins without both flags.
            kustomize.buildOptions: --enable-alpha-plugins --enable-exec
            dex.config: |
              connectors:
                - type: microsoft
                  id: microsoft
                  name: Microsoft Entra ID
                  config:
                    # From the Secret argocd-entra in the argocd namespace,
                    # labelled app.kubernetes.io/part-of=argocd so ArgoCD
                    # substitutes the values (SOPS-encrypted in the Platform
                    # repository, decrypted by KSOPS).
                    clientID: $argocd-entra:clientID
                    clientSecret: $argocd-entra:clientSecret
                    tenant: $argocd-entra:tenant
                    redirectURI: {{ .Values.argocdURL }}/api/dex/callback
                    # Groups come back as object ids so the RBAC mapping
                    # below survives a group rename.
                    groupNameFormat: id
                    onlySecurityGroups: true
          params:
            # Traefik terminates TLS with the wildcard certificate.
            server.insecure: true
          rbac:
            policy.default: role:readonly
            {{- if .Values.argocdAdminGroup }}
            policy.csv: |
              g, {{ .Values.argocdAdminGroup }}, role:admin
            {{- end }}
        server:
          ingress:
            enabled: true
            ingressClassName: traefik
            hostname: {{ $host }}
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              # TLS with no secret of its own: Traefik serves the default
              # store's wildcard certificate (see platform-tls).
              traefik.ingress.kubernetes.io/router.tls: "true"
        repoServer:
          # KSOPS: the init container copies ksops and its kustomize into an
          # emptyDir that shadows the repo server's kustomize; sops reads the
          # age private key that cloud-init generated into the Secret
          # sops-age (key keys.txt).
          initContainers:
            - name: install-ksops
              image: {{ $v.ksops.image }}
              command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
              volumeMounts:
                - mountPath: /custom-tools
                  name: custom-tools
          volumes:
            - name: custom-tools
              emptyDir: {}
            - name: sops-age
              secret:
                secretName: sops-age
          volumeMounts:
            - mountPath: /usr/local/bin/kustomize
              name: custom-tools
              subPath: kustomize
            - mountPath: /usr/local/bin/ksops
              name: custom-tools
              subPath: ksops
            - mountPath: /.config/sops/age
              name: sops-age
              readOnly: true
          env:
            - name: XDG_CONFIG_HOME
              value: /.config
            - name: SOPS_AGE_KEY_FILE
              value: /.config/sops/age/keys.txt
  destination:
    {{- include "iidp-bootstrap.destination" . | nindent 4 }}
    namespace: argocd
  syncPolicy:
    {{- include "iidp-bootstrap.syncPolicy" (list "ApplyOutOfSyncOnly=true") | nindent 4 }}
