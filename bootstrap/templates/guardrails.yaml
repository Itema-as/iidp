# The ValidatingAdmissionPolicies guarding Application namespaces. They are
# cluster-scoped; the destination namespace only satisfies ArgoCD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guardrails
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision | quote }}
    path: bootstrap/components/guardrails
    helm:
      releaseName: guardrails
      valuesObject:
        baseDomain: {{ .Values.baseDomain }}
        validationActions:
          {{- toYaml .Values.guardrails.validationActions | nindent 10 }}
        {{- with .Values.guardrails.extraAllowedImages }}
        extraAllowedImages:
          {{- toYaml . | nindent 10 }}
        {{- end }}
  destination:
    {{- include "iidp-bootstrap.destination" . | nindent 4 }}
    namespace: kube-system
  syncPolicy:
    {{- include "iidp-bootstrap.syncPolicy" (list) | nindent 4 }}
