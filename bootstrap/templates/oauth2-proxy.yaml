{{- $v := include "iidp-bootstrap.versions" . | fromYaml }}
{{- $host := printf "auth.%s" .Values.baseDomain }}
{{- $cookieDomain := printf ".%s" (include "iidp-bootstrap.loginCookieDomain" .) }}
# The two oauth2-proxies behind the Itema login Capability, which differ only
# in where the sign-in callback and the cookie live.
#
# The shared one, oauth2-proxy, issues one cookie for the whole login cookie
# domain, so signing in once covers every protected host inside it. Its
# callback is fixed on auth.<baseDomain>. The cookie is sent to every host in
# the zone, including ones the Platform doesn't run, which could replay a
# session; see bootstrap/README.md. The cookie name isn't the default
# _oauth2_proxy because browsers may still hold an older cookie of that name
# for .<baseDomain>, and oauth2-proxy reads the first cookie of a name it
# finds, which could loop the user through sign-in.
#
# The host-only one, oauth2-proxy-host, serves custom domains outside the
# login cookie domain, which the shared cookie never reaches. With no
# redirect-url it builds the callback from the requested host,
# https://<host>/oauth2/callback, and with no cookie-domain its cookies stay
# on that host. The application chart routes each such host's /oauth2/ to it.
# Without whitelist-domain, oauth2-proxy refuses the absolute return URL it
# builds from the X-Forwarded-* headers, logs "Invalid redirect generated from
# X-Forwarded-* headers", and returns to the path alone, which is on the same
# host as the callback.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: {{ $v.oauth2Proxy.repository }}
      chart: oauth2-proxy
      targetRevision: {{ $v.oauth2Proxy.chart | quote }}
      helm:
        releaseName: oauth2-proxy
        valuesObject:
          fullnameOverride: oauth2-proxy
          {{- include "iidp-bootstrap.oauth2ProxyValues" . | nindent 10 }}
          extraArgs:
            {{- include "iidp-bootstrap.oauth2ProxyArgs" . | nindent 12 }}
            cookie-name: __Secure-itema_login
            cookie-domain: {{ $cookieDomain | quote }}
            whitelist-domain: {{ $cookieDomain | quote }}
            redirect-url: {{ printf "https://%s/oauth2/callback" $host | quote }}
          ingress:
            enabled: true
            className: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
            hosts:
              - {{ $host }}
            tls:
              - hosts:
                  - {{ $host }}
    - repoURL: {{ .Values.bootstrap.repoURL }}
      targetRevision: {{ .Values.bootstrap.targetRevision }}
      path: bootstrap/components/oauth2-proxy-login
    - repoURL: {{ $v.oauth2Proxy.repository }}
      chart: oauth2-proxy
      targetRevision: {{ $v.oauth2Proxy.chart | quote }}
      helm:
        releaseName: oauth2-proxy-host
        valuesObject:
          fullnameOverride: oauth2-proxy-host
          {{- include "iidp-bootstrap.oauth2ProxyValues" . | nindent 10 }}
          extraArgs:
            {{- include "iidp-bootstrap.oauth2ProxyArgs" . | nindent 12 }}
            # A cookie with the __Host- prefix is only accepted with Secure,
            # Path=/ and no Domain, so a browser refuses it if it is ever
            # set for more than its host.
            cookie-name: __Host-itema_login
          ingress:
            enabled: false
  destination:
    {{- include "iidp-bootstrap.destination" . | nindent 4 }}
    namespace: oauth2-proxy
  syncPolicy:
    {{- include "iidp-bootstrap.syncPolicy" (list) | nindent 4 }}
