# The Deploy gate, through which an Application repository's CI deploys and
# promotes. It runs in the argocd namespace because it mounts two Secrets
# cloud-init writes there: platform-repo-github-app (the iidp-deploy App's
# key) and ghcr-pull-token (to check that an image tag exists).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deploy-gate
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision | quote }}
    path: bootstrap/components/deploy-gate
    helm:
      releaseName: deploy-gate
      valuesObject:
        baseDomain: {{ .Values.baseDomain }}
        bootstrapRevision: {{ .Values.bootstrap.targetRevision | quote }}
        githubOrgId: {{ .Values.deployGate.githubOrgId | int64 }}
        image:
          repository: {{ .Values.deployGate.image.repository }}
          tag: {{ .Values.deployGate.image.tag | quote }}
          pullPolicy: {{ .Values.deployGate.image.pullPolicy }}
        oidc:
          issuer: {{ .Values.deployGate.oidc.issuer | quote }}
          jwksURL: {{ .Values.deployGate.oidc.jwksURL | quote }}
        githubAPI: {{ .Values.deployGate.githubAPI | quote }}
        platformRepository: {{ .Values.deployGate.platformRepository | quote }}
        appSecret: {{ .Values.deployGate.appSecret }}
        ghcrSecret: {{ .Values.deployGate.ghcrSecret }}
  destination:
    {{- include "iidp-bootstrap.destination" . | nindent 4 }}
    namespace: argocd
  syncPolicy:
    {{- include "iidp-bootstrap.syncPolicy" (list) | nindent 4 }}
