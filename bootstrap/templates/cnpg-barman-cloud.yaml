{{- $v := include "iidp-bootstrap.versions" . | fromYaml }}
# The plugin's TLS to the operator comes from cert-manager, so this skips the
# dry run and retries until the cert-manager CRDs exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-barman-cloud
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ $v.cloudnativePG.repository }}
    chart: plugin-barman-cloud
    targetRevision: {{ $v.cloudnativePG.barmanCloudPluginChart | quote }}
    helm:
      releaseName: cnpg-barman-cloud
      valuesObject:
        crds:
          create: true
  destination:
    {{- include "iidp-bootstrap.destination" . | nindent 4 }}
    namespace: cnpg-system
  syncPolicy:
    {{- include "iidp-bootstrap.syncPolicy" (list "SkipDryRunOnMissingResource=true") | nindent 4 }}
