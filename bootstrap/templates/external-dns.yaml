{{- $v := include "iidp-bootstrap.versions" . | fromYaml }}
# The sync policy with TXT ownership creates, updates and deletes only records
# external-dns created itself; other records in the zone are never touched.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ $v.externalDNS.repository }}
    chart: external-dns
    targetRevision: {{ $v.externalDNS.chart | quote }}
    helm:
      releaseName: external-dns
      valuesObject:
        provider:
          name: cloudflare
        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                # SOPS-encrypted in the Platform repository (see README.md).
                name: cloudflare-api-token
                key: apiToken
        sources:
          - ingress
        policy: sync
        registry: txt
        txtOwnerId: {{ .Values.dnsOwnerId }}
        domainFilters:
          - {{ .Values.cloudflareZone }}
  destination:
    {{- include "iidp-bootstrap.destination" . | nindent 4 }}
    namespace: external-dns
  syncPolicy:
    {{- include "iidp-bootstrap.syncPolicy" (list) | nindent 4 }}
