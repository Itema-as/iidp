{{- if .Values.argus.enabled }}
# Argus, the live view of the Platform, behind Itema login.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision | quote }}
    path: bootstrap/components/argus
    helm:
      releaseName: argus
      valuesObject:
        baseDomain: {{ .Values.baseDomain }}
        bootstrapRevision: {{ .Values.bootstrap.targetRevision | quote }}
        links:
          argocdURL: {{ .Values.argocdURL | quote }}
          grafanaURL: {{ .Values.grafanaURL | default "" | quote }}
          platformRepository: {{ .Values.deployGate.platformRepository | quote }}
          bootstrapRepository: {{ .Values.bootstrap.repoURL | quote }}
        image:
          repository: {{ .Values.argus.image.repository }}
          tag: {{ .Values.argus.image.tag | quote }}
          pullPolicy: {{ .Values.argus.image.pullPolicy }}
  destination:
    {{- include "iidp-bootstrap.destination" . | nindent 4 }}
    namespace: argus
  syncPolicy:
    {{- include "iidp-bootstrap.syncPolicy" (list) | nindent 4 }}
{{- end }}
