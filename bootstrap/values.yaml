# Values for the Platform bootstrap. On the Platform these come from
# platform.yaml at the root of the Platform repository, which the Application
# `platform-components` passes as a Helm value file (see README.md). The
# defaults here describe a Platform that does not exist; every field the
# bootstrap reads is listed so the file doubles as documentation.
#
# platform.yaml also carries fields only the CLI reads (chartVersion,
# githubApp, agePublicKey, grafanaURL, backupsBucket). Helm ignores them.

# The domain Applications are served under: <application>.<baseDomain>. The
# wildcard certificate covers *.<baseDomain> and <baseDomain>.
baseDomain: app.itma.no

# The Cloudflare zone that contains baseDomain. external-dns only manages
# records in this zone.
cloudflareZone: itma.no

# Where ArgoCD is served. Its host must be covered by the wildcard
# certificate, so keep it under baseDomain.
argocdURL: https://argocd.app.itma.no

# ACME registration for the wildcard certificate. The email is optional for
# Let's Encrypt but is where expiry warnings go. Point server at
# https://acme-staging-v02.api.letsencrypt.org/directory to test without
# spending production rate limits.
acme:
  email: ""
  server: https://acme-v02.api.letsencrypt.org/directory

# Object id of the Entra ID group whose members are ArgoCD admins. Everyone
# else who can log in is read-only. Empty means nobody is admin through the
# UI; the Platform admin still has `argocd --core` with the kubeconfig.
argocdAdminGroup: ""

# Cluster label on everything shipped to Grafana Cloud.
clusterName: iidp

# The --txt-owner-id external-dns stamps on the records it creates. Change it
# only for a second Platform sharing the same zone.
dnsOwnerId: iidp

# The Itema login Capability's oauth2-proxy. skipOIDCDiscovery is for a
# cloud-less test cluster only (kind has no route to
# login.microsoftonline.com): it makes oauth2-proxy skip the OIDC discovery
# call at startup and use the manual endpoints below instead, so the pod
# still starts with a dummy tenant and client id. A real Platform leaves it
# false and gets normal OIDC discovery against Entra ID.
oauth2Proxy:
  skipOIDCDiscovery: false

# The Deploy gate (templates/deploy-gate.yaml), served at
# https://deploy.<baseDomain>. Everything here has a working default for the
# Platform; the kind harness's fixture platform.yaml overrides the image,
# the OIDC issuer, the GitHub API and the Platform repository with its own
# stand-ins.
deployGate:
  # Itema-as's numeric GitHub org id. A deploy's OIDC token
  # (repository_owner_id) and the Application's binding
  # (applications/<name>/repository.yaml) must both carry it.
  githubOrgId: 1230559
  image:
    repository: ghcr.io/itema-as/iidp-deploy-gate
    # Empty: the version of the bootstrap release pinned in the Platform
    # repository's platform-components.yaml (v1.2.3 runs 1.2.3).
    tag: ""
    pullPolicy: IfNotPresent
  oidc:
    issuer: https://token.actions.githubusercontent.com
    # Empty: <issuer>/.well-known/jwks.
    jwksURL: ""
  # Empty: https://api.github.com.
  githubAPI: ""
  platformRepository: https://github.com/Itema-as/iidp-platform.git
  # ArgoCD's credential for the Platform repository, in the argocd
  # namespace, written by cloud-init: the gate reads the iidp-deploy App's
  # id, installation id and key from it.
  appSecret: platform-repo-github-app
  # The GHCR pull token (keys username and token), in the argocd
  # namespace, written by cloud-init from the same OpenTofu variables as
  # the node's registries.yaml: the gate checks that an image tag exists
  # with it before committing the tag.
  ghcrSecret: ghcr-pull-token

# Where this chart lives, for the component Applications that point back at
# it (bootstrap/components/*). The Platform repository sets both from ArgoCD's
# build environment so they always match the pinned bootstrap revision.
bootstrap:
  repoURL: https://github.com/Itema-as/iidp.git
  targetRevision: HEAD
