# On the Platform these values come from platform.yaml in the Platform
# repository, which also carries fields only the CLI reads; Helm ignores them.
# Every field the bootstrap reads is listed here.

# The domain Applications are served under: <application>.<baseDomain>. The
# wildcard certificate covers *.<baseDomain> and <baseDomain>.
baseDomain: app.itma.no

# The Cloudflare zone that contains baseDomain. external-dns only manages
# records in this zone. It is also the domain the Itema login cookie is set
# for; empty means baseDomain. A baseDomain outside it fails rendering.
cloudflareZone: itma.no

# Where ArgoCD is served. Its host must be covered by the wildcard
# certificate, so keep it under baseDomain.
argocdURL: https://argocd.app.itma.no

# The Grafana Cloud stack, such as https://itema.grafana.net. The CLI
# prints it; Argus's detail card links an Environment's logs there. Empty
# leaves those links out.
grafanaURL: ""

# ACME registration for the wildcard certificate. The email is optional for
# Let's Encrypt but is where expiry warnings go. Point server at
# https://acme-staging-v02.api.letsencrypt.org/directory to test without
# spending production rate limits.
acme:
  email: ""
  server: https://acme-v02.api.letsencrypt.org/directory

# Object id of the Entra ID group whose members are ArgoCD admins. Everyone
# else who can log in is read-only. Empty means nobody is admin through the
# UI; the Platform admin still has `argocd --core` with the kubeconfig.
argocdAdminGroup: ""

# Cluster label on everything shipped to Grafana Cloud.
clusterName: iidp

# The --txt-owner-id external-dns stamps on the records it creates. Change it
# only for a second Platform sharing the same zone.
dnsOwnerId: iidp

# skipOIDCDiscovery is for kind only, which has no route to
# login.microsoftonline.com: oauth2-proxy then starts with dummy endpoints.
oauth2Proxy:
  skipOIDCDiscovery: false

# The Deploy gate, served at https://deploy.<baseDomain>.
deployGate:
  # Itema-as's numeric GitHub org id. A deploy's OIDC token
  # (repository_owner_id) and the Application's binding
  # (applications/<name>/repository.yaml) must both carry it.
  githubOrgId: 1230559
  image:
    repository: ghcr.io/itema-as/iidp-deploy-gate
    # Empty: the version of the bootstrap release pinned in the Platform
    # repository's platform-components.yaml (v1.2.3 runs 1.2.3).
    tag: ""
    pullPolicy: IfNotPresent
  oidc:
    issuer: https://token.actions.githubusercontent.com
    # Empty: <issuer>/.well-known/jwks.
    jwksURL: ""
  # Empty: https://api.github.com.
  githubAPI: ""
  platformRepository: https://github.com/Itema-as/iidp-platform.git
  # ArgoCD's credential for the Platform repository, written by cloud-init:
  # the iidp-deploy App's id, installation id and key.
  appSecret: platform-repo-github-app
  # The GHCR pull token (keys username and token), written by cloud-init.
  # The gate uses it to check that an image tag exists before committing it.
  ghcrSecret: ghcr-pull-token

# Argus, the read-only live view of the Platform at https://argus.<baseDomain>.
argus:
  enabled: true
  image:
    repository: ghcr.io/itema-as/iidp-argus
    # Empty: the version of the bootstrap release pinned in the Platform
    # repository's platform-components.yaml (v1.2.3 runs 1.2.3).
    tag: ""
    pullPolicy: IfNotPresent

# The guardrails on Application namespaces (see README.md, "Guardrails").
guardrails:
  # What the policy bindings do when a check fails. Warn and Audit let the
  # request through; [Deny, Audit] enforces. Deny and Warn together are
  # refused.
  validationActions: [Warn, Audit]
  # Images allowed in Application namespaces besides the Platform's own list
  # in components/guardrails. An entry ending in "/" is a prefix, any other
  # one repository. For a test Platform whose fixtures run public images.
  extraAllowedImages: []

# Where this chart lives, for the component Applications that point back at
# it. The Platform repository sets both from ArgoCD's build environment so
# they match the pinned bootstrap revision.
bootstrap:
  repoURL: https://github.com/Itema-as/iidp.git
  targetRevision: HEAD
