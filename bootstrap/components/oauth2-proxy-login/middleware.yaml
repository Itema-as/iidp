# The Itema login Capability's Traefik middleware. The application chart
# annotates every Ingress of a protected Environment with its name and
# namespace, so both must match exactly.
#
# This is oauth2-proxy's "ForwardAuth with Static Upstreams" shape: every
# request is checked against oauth2-proxy's root address, whose static
# upstream answers 200 once the session cookie is valid. Without a session,
# oauth2-proxy answers a browser with its own 302 to Entra ID, and Traefik
# returns a non-2xx auth response to the client as it is. A request that
# accepts only JSON gets a 401 instead.
#
# An Environment with sign-in groups gets its own copy of this Middleware
# from the application chart, with ?allowed_groups=<ids> on the address.
# chart/application/login_test.go requires that copy to match this spec apart
# from the query, so change both together.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: itema-login-auth
  namespace: oauth2-proxy
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-Groups
