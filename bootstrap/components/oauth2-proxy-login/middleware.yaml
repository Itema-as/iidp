# The Itema login Capability's Traefik middleware. The chart annotates a
# Platform-address Ingress with traefik.ingress.kubernetes.io/router.middlewares
# naming it (chart/application/templates/ingress.yaml); its name and this
# namespace must match exactly.
#
# itema-login-auth is the documented "ForwardAuth with Static Upstreams"
# shape (oauth2-proxy's "Configuration > Integrations > Traefik"): every
# request is checked against oauth2-proxy's root address, the proxy path,
# whose alpha-config static upstream answers 200 once the session cookie is
# valid. Without one, oauth2-proxy runs with skip-provider-button
# (oauth2-proxy.yaml), so it answers a browser with its own 302 to Entra ID:
# Location, the CSRF cookie, and a state carrying the original URL, which
# it builds from the X-Forwarded-Proto/-Host/-Uri headers ForwardAuth adds
# (reverse-proxy mode). Traefik returns a non-2xx auth response to the
# client as it is, headers included. A request that accepts only JSON gets
# a 401 instead, since a redirect is no use to it.
#
# authResponseHeaders copies the headers injectResponseHeaders adds
# (oauth2-proxy.yaml) onto the request Traefik forwards to the protected
# Application once oauth2-proxy answers 200; X-Auth-Request-Email is the
# header carrying the signed-in user's email address.
#
# docs/implementation-notes/77-login-redirect.md has why this replaced the
# /oauth2/auth plus errors-middleware shape, and when the errors
# middleware was removed.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: itema-login-auth
  namespace: oauth2-proxy
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-Groups
