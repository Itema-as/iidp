# The Itema login Middleware for custom domains outside the login cookie
# domain: itema-login-auth (middleware.yaml), pointed at the host-only
# oauth2-proxy, whose callback and cookies stay on the requested host. The
# application chart names it on the Ingress that carries such hosts.
#
# An Environment with sign-in groups gets its own copy of this Middleware
# from the application chart, with ?allowed_groups=<ids> on the address.
# bootstrap_test.go requires this spec to match itema-login-auth apart from
# the address, and chart/application/login_test.go requires the copy to
# match this one apart from the query, so change all of them together.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: itema-login-host-auth
  namespace: oauth2-proxy
spec:
  forwardAuth:
    address: http://oauth2-proxy-host.oauth2-proxy.svc.cluster.local/
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-Groups
