# An Ingress with TLS on and no secretName of its own is served with the
# wildcard, so no Secret is copied into Application namespaces.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: {{ .Values.traefikNamespace }}
spec:
  defaultCertificate:
    secretName: {{ .Values.wildcardSecretName }}
