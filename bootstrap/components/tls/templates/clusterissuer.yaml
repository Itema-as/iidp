# Let's Encrypt through Cloudflare DNS-01, the only challenge that can issue
# a wildcard. No solver selector: any name in a zone the token can edit can
# be issued, which is what custom domains on Cloudflare zones need.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: {{ .Values.acme.server }}
    {{- if .Values.acme.email }}
    email: {{ .Values.acme.email }}
    {{- end }}
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ .Values.cloudflareTokenSecret.name }}
              key: {{ .Values.cloudflareTokenSecret.key }}
