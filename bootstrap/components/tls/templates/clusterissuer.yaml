# Let's Encrypt through Cloudflare DNS-01, the only challenge that can issue
# a wildcard. Its one use is the Platform's wildcard certificate; custom
# domains get theirs from letsencrypt-http01, even inside cloudflareZone.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: {{ .Values.acme.server }}
    {{- if .Values.acme.email }}
    email: {{ .Values.acme.email }}
    {{- end }}
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ .Values.cloudflareTokenSecret.name }}
              key: {{ .Values.cloudflareTokenSecret.key }}
