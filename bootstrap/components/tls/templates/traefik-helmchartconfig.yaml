# Redirect plain HTTP to HTTPS cluster-wide, so no Ingress has to. k3s
# installs Traefik through its helm-controller, and a HelmChartConfig named
# after the chart is how its values are overridden (docs.k3s.io,
# "Customizing packaged components").
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: {{ .Values.traefikNamespace }}
spec:
  valuesContent: |-
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
