# Let's Encrypt through HTTP-01 on Traefik, for every custom domain the
# wildcard doesn't cover, wherever its DNS is. Issuing succeeds once the host
# resolves to the Platform.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-http01
spec:
  acme:
    server: {{ .Values.acme.server }}
    {{- if .Values.acme.email }}
    email: {{ .Values.acme.email }}
    {{- end }}
    privateKeySecretRef:
      name: letsencrypt-http01-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            # The solver's Service lives in the Application's namespace,
            # where the guardrails refuse cert-manager's default, NodePort.
            serviceType: ClusterIP
