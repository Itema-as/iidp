# Set by the argus Application in the bootstrap; the defaults are
# placeholders.

# Argus is served at https://argus.<baseDomain>.
baseDomain: app.itma.no

image:
  repository: ghcr.io/itema-as/iidp-argus
  # Empty: bootstrapRevision without its leading v, so bumping the bootstrap
  # pin bumps Argus with it.
  tag: ""
  pullPolicy: IfNotPresent

# The bootstrap revision the Platform repository pins (a v* release tag).
bootstrapRevision: ""

# Where Argus's detail card links out to. Empty leaves that link out.
links:
  argocdURL: ""
  grafanaURL: ""
  platformRepository: ""
  bootstrapRepository: ""

# The memory limit leaves headroom over the steady request, so a spike
# restarts Argus rather than squeezing Applications on the node. No CPU
# limit: it is idle between changes, and throttling would only slow its
# first look at the cluster.
resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 96Mi

# The Go runtime's soft memory limit (GOMEMLIMIT): the garbage collector
# works harder as the heap nears it, well before the container's limit.
memoryTarget: 48MiB
