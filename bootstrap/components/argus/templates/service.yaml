apiVersion: v1
kind: Service
metadata:
  name: iidp-argus
  labels:
    {{- include "argus.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: iidp-argus
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# https://argus.<baseDomain>, behind Itema login: the bootstrap's shared
# ForwardAuth middleware (bootstrap/components/oauth2-proxy-login), the
# same annotation the application chart puts on a protected Environment's
# Ingress, so anyone in the Entra tenant can open it (#101). TLS with no
# secret of its own, so Traefik serves the default store's wildcard
# certificate. external-dns makes its DNS record from the host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iidp-argus
  labels:
    {{- include "argus.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy-itema-login-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ include "argus.host" . }}
  rules:
    - host: {{ include "argus.host" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iidp-argus
                port:
                  name: http
