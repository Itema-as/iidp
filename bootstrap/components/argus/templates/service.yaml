apiVersion: v1
kind: Service
metadata:
  name: iidp-argus
  labels:
    {{- include "argus.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: iidp-argus
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# Behind Itema login, so anyone in the Entra tenant can open it. TLS with no
# secret of its own: Traefik serves the default store's wildcard certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iidp-argus
  labels:
    {{- include "argus.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy-itema-login-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ include "argus.host" . }}
  rules:
    - host: {{ include "argus.host" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iidp-argus
                port:
                  name: http
