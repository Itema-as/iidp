# Read-only access to the kinds Argus's informers watch. A ClusterRole
# because Environment namespaces come and go and RBAC cannot select
# namespaces by label; the informers narrow themselves by label, namespace
# and field selector.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iidp-argus
  labels:
    {{- include "argus.labels" . | nindent 4 }}
# Not mounted into every pod that uses this service account; Argus's
# Deployment asks for the token itself.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iidp-argus
  labels:
    {{- include "argus.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # Events, the Deploy gate's among them, are read through core v1.
  - apiGroups: [""]
    resources: ["pods", "events", "nodes"]
    verbs: ["get", "list", "watch"]
  # Whether an Environment has Itema login is read from its Ingresses'
  # annotation.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: iidp-argus
  labels:
    {{- include "argus.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: iidp-argus
subjects:
  - kind: ServiceAccount
    name: iidp-argus
    namespace: {{ .Release.Namespace }}
