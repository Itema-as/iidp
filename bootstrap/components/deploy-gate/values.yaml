# Set by the deploy-gate Application in the bootstrap; the defaults are
# placeholders.

# The gate is served at https://deploy.<baseDomain>. That URL is also the
# audience every OIDC token must carry.
baseDomain: app.itma.no

# The numeric id of the GitHub org whose repositories may deploy
# (Itema-as). A token's repository_owner_id and an Application's binding
# must both carry it.
githubOrgId: 1230559

image:
  repository: ghcr.io/itema-as/iidp-deploy-gate
  # Empty: bootstrapRevision without its leading v, so bumping the bootstrap
  # pin bumps the gate with it.
  tag: ""
  pullPolicy: IfNotPresent

# The bootstrap revision the Platform repository pins (a v* release tag).
bootstrapRevision: ""

oidc:
  # GitHub Actions' OIDC issuer. Only a test cluster points it elsewhere.
  issuer: https://token.actions.githubusercontent.com
  # Where the issuer publishes its signing keys; empty means
  # <issuer>/.well-known/jwks.
  jwksURL: ""

# The GitHub REST API root; empty means https://api.github.com.
githubAPI: ""

# The Platform repository the gate writes image tags to.
platformRepository: https://github.com/Itema-as/iidp-platform.git

# The Secret holding the iidp-deploy GitHub App credential, in the gate's
# namespace: ArgoCD's own credential for the Platform repository.
appSecret: platform-repo-github-app

# The Secret holding the GHCR pull token the gate checks that an image tag
# exists with, in the same namespace (keys username and token).
ghcrSecret: ghcr-pull-token

# Small on purpose: the node and the kind runner are near their CPU request
# limits, and a call is a shallow clone and a push or a few list calls.
resources:
  requests:
    cpu: 5m
    memory: 32Mi
  limits:
    memory: 128Mi
