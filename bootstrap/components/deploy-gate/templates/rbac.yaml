# Reads are for iidp app status and are list only: every read is one list
# call narrowed by label. The two writes, both in argocd, are separate Roles.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iidp-deploy-gate
  labels:
    {{- include "deploy-gate.labels" . | nindent 4 }}
# Not mounted into every pod that uses this service account; the gate's
# Deployment asks for the token itself.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iidp-deploy-gate-status
  labels:
    {{- include "deploy-gate.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iidp-deploy-gate-status
  labels:
    {{- include "deploy-gate.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iidp-deploy-gate-status
subjects:
  - kind: ServiceAccount
    name: iidp-deploy-gate
    namespace: {{ .Release.Namespace }}
---
# After a Deploy or Promote commit the gate sets argocd.argoproj.io/refresh
# on the Environment's ArgoCD Application, so ArgoCD looks at the new commit
# now rather than at its next poll.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iidp-deploy-gate-refresh
  labels:
    {{- include "deploy-gate.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iidp-deploy-gate-refresh
  labels:
    {{- include "deploy-gate.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iidp-deploy-gate-refresh
subjects:
  - kind: ServiceAccount
    name: iidp-deploy-gate
    namespace: {{ .Release.Namespace }}
---
# Cluster-wide because Environment namespaces come and go and RBAC cannot
# select namespaces by label; the gate only lists in the namespaces its
# ArgoCD Applications name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iidp-deploy-gate-status
  labels:
    {{- include "deploy-gate.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: iidp-deploy-gate-status
  labels:
    {{- include "deploy-gate.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: iidp-deploy-gate-status
subjects:
  - kind: ServiceAccount
    name: iidp-deploy-gate
    namespace: {{ .Release.Namespace }}
---
# An Event for each Deploy or Promote. An Event lives in the namespace of
# the object it points at, the Environment's ArgoCD Application, so this is
# limited to argocd.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iidp-deploy-gate-events
  labels:
    {{- include "deploy-gate.labels" . | nindent 4 }}
rules:
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iidp-deploy-gate-events
  labels:
    {{- include "deploy-gate.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iidp-deploy-gate-events
subjects:
  - kind: ServiceAccount
    name: iidp-deploy-gate
    namespace: {{ .Release.Namespace }}
