apiVersion: v1
kind: Service
metadata:
  name: iidp-deploy-gate
  labels:
    {{- include "deploy-gate.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: iidp-deploy-gate
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# https://deploy.<baseDomain>: TLS with no secret of its own, so Traefik
# serves the default store's wildcard certificate (platform-tls), the same
# way ArgoCD's and the Itema login's Ingresses do.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iidp-deploy-gate
  labels:
    {{- include "deploy-gate.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ include "deploy-gate.host" . }}
  rules:
    - host: {{ include "deploy-gate.host" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iidp-deploy-gate
                port:
                  name: http
