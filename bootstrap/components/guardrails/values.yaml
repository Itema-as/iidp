# Set by the guardrails Application in the bootstrap; the defaults describe
# the Platform.

# Ingress hosts in an Application namespace must be under this domain (any
# depth, not the domain itself) or among the Environment's own declared
# domains.
baseDomain: app.itma.no

# What a failed check does, for every binding. [Deny, Audit] enforces.
# Kubernetes refuses Deny together with Warn, and so does this chart.
validationActions:
  - Warn
  - Audit

# Where a container image in an Application namespace may come from. An
# entry ending in "/" is a prefix (a registry, or an organisation on one);
# any other entry is one repository, matched with any tag or digest
# (<entry>:<tag> or <entry>@<digest>) and nothing else.
#
# - ghcr.io/itema-as/: every Application image and the Platform's own.
# - The CloudNativePG images the operator and the Barman Cloud plugin put
#   into every Postgres Pod without the chart naming them. Repositories, not
#   tags, so the tags can follow the pinned operator and plugin versions.
# - The final backup hook's kubectl image, by repository so a chart that
#   moves its digest is not refused by an older bootstrap: a refused hook
#   would block the Environment's deletion.
# - cert-manager's HTTP-01 solver, which runs in the Application's namespace
#   while it issues a certificate for a custom domain.
allowedImages:
  - ghcr.io/itema-as/
  - ghcr.io/cloudnative-pg/cloudnative-pg
  - ghcr.io/cloudnative-pg/postgresql
  - ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar
  - docker.io/bitnami/kubectl
  - quay.io/jetstack/cert-manager-acmesolver

# More entries, same format, for test Platforms whose fixtures run public
# images.
extraAllowedImages: []

# The ConfigMap, in each Application namespace, whose keys are the
# Environment's declared custom domains. The application chart renders it.
declaredDomainsConfigMap: iidp-domains

# The Namespace label that marks an Application namespace. The CLI sets it
# through each Environment's ArgoCD Application; Platform namespaces never
# carry it.
applicationNamespaceLabel: iidp.itema.no/application
