# The guardrails on Application namespaces, one ValidatingAdmissionPolicy
# per rule. Pod Security is the other half: the namespace labels the CLI
# writes.
#
# Every policy fails closed: an expression that cannot be evaluated counts as
# a failed check, which the bindings' actions then report or deny.
#
# Images only from the allowed list.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: iidp-images
  labels:
    app.kubernetes.io/part-of: iidp
spec:
  failurePolicy: Fail
  matchConstraints:
    {{- include "guardrails.podRules" . | nindent 4 }}
  matchConditions:
    # A Pod being deleted is updated once more when its finalizers are
    # removed; refusing that update would leave it stuck.
    - name: not-being-deleted
      expression: "!has(object.metadata.deletionTimestamp)"
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: allowed
      expression: {{ include "guardrails.allowedImagesCEL" . | quote }}
    - name: refused
      expression: >-
        variables.containers.filter(c, !has(c.image) || !variables.allowed.exists(p,
        p.endsWith('/') ? c.image.startsWith(p) : (c.image.startsWith(p + ':') || c.image.startsWith(p + '@'))))
  validations:
    - expression: size(variables.refused) == 0
      reason: Forbidden
      messageExpression: >-
        'iidp-images: container images in an Application namespace must come from ghcr.io/itema-as/ (or be one of the Platform images the chart runs); refused: ' +
        variables.refused.map(c, c.name + '=' + (has(c.image) ? c.image : '(no image)')).join(', ')
---
{{ include "guardrails.binding" (list . "iidp-images") }}
---
# CPU and memory limits on every container, init containers included.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: iidp-limits
  labels:
    app.kubernetes.io/part-of: iidp
spec:
  failurePolicy: Fail
  matchConstraints:
    {{- include "guardrails.podRules" . | nindent 4 }}
  matchConditions:
    - name: not-being-deleted
      expression: "!has(object.metadata.deletionTimestamp)"
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: unlimited
      expression: >-
        variables.containers.filter(c, !has(c.resources) || !has(c.resources.limits) ||
        !('cpu' in c.resources.limits) || !('memory' in c.resources.limits))
  validations:
    - expression: size(variables.unlimited) == 0
      reason: Forbidden
      messageExpression: >-
        'iidp-limits: every container in an Application namespace needs CPU and memory limits; missing on: ' +
        variables.unlimited.map(c, c.name).join(', ')
---
{{ include "guardrails.binding" (list . "iidp-limits") }}
---
# No Service of type NodePort or LoadBalancer: Applications are reached
# through Traefik only. cert-manager's HTTP-01 solver Service would be a
# NodePort by default; the letsencrypt-http01 ClusterIssuer makes it a
# ClusterIP.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: iidp-service-types
  labels:
    app.kubernetes.io/part-of: iidp
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  matchConditions:
    - name: not-being-deleted
      expression: "!has(object.metadata.deletionTimestamp)"
  validations:
    - expression: "!has(object.spec.type) || !(object.spec.type in ['NodePort', 'LoadBalancer'])"
      reason: Forbidden
      messageExpression: >-
        'iidp-service-types: Service ' + object.metadata.name + ' is of type ' + object.spec.type +
        '; an Application namespace only has ClusterIP Services, reached through Traefik'
---
{{ include "guardrails.binding" (list . "iidp-service-types") }}
---
# Ingress hosts only under baseDomain or among the Environment's declared
# domains, the keys of the declaredDomainsConfigMap in the Ingress's own
# namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: iidp-ingress-hosts
  labels:
    app.kubernetes.io/part-of: iidp
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
  matchConditions:
    - name: not-being-deleted
      expression: "!has(object.metadata.deletionTimestamp)"
  variables:
    - name: suffix
      expression: {{ printf "'.%s'" (required "baseDomain is required" .Values.baseDomain | toString) | quote }}
    - name: refused
      expression: >-
        has(object.spec.rules) ? object.spec.rules.filter(r, !has(r.host) ||
        !(r.host.endsWith(variables.suffix) || (has(params.data) && r.host in params.data)))
        .map(r, has(r.host) ? r.host : '(no host: every host)') : []
  validations:
    - expression: "!has(object.spec.defaultBackend)"
      reason: Forbidden
      messageExpression: >-
        'iidp-ingress-hosts: Ingress ' + object.metadata.name + ' has a defaultBackend, which answers for every host'
    - expression: size(variables.refused) == 0
      reason: Forbidden
      messageExpression: >-
        'iidp-ingress-hosts: Ingress ' + object.metadata.name + ' may only serve hosts under ' + variables.suffix.substring(1) +
        ' or among the declared domains of the Environment; refused: ' + variables.refused.join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: iidp-ingress-hosts
  labels:
    app.kubernetes.io/part-of: iidp
spec:
  policyName: iidp-ingress-hosts
  validationActions: {{ include "guardrails.validationActions" . }}
  # With no namespace, paramRef looks in the Ingress's own namespace.
  #
  # A missing ConfigMap skips the policy for that Ingress. A
  # parameterNotFoundAction of Deny would refuse the request outright
  # whatever validationActions say, because the API server treats a missing
  # param as a misconfigured binding, not a failed check; an Environment
  # rendered by an older chart without the ConfigMap would then have every
  # Ingress update refused.
  paramRef:
    name: {{ .Values.declaredDomainsConfigMap }}
    parameterNotFoundAction: Allow
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: {{ .Values.applicationNamespaceLabel }}
          operator: Exists
