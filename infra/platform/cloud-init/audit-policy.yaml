# The API server's audit policy, on the node and in the kind harness. It
# exists for the guardrails: their Audit action records a failed check as an
# annotation on the request's audit event. Only writes to the objects the
# guardrails and Pod Security check are logged, at Metadata level, so never
# an object's body.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  - level: Metadata
    verbs: ["create", "update", "patch"]
    resources:
      - group: ""
        resources: ["pods", "services"]
      - group: apps
        resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      - group: batch
        resources: ["jobs", "cronjobs"]
      - group: networking.k8s.io
        resources: ["ingresses"]
  - level: None
