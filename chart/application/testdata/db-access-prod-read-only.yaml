# prod opened read-only to maintainers, with its password named.
application:
  name: shop
environment: prod
platform:
  baseDomain: app.itma.no
  backupsBucket: itema-iidp-db-backups
  objectStorageEndpoint: https://hel1.your-objectstorage.com
kind: web-service
image:
  repository: ghcr.io/itema-as/shop
  tag: 1.4.2
postgres:
  enabled: true
  access:
    readWrite: none
    readOnly: maintain
  readOnlyPasswordSecret: shop-db-read
