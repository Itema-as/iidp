application:
  name: shop
environment: prod
platform:
  baseDomain: app.itma.no
  loginCookieDomain: itma.no
kind: web-service
image:
  repository: ghcr.io/itema-as/shop
  tag: 1.4.2
size: small
login:
  enabled: true
domains:
  # Directly under the base domain: the wildcard, on the Platform Ingress,
  # behind the shared login.
  - butikk.app.itma.no
  # Inside the cookie domain: the HTTP-01 Ingress, behind the shared login.
  - x.itma.no
  # Outside it: behind the host-only login, with their own /oauth2/ route.
  - shop.example.com
  # Ends with the cookie domain's characters but is not under it.
  - notitma.no
