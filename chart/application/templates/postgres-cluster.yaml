{{- include "application.validate" . -}}
{{- if and (include "application.released" .) (include "application.postgres.enabled" .) }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "application.postgres.cluster" . }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
  annotations:
    # Applied, and healthy, before the migration Job (wave -1) and the
    # Application's objects (wave 0).
    argocd.argoproj.io/sync-wave: "-2"
    # A sync never deletes the database, even when the values file stops
    # rendering it; the Application shows OutOfSync until someone deletes it
    # deliberately.
    {{- include "application.postgres.keepOnPrune" . | nindent 4 }}
spec:
  # One instance: the Platform is a single node, and durability comes from
  # the continuous backup, not from replicas.
  instances: 1
  # Stamped on the database Pods so Grafana Alloy attributes their logs to
  # the Environment. Not the selector labels: the Service must never route
  # to the database.
  inheritedMetadata:
    labels:
      iidp.itema.no/application: {{ include "application.name" . }}
      iidp.itema.no/environment: {{ include "application.environment" . }}
  bootstrap:
    initdb:
      database: {{ include "application.name" . }}
      owner: {{ include "application.name" . }}
  storage:
    size: 5Gi
  # A fixed size whatever the Application's size. CPU is requested at a
  # fifth of its limit, like every size.
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  {{- if include "application.postgres.backups" . }}
  # Without backups there is no plugin, and so no sidecar.
  plugins:
    - name: {{ include "application.postgres.backupPlugin" . }}
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "application.postgres.cluster" . }}
  {{- end }}
{{- end }}
