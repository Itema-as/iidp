{{- include "application.validate" . -}}
{{- if include "application.released" . }}
{{- $domains := include "application.domains" . | fromJson }}
# The Environment's declared custom domains, for the guardrails' Ingress-host
# policy, which looks this ConfigMap up by name. Rendered even with no
# domains, since the policy skips a namespace without it. The fixed name means
# one Environment per namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: iidp-domains
  labels:
    {{- include "application.labels" . | nindent 4 }}
  annotations:
    # Before the Ingresses of wave 0, so the policy already finds a newly
    # declared domain when its Ingress is applied.
    argocd.argoproj.io/sync-wave: "-1"
{{- $all := concat $domains.wildcard $domains.foreign | sortAlpha }}
{{- if $all }}
data:
  {{- range $all }}
  {{ . | quote }}: ""
  {{- end }}
{{- end }}
{{- end }}
