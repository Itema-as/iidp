{{- include "application.validate" . -}}
{{- $domains := include "application.domains" . | fromJson -}}
{{- if include "application.released" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "application.fullname" . }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
  annotations:
    # Plain HTTP is redirected to HTTPS by the Platform's Traefik.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- with include "application.login.annotation" . }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: traefik
  tls:
    # No secretName: Traefik serves its default, the wildcard certificate.
    - hosts:
        - {{ include "application.host" . }}
        {{- range $domains.wildcard }}
        - {{ . }}
        {{- end }}
  rules:
    - host: {{ include "application.host" . }}
      {{- include "application.ingressPaths" . | nindent 6 }}
    {{- range $domains.wildcard }}
    - host: {{ . }}
      {{- include "application.ingressPaths" $ | nindent 6 }}
    {{- end }}
{{- end }}
