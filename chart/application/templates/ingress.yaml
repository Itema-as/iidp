{{- include "application.validate" . -}}
{{- $domains := include "application.domains" . | fromJson -}}
{{- if include "application.released" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "application.fullname" . }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
  annotations:
    # Only the TLS entrypoint. Redirecting plain HTTP to HTTPS is an
    # entrypoint setting on the Platform's Traefik, not a per-Application one.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- if .Values.login.enabled }}
    # The Itema login Capability: the bootstrap's shared oauth2-proxy
    # ForwardAuth middleware, in oauth2-proxy's own namespace. An
    # unauthenticated browser gets oauth2-proxy's own redirect to Entra ID
    # (bootstrap/components/oauth2-proxy-login/middleware.yaml).
    traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy-itema-login-auth@kubernetescrd
    {{- end }}
spec:
  ingressClassName: traefik
  tls:
    # No secretName: the Platform's wildcard certificate is Traefik's default
    # certificate (the bootstrap's TLSStore), served for every host that
    # names no certificate of its own. Custom domains directly under the
    # base domain are covered by it too. Hosts that are not go on the
    # ingress-http01.yaml Ingress with certificates of their own.
    - hosts:
        - {{ include "application.host" . }}
        {{- range $domains.wildcard }}
        - {{ . }}
        {{- end }}
  rules:
    - host: {{ include "application.host" . }}
      {{- include "application.ingressPaths" . | nindent 6 }}
    {{- range $domains.wildcard }}
    - host: {{ . }}
      {{- include "application.ingressPaths" $ | nindent 6 }}
    {{- end }}
{{- end }}
