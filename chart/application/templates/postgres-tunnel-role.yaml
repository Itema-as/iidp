{{- include "application.validate" . -}}
{{- $open := list -}}
{{- range (include "application.postgres.accessRoles" . | fromJson).roles -}}
{{- if .open -}}
{{- $open = append $open . -}}
{{- end -}}
{{- end -}}
{{- if and (include "application.released" .) (include "application.postgres.enabled" .) $open }}
{{- /*
Lets the database tunnel read the password of each open database access
role, so it can log in as that role for a developer. resourceNames keeps it
to exactly those Secrets.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "application.postgres.tunnelRole" . }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      {{- range $open }}
      - {{ .secret }}
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "application.postgres.tunnelRole" . }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "application.postgres.tunnelRole" . }}
subjects:
  - kind: ServiceAccount
    name: {{ required "platform.databaseTunnel.serviceAccount is required" .Values.platform.databaseTunnel.serviceAccount }}
    namespace: {{ required "platform.databaseTunnel.namespace is required" .Values.platform.databaseTunnel.namespace }}
{{- end }}
