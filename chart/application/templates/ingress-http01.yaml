{{- include "application.validate" . -}}
{{- $domains := include "application.domains" . | fromJson -}}
{{- $hostOnly := (include "application.login.hostOnlyDomains" . | fromJson).hosts -}}
{{- if and (include "application.released" .) $domains.foreign }}
{{- /*
The custom domains the wildcard certificate does not cover. They sit on
their own Ingress because cert-manager's ingress-shim acts on the whole
object it finds the issuer annotation on, and must not try to issue for the
wildcard hosts.

It keeps every foreign host's certificate even when the host is routed by
the host-login Ingress, so turning login on or off never moves a
Certificate between Ingresses. Such a host is listed without paths: Traefik
loads its certificate from here and serves it by SNI to the other
Ingress's routers.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "application.fullname" . }}-http01
  labels:
    {{- include "application.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: {{ .Values.platform.httpIssuer | quote }}
    {{- with include "application.login.annotation" (list . false) }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: traefik
  tls:
    {{- range $domains.foreign }}
    - hosts:
        - {{ . }}
      secretName: {{ include "application.tlsSecretName" (list $ .) }}
    {{- end }}
  rules:
    {{- range $domains.foreign }}
    - host: {{ . }}
      {{- if not (has . $hostOnly) }}
      {{- include "application.ingressPaths" $ | nindent 6 }}
      {{- end }}
    {{- end }}
{{- end }}
