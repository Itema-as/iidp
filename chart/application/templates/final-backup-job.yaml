{{- include "application.validate" . -}}
{{- if and (include "application.released" .) (include "application.postgres.enabled" .) }}
{{- $name := include "application.postgres.finalBackupName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
    app.kubernetes.io/component: final-backup
  annotations:
    # Only the Job is a PreDelete hook. The ServiceAccount, Role and
    # RoleBinding above are ordinary chart resources instead: they exist
    # continuously while postgres.enabled, applied and pruned in the
    # Application's normal sync waves the same as the Cluster or the
    # Deployment, not created fresh at deletion time. This deliberately
    # narrows the surface from #39's original four PreDelete hook objects
    # to one: creating several hook resources together, each one's own
    # creation event asking ArgoCD to refresh the Application again, was
    # found (docs/implementation-notes/39-final-backup-predelete-hook.md)
    # to trigger a real ArgoCD race under concurrent reconciles, where
    # deletion proceeded without ever waiting for the hook Job's health.
    # With one hook object there is nothing left to create a flood of
    # refreshes, and no RBAC-before-Job ordering to get wrong: the
    # ServiceAccount the Job's Pod mounts already exists, the same way the
    # Cluster the Job's script talks to already exists.
    #
    # A PreDelete hook is created only when the Environment's own ArgoCD
    # Application is deleted (never during a normal sync, even with
    # prune), and ArgoCD waits for it to reach Healthy before it deletes
    # anything else and only then cleans it up; a failing hook blocks the
    # deletion with a DeletionError condition until it is fixed in git or
    # removed by hand. So this Job is guaranteed to run, and to finish or
    # fail, before the Cluster it targets is torn down.
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  # One attempt: a hook that failed once should be inspected (its logs kept
  # by BeforeHookCreation/HookSucceeded only removing it after success), not
  # retried blindly against a database that may be in a bad state.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "application.name" . }}
        app.kubernetes.io/component: final-backup
        iidp.itema.no/application: {{ include "application.name" . }}
        iidp.itema.no/environment: {{ include "application.environment" . }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      containers:
        - name: final-backup
          # Pinned to the Kubernetes minor the Platform runs
          # (bootstrap/versions.yaml's kind node image / infra's k3s pin):
          # see application.postgres.finalBackupKubectlImage in
          # _helpers.tpl for why bitnami/kubectl rather than the distroless
          # registry.k8s.io/kubectl.
          image: {{ include "application.postgres.finalBackupKubectlImage" . | quote }}
          command: ["bash", "-c"]
          args:
            - |
              set -eu
              NAMESPACE={{ .Release.Namespace | quote }}
              CLUSTER={{ include "application.postgres.cluster" . | quote }}
              PLUGIN={{ include "application.postgres.backupPlugin" . | quote }}
              FULLNAME={{ include "application.fullname" . | quote }}
              TIMEOUT={{ .Values.postgres.finalBackupTimeout | default 1800 }}
              # A run-time timestamp, not a Helm-render-time one: the Backup
              # is created imperatively by this script, so BeforeHookCreation
              # (which only reaches declared hook manifests) cannot dedupe
              # it, and a retried hook must not collide with a previous
              # attempt's Backup object.
              NAME="${FULLNAME}-final-$(date -u +%Y%m%d%H%M%S)"
              RETAIN_UNTIL="$(date -u -d '+30 days' +%Y-%m-%d)"
              echo "iidp: taking the final Backup ${NAME} of Cluster ${CLUSTER} in namespace ${NAMESPACE}, retain-until ${RETAIN_UNTIL}"
              cat <<BACKUPMANIFEST | kubectl apply -f -
              apiVersion: postgresql.cnpg.io/v1
              kind: Backup
              metadata:
                name: ${NAME}
                namespace: ${NAMESPACE}
                annotations:
                  iidp.itema.no/retain-until: "${RETAIN_UNTIL}"
              spec:
                cluster:
                  name: ${CLUSTER}
                method: plugin
                pluginConfiguration:
                  name: ${PLUGIN}
              BACKUPMANIFEST
              echo "iidp: waiting up to ${TIMEOUT}s for Backup ${NAME} to reach phase completed"
              ELAPSED=0
              while true; do
                PHASE="$(kubectl get backup "${NAME}" -n "${NAMESPACE}" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
                echo "iidp: [$(date -u +%H:%M:%S)Z] ${NAME} phase=${PHASE:-<none>} elapsed=${ELAPSED}s/${TIMEOUT}s"
                if [ "${PHASE}" = "completed" ]; then
                  echo "iidp: Backup ${NAME} completed"
                  exit 0
                fi
                if [ "${PHASE}" = "failed" ]; then
                  echo "iidp: Backup ${NAME} failed" >&2
                  exit 1
                fi
                if [ "${ELAPSED}" -ge "${TIMEOUT}" ]; then
                  echo "iidp: timed out after ${TIMEOUT}s waiting for Backup ${NAME} (last phase: ${PHASE:-<none>})" >&2
                  exit 1
                fi
                sleep 10
                ELAPSED=$((ELAPSED + 10))
              done
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          # bitnami/kubectl runs as uid 1001, whatever the Application's
          # image does.
          securityContext:
            {{- include "application.securityContext" (list . true) | nindent 12 }}
{{- end }}
