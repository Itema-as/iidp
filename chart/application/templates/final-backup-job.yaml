{{- include "application.validate" . -}}
{{- if and (include "application.released" .) (include "application.postgres.backups" .) }}
{{- $name := include "application.postgres.finalBackupName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
    app.kubernetes.io/component: final-backup
  annotations:
    # Only the Job is a hook; its RBAC above are ordinary resources. Several
    # PreDelete hook objects created together trigger an ArgoCD race in which
    # deletion goes ahead without waiting for the Job.
    #
    # ArgoCD runs a PreDelete hook only when the Environment's Application is
    # deleted, and deletes nothing else until it is Healthy; a failing hook
    # blocks the deletion until it is fixed in git or removed by hand.
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  # One attempt: a failed hook is kept for inspection, not retried blindly
  # against a database that may be in a bad state.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "application.name" . }}
        app.kubernetes.io/component: final-backup
        iidp.itema.no/application: {{ include "application.name" . }}
        iidp.itema.no/environment: {{ include "application.environment" . }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      containers:
        - name: final-backup
          image: {{ include "application.postgres.finalBackupKubectlImage" . | quote }}
          command: ["bash", "-c"]
          args:
            - |
              set -eu
              NAMESPACE={{ .Release.Namespace | quote }}
              CLUSTER={{ include "application.postgres.cluster" . | quote }}
              PLUGIN={{ include "application.postgres.backupPlugin" . | quote }}
              FULLNAME={{ include "application.fullname" . | quote }}
              TIMEOUT={{ .Values.postgres.finalBackupTimeout | default 1800 }}
              # A run-time timestamp, not a Helm-render-time one: the Backup
              # is created imperatively by this script, so BeforeHookCreation
              # (which only reaches declared hook manifests) cannot dedupe
              # it, and a retried hook must not collide with a previous
              # attempt's Backup object.
              NAME="${FULLNAME}-final-$(date -u +%Y%m%d%H%M%S)"
              RETAIN_UNTIL="$(date -u -d '+30 days' +%Y-%m-%d)"
              echo "iidp: taking the final Backup ${NAME} of Cluster ${CLUSTER} in namespace ${NAMESPACE}, retain-until ${RETAIN_UNTIL}"
              cat <<BACKUPMANIFEST | kubectl apply -f -
              apiVersion: postgresql.cnpg.io/v1
              kind: Backup
              metadata:
                name: ${NAME}
                namespace: ${NAMESPACE}
                annotations:
                  iidp.itema.no/retain-until: "${RETAIN_UNTIL}"
              spec:
                cluster:
                  name: ${CLUSTER}
                method: plugin
                pluginConfiguration:
                  name: ${PLUGIN}
              BACKUPMANIFEST
              echo "iidp: waiting up to ${TIMEOUT}s for Backup ${NAME} to reach phase completed"
              ELAPSED=0
              while true; do
                PHASE="$(kubectl get backup "${NAME}" -n "${NAMESPACE}" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
                echo "iidp: [$(date -u +%H:%M:%S)Z] ${NAME} phase=${PHASE:-<none>} elapsed=${ELAPSED}s/${TIMEOUT}s"
                if [ "${PHASE}" = "completed" ]; then
                  echo "iidp: Backup ${NAME} completed"
                  exit 0
                fi
                if [ "${PHASE}" = "failed" ]; then
                  echo "iidp: Backup ${NAME} failed" >&2
                  exit 1
                fi
                if [ "${ELAPSED}" -ge "${TIMEOUT}" ]; then
                  echo "iidp: timed out after ${TIMEOUT}s waiting for Backup ${NAME} (last phase: ${PHASE:-<none>})" >&2
                  exit 1
                fi
                sleep 10
                ELAPSED=$((ELAPSED + 10))
              done
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          # bitnami/kubectl runs as uid 1001, whatever the Application's
          # image does.
          securityContext:
            {{- include "application.securityContext" . | nindent 12 }}
{{- end }}
