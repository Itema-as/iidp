{{- include "application.validate" . -}}
{{- $hostOnly := (include "application.login.hostOnlyDomains" . | fromJson).hosts -}}
{{- if and (include "application.released" .) $hostOnly }}
{{- /*
The custom domains outside the login cookie domain, behind the host-only
login. Traefik applies an Ingress's middlewares to all of its hosts, so
these cannot share the HTTP-01 Ingress with hosts behind the shared login.
Their certificates stay on the HTTP-01 Ingress.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "application.fullname" . }}-host-login
  labels:
    {{- include "application.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- include "application.login.annotation" (list . true) | nindent 4 }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        {{- range $hostOnly }}
        - {{ . }}
        {{- end }}
  rules:
    {{- range $hostOnly }}
    - host: {{ . }}
      {{- include "application.ingressPaths" $ | nindent 6 }}
    {{- end }}
{{- end }}
