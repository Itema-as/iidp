{{- include "application.validate" . -}}
{{- if and (include "application.released" .) (include "application.postgres.enabled" .) .Values.postgres.migrationCommand }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "application.fullname" . }}-migrate
  labels:
    {{- include "application.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    # A Sync hook between the database and the Application's objects, so a
    # failed migration stops the rollout. A PreSync hook would run before the
    # Cluster exists on an Environment's first sync and never start.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # One attempt: a migration that failed once must not be retried blindly.
  backoffLimit: 0
  # A Job whose Pod never starts never fails, so ArgoCD would keep the sync
  # running for ever, which holds up the Environment's deletion. The deadline
  # counts Pending time too. 30 minutes leaves a preview's first sync room to
  # wait for its image to be built.
  activeDeadlineSeconds: 1800
  template:
    metadata:
      # Not the selector labels: the Service must never route to this Pod.
      labels:
        app.kubernetes.io/name: {{ include "application.name" . }}
        app.kubernetes.io/component: migration
        iidp.itema.no/application: {{ include "application.name" . }}
        iidp.itema.no/environment: {{ include "application.environment" . }}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "application.image" . | quote }}
          command:
            - sh
            - -c
            - {{ .Values.postgres.migrationCommand | toString | quote }}
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name | quote }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- include "application.postgres.databaseURLEnv" . | nindent 12 }}
          {{- with .Values.secrets }}
          # The same named Secrets the Application gets.
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . | toString | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- include "application.resources" . | nindent 12 }}
          securityContext:
            {{- include "application.securityContext" . | nindent 12 }}
{{- end }}
