{{- include "application.validate" . -}}
{{- $groups := include "application.login.groups" . -}}
{{- if and (include "application.released" .) .Values.login.enabled $groups }}
{{- /*
The bootstrap's itema-login-auth Middleware with allowed_groups added to the
address, and with custom domains outside the login cookie domain the same
copy of its itema-login-host-auth, which points at the host-only
oauth2-proxy. oauth2-proxy checks the groups once the session is valid and
answers a user in none of them with a plain 403: no redirect, so no loop.
*/}}
{{- $middlewares := list (dict "name" (include "application.login.middleware" .) "service" "oauth2-proxy") }}
{{- if (include "application.login.hostOnlyDomains" . | fromJson).hosts }}
{{- $middlewares = append $middlewares (dict "name" (include "application.login.hostMiddleware" .) "service" "oauth2-proxy-host") }}
{{- end }}
{{- range $middlewares }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .name }}
  labels:
    {{- include "application.labels" $ | nindent 4 }}
  annotations:
    # Before the Ingresses that name it: Traefik drops a router whose
    # middleware does not exist yet.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  forwardAuth:
    address: {{ printf "http://%s.oauth2-proxy.svc.cluster.local/?allowed_groups=%s" .service $groups | quote }}
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-Groups
{{- end }}
{{- end }}
