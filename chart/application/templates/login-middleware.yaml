{{- include "application.validate" . -}}
{{- $groups := include "application.login.groups" . -}}
{{- if and (include "application.released" .) .Values.login.enabled $groups }}
{{- /*
The bootstrap's shared itema-login-auth Middleware with allowed_groups added
to the address. oauth2-proxy checks it once the session is valid and answers
a user in none of the groups with a plain 403: no redirect, so no loop.
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "application.login.middleware" . }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
  annotations:
    # Before the Ingresses that name it: Traefik drops a router whose
    # middleware does not exist yet.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  forwardAuth:
    address: {{ printf "http://oauth2-proxy.oauth2-proxy.svc.cluster.local/?allowed_groups=%s" $groups | quote }}
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-Groups
{{- end }}
