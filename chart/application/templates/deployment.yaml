{{- include "application.validate" . -}}
{{- if include "application.released" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "application.fullname" . }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "application.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "application.labels" . | nindent 8 }}
    spec:
      # The preStop sleep below comes out of this budget, so the container
      # still gets Kubernetes' default 30 seconds after it to shut down.
      terminationGracePeriodSeconds: 35
      containers:
        - name: {{ include "application.name" . }}
          image: {{ include "application.image" . | quote }}
          # Kubernetes removes a terminating Pod from its endpoints at the
          # same time as it starts stopping the container, and Traefik
          # takes a moment to notice. Without the sleep, a rollout answers
          # 502 while Traefik still routes to the old Pod. A native sleep
          # action, so images without a sleep binary work too.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: http
              containerPort: {{ include "application.port" . }}
              protocol: TCP
          {{- $webService := eq (include "application.kind" .) "web-service" }}
          {{- if or $webService .Values.env .Values.postgres.enabled }}
          env:
            {{- if $webService }}
            - name: PORT
              value: {{ include "application.port" . | quote }}
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name | quote }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- if include "application.postgres.enabled" . }}
            {{- include "application.postgres.databaseURLEnv" . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.secrets }}
          # Every key of each named Secret becomes an environment variable.
          # The Secrets themselves are SOPS-encrypted next to the values file
          # in the Platform repository; the chart never sees their contents.
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . | toString | quote }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probe.path | quote }}
              port: http
          livenessProbe:
            httpGet:
              path: {{ .Values.probe.path | quote }}
              port: http
          resources:
            {{- include "application.resources" . | nindent 12 }}
{{- end }}
