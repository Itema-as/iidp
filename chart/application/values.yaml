# Values for one Environment of one Application. The CLI writes this file
# into the Platform repository. Conventions (probes, sizes, labels) live in
# the templates, not here.

application:
  # The Application's name: lowercase, DNS-safe, unique on the Platform.
  # Required.
  name: ""

# prod, staging, or pr-<number> for a Preview Environment.
environment: prod

platform:
  # The Platform base domain. Platform addresses are <name>.<baseDomain>
  # for prod and <name>-staging.<baseDomain> for staging. Required.
  baseDomain: ""
  # The ClusterIssuer for custom domains the wildcard does not cover.
  httpIssuer: letsencrypt-http01
  # The domain the Itema login cookie is set for, without the leading dot.
  # With login.enabled, every custom domain must be inside it. Empty means
  # baseDomain.
  loginCookieDomain: ""
  # The Object Storage bucket every Application database is backed up to.
  # Required when postgres.enabled.
  backupsBucket: ""
  # The S3 endpoint of the location the bucket lives in, for example
  # https://hel1.your-objectstorage.com. Required when postgres.enabled.
  objectStorageEndpoint: ""
  # The Secret holding the Object Storage access key (key ACCESS_KEY_ID) and
  # secret key (key ACCESS_SECRET_KEY) the backups are written with. It must
  # exist in the namespace the Environment is installed into.
  backupsCredentialsSecret: backups-credentials

# web-service (a container listening on port) or static-site (an nginx
# image listening on 8080). Either must run as a non-root user with a
# numeric UID.
kind: web-service

image:
  # Required, for example ghcr.io/itema-as/shop.
  repository: ""
  # The CI-written image tag. Empty means the Environment has not received
  # its first image yet, and the chart renders nothing (the rest of the file
  # is still validated).
  tag: ""

# small, medium or large.
size: small

# The port a Web service listens on, injected as PORT. A Static site ignores
# it and listens on 8080.
port: 3000

probe:
  # The path the readiness and liveness probes request.
  path: /

# Plain environment variables, name to value. Secrets do not go here, and
# neither does DATABASE_URL, which the Postgres Capability injects.
env: {}

# Names of Secrets in the Environment's namespace whose keys are all exposed
# to the container, and to the migration Job, as environment variables.
secrets: []

# Custom domains served in addition to the Platform address. A host
# directly under platform.baseDomain is covered by the wildcard certificate;
# any other gets its own from platform.httpIssuer. Outside the Platform's
# Cloudflare zone a host needs a CNAME to the Platform address.
domains: []

postgres:
  # A single-instance database of this Environment's own, with DATABASE_URL
  # injected and continuous backups.
  enabled: false
  # A shell command run from the Application image, with DATABASE_URL set,
  # before every rollout; a failing command stops the rollout. Empty means
  # the Application has no migrations. Needs enabled: true.
  migrationCommand: ""
  # How long backups and WAL are kept in the bucket: a number of days (d),
  # weeks (w) or months (m).
  backupRetention: 30d
  # Seconds the final Backup on Environment deletion may take before the
  # hook fails, which blocks the deletion. A large database may need more.
  finalBackupTimeout: 1800
  # false turns every backup off, the final one included. Preview
  # Environments set it. platform.backupsBucket and objectStorageEndpoint are
  # then not needed.
  backups: true

# Scheduled tasks, for a Web service only: each is a CronJob that runs
# command with sh -c on schedule (five cron fields, Europe/Oslo time) from
# the Application's image with its env and secrets. Written by the Deploy
# gate from the deployed commit's iidp.yaml. Each entry:
#   - name: nightly-cleanup
#     schedule: "0 3 * * *"
#     command: node scripts/cleanup.js
tasks: []

# false renders no CronJob for tasks. Preview Environments set it, since
# they share staging's values but run no tasks.
runTasks: true

login:
  # Require an Entra ID sign-in on the Platform address and every custom
  # domain.
  enabled: false
  # Entra ID group object ids (GUIDs). Empty lets every Itema user in;
  # otherwise a signed-in user outside every group gets a 403.
  groups: []
