# Values for one Environment of one Application. The CLI writes this file
# into the Platform repository; developers do not edit it by hand.
#
# Every convention (probes, sizes, labels, ingress shape) lives in the
# templates, not here. See README.md for the full table.

application:
  # The Application's name: lowercase, DNS-safe, unique on the Platform.
  # Required.
  name: ""

# The Environment this values file describes: prod or staging.
environment: prod

platform:
  # The Platform base domain. Platform addresses are <name>.<baseDomain>
  # for prod and <name>-staging.<baseDomain> for staging. Required.
  baseDomain: ""
  # The cert-manager ClusterIssuer that issues a certificate over HTTP-01
  # for a custom domain the Platform's wildcard does not cover. Created by
  # the bootstrap.
  httpIssuer: letsencrypt-http01
  # The Object Storage bucket every Application database is backed up to.
  # Required when postgres.enabled.
  backupsBucket: ""
  # The S3 endpoint of the location the bucket lives in, for example
  # https://hel1.your-objectstorage.com. Required when postgres.enabled.
  objectStorageEndpoint: ""
  # The Secret holding the Object Storage access key (key ACCESS_KEY_ID) and
  # secret key (key ACCESS_SECRET_KEY) the backups are written with. It must
  # exist in the namespace the Environment is installed into.
  backupsCredentialsSecret: backups-credentials

# What the Application fundamentally is: web-service (a container listening
# on port) or static-site (an nginx image built by CI, listening on 80).
kind: web-service

image:
  # Required, for example ghcr.io/itema-as/shop.
  repository: ""
  # The CI-written image tag (a commit SHA or a version). Empty means the
  # Environment has not received its first image yet: the chart then
  # renders nothing at all (no workload, no database, no hooks), which
  # ArgoCD shows as Synced and Healthy, and the first tag the deploy
  # workflow writes renders the whole Environment. The rest of the file is
  # still validated either way.
  tag: ""

# small, medium or large. The CPU and memory each size gets is fixed in the
# chart; see _helpers.tpl and README.md.
size: small

# The port the container listens on. It is injected as PORT and is the port
# the Service and the probes use.
port: 3000

probe:
  # The path the readiness and liveness probes request on port.
  path: /

# Plain environment variables, name to value. Secrets do not go here, and
# neither does DATABASE_URL, which the Postgres Capability injects.
env: {}

# Names of Kubernetes Secrets in the Environment's namespace whose keys are
# all exposed to the container, and to the migration Job, as environment
# variables. The CLI writes them SOPS-encrypted next to this file; the
# chart never renders a Secret.
secrets: []

# Custom domains, one hostname each, served in addition to the Platform
# address. A host directly under platform.baseDomain is covered by the
# Platform's wildcard certificate; any other host gets its own certificate
# from platform.httpIssuer. DNS is not the chart's business: external-dns
# creates records in the one zone it manages (platform.yaml's
# cloudflareZone), and anything else, another Cloudflare zone included,
# needs a CNAME to the Platform address.
domains: []

postgres:
  # The Postgres Capability: a single-instance database of this Environment's
  # own, DATABASE_URL injected into the container, continuous backups to the
  # Platform's backups bucket.
  enabled: false
  # A shell command run from the Application image, with DATABASE_URL set,
  # before every rollout; a failing command stops the rollout. Empty means
  # the Application has no migrations. Needs enabled: true.
  migrationCommand: ""
  # How long backups and WAL are kept in the bucket: a number of days (d),
  # weeks (w) or months (m).
  backupRetention: 30d
  # Seconds the ArgoCD PreDelete hook Job waits for the final Backup it
  # takes on Environment deletion to reach phase completed before it fails
  # (and, since the hook is not Healthy, blocks the deletion). 1800 (30
  # minutes) is generous for a small Application's database and still
  # bounded; a large database (or a slow bucket) may need it raised.
  finalBackupTimeout: 1800

login:
  # The Itema login Capability: the Platform address's Ingress gets the
  # Traefik ForwardAuth middleware annotation for the bootstrap's shared
  # oauth2-proxy, so an Entra ID sign-in is required to reach it. Platform
  # addresses only: fails rendering when domains is non-empty, because the
  # oauth2-proxy cookie is scoped to the Platform base domain.
  enabled: false
