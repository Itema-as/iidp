# git-http-backend as a CGI under /git, the layout from git-http-backend(1).
# Runs as the lighttpd user on an unprivileged port; the Service maps 80.
server.modules = ("mod_alias", "mod_setenv", "mod_cgi")
server.port = 8080
server.document-root = "/srv/git"
server.upload-dirs = ("/tmp")

alias.url = ("/git" => "/usr/libexec/git-core/git-http-backend")

$HTTP["url"] =~ "^/git" {
  cgi.assign = ("" => "")
  setenv.add-environment = (
    "GIT_PROJECT_ROOT" => "/srv/git",
    "GIT_HTTP_EXPORT_ALL" => "1"
  )
}
