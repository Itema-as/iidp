# Discovers every Environment's Application and every previews
# ApplicationSet the CLI writes under applications/. Like the other files
# here it is written by the bootstrap wizard, not the bootstrap chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applications
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://git-server.iidp-e2e.svc.cluster.local/git/iidp-platform.git
    targetRevision: HEAD
    path: applications
    directory:
      recurse: true
      include: '{*/*/application.yaml,*/previews/applicationset.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
