# The SOPS-encrypted Secrets the Platform components read (Cloudflare token,
# Grafana Cloud credentials, Entra client secret), decrypted in the ArgoCD
# repo server by KSOPS with the age key in the Secret argocd/sops-age. Until
# the argocd Application has installed KSOPS this cannot render, and until
# the components have created their namespaces it cannot sync; both resolve
# by themselves through refresh and retry.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://git-server.iidp-e2e.svc.cluster.local/git/iidp-platform.git
    targetRevision: HEAD
    path: bootstrap/sops
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
