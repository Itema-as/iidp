# Platform-wide settings. The bootstrap reads it as Helm values (see
# bootstrap/README.md in the iidp repository for every field); the CLI reads
# the fields marked so. This fixture's Platform, under example.test, is
# known to no cloud account.

# Applications are served under <application>.<baseDomain>; the wildcard
# certificate covers it. Read by the CLI.
baseDomain: app.example.test

# The Cloudflare zone containing baseDomain, the only zone external-dns
# manages and where the CLI can automate custom domains. Read by the CLI.
cloudflareZone: example.test

# Where ArgoCD and Grafana Cloud are, for the CLI's closing summary.
argocdURL: https://argocd.app.example.test
grafanaURL: https://example.grafana.net

# The application chart version the CLI writes into new Environments.
chartVersion: 0.1.0

# The GitHub API the Preview Environments' pull request generator asks,
# written into each previews ApplicationSet (applications/notes/previews/).
# Read by the CLI. Here the harness's fake GitHub, at GitHub Enterprise's
# API path.
githubAPI: http://fake-github.iidp-e2e.svc.cluster.local/api/v3

# The org GitHub App the Deploy gate commits deploys as (documentation only).
githubApp:
  id: 1
  installationId: 1

# The age public key the CLI encrypts secrets with. The private key exists
# only in the cluster (Secret argocd/sops-age).
agePublicKey: age1kpq9t46wreydm6dp2e9a6txzm88ymqj9ph38jvjlsjgff3k5vfqqqhee6v

# The Object Storage bucket CloudNativePG backups go to, and the S3 endpoint
# of its location. Read by the CLI; required for --postgres.
backupsBucket: iidp-backups
objectStorageEndpoint: https://hel1.your-objectstorage.com

# Bootstrap-only settings.
acme:
  email: platform@example.test
  # Staging, so a test Platform never spends production rate limits.
  server: https://acme-staging-v02.api.letsencrypt.org/directory
argocdAdminGroup: 00000000-0000-0000-0000-000000000003
clusterName: iidp-e2e

# kind has no route to login.microsoftonline.com, so OIDC discovery at
# startup would fail and oauth2-proxy would never become Ready, turning the
# sign-in redirect into a 5xx.
oauth2Proxy:
  skipOIDCDiscovery: true

# kind has no GHCR, GitHub or GitHub Actions: the Deploy gate runs the
# image the harness builds, talks to the harness's fake GitHub, and writes
# to the in-cluster git server.
deployGate:
  image:
    repository: iidp-e2e.local/deploy-gate
    tag: dev
    pullPolicy: Never
  oidc:
    issuer: http://fake-github.iidp-e2e.svc.cluster.local
  githubAPI: http://fake-github.iidp-e2e.svc.cluster.local/api
  platformRepository: http://git-server.iidp-e2e.svc.cluster.local/git/iidp-platform.git

# Off: the harness does not build Argus's image, and the 2 vCPU runner has
# no room to spare.
argus:
  enabled: false

# kind has no GHCR, so the fixture Applications run Docker Hub's
# unprivileged nginx, which the image guardrail would otherwise report on
# every Pod.
guardrails:
  extraAllowedImages:
    - docker.io/nginxinc/nginx-unprivileged
