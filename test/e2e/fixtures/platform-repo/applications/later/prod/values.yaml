# No image yet, as iidp app create --postgres leaves prod until its first
# deploy, so the chart renders nothing. ArgoCD applies only the
# backups-credentials Secret from the sops/ source.
application:
  name: later
environment: prod
platform:
  baseDomain: app.example.test
  backupsBucket: iidp-backups
  objectStorageEndpoint: https://objectstorage.invalid
kind: web-service
image:
  repository: ghcr.io/itema-as/later
  tag: ""
size: small
port: 3000
probe:
  path: /
env: {}
domains: []
postgres:
  enabled: true
  migrationCommand: npx prisma migrate deploy
  backupRetention: 30d
login:
  enabled: false
