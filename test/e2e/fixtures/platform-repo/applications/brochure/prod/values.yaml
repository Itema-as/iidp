# A Static site with no Capability and no image yet, so its Application
# has no resources at all until testDeployGate deploys one. kind has no
# GHCR, so the image is Docker Hub's unprivileged nginx.
application:
  name: brochure
environment: prod
platform:
  baseDomain: app.example.test
kind: static-site
image:
  repository: docker.io/nginxinc/nginx-unprivileged
  tag: ""
size: small
port: 3000
probe:
  path: /
env: {}
domains: []
postgres:
  enabled: false
  migrationCommand: ""
  backupRetention: 30d
login:
  enabled: false
