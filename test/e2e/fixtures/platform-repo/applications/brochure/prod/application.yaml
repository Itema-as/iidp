# Like shop's, but with no sops/ source: brochure has no secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: brochure-prod
  namespace: argocd
  labels:
    iidp.itema.no/application: brochure
    iidp.itema.no/environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: http://git-server.iidp-e2e.svc.cluster.local/git/iidp.git
      targetRevision: main
      path: chart/application
      helm:
        valueFiles:
          - $values/applications/brochure/prod/values.yaml
    - repoURL: http://git-server.iidp-e2e.svc.cluster.local/git/iidp-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: brochure-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        iidp.itema.no/application: brochure
        iidp.itema.no/environment: prod
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
