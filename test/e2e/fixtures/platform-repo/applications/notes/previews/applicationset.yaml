# In the kind fixture this is exactly what the CLI writes for notes
# (TestFixturePreviewsAreTheCLIsApplicationSet keeps it so): its sources are
# staging's, the chart from this repository included, and api is
# platform.yaml's githubAPI, the harness's fake GitHub, which serves
# notes's pull requests (test/e2e/testdata/fakegithub).
# The Preview Environments of notes: one Environment for each open pull request labelled preview on Itema-as/notes, removed with its namespace and database when the pull request closes or loses the label.
# Written by iidp; do not edit by hand.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
    name: notes-previews
    namespace: argocd
    labels:
        iidp.itema.no/application: notes
spec:
    goTemplate: true
    goTemplateOptions:
        - missingkey=error
    generators:
        - pullRequest:
            github:
                owner: Itema-as
                repo: notes
                api: http://fake-github.iidp-e2e.svc.cluster.local/api/v3
                appSecretName: platform-repo-github-app
                labels:
                    - preview
            requeueAfterSeconds: 180
    template:
        metadata:
            name: notes-pr-{{.number}}
            namespace: argocd
            labels:
                iidp.itema.no/application: notes
                iidp.itema.no/environment: pr-{{.number}}
            finalizers:
                - resources-finalizer.argocd.argoproj.io
        spec:
            project: default
            sources:
                - repoURL: http://git-server.iidp-e2e.svc.cluster.local/git/iidp.git
                  path: chart/application
                  targetRevision: main
                  helm:
                    valueFiles:
                        - $values/applications/notes/staging/values.yaml
                    valuesObject:
                        environment: pr-{{.number}}
                        image:
                            tag: '{{.head_sha}}'
                        size: small
                        domains: []
                        runTasks: false
                        login:
                            enabled: true
                        postgres:
                            backups: false
                - repoURL: http://git-server.iidp-e2e.svc.cluster.local/git/iidp-platform.git
                  targetRevision: main
                  ref: values
                - repoURL: http://git-server.iidp-e2e.svc.cluster.local/git/iidp-platform.git
                  path: applications/notes/staging/sops
                  targetRevision: main
            destination:
                server: https://kubernetes.default.svc
                namespace: notes-pr-{{.number}}
            syncPolicy:
                automated:
                    prune: true
                    selfHeal: true
                syncOptions:
                    - CreateNamespace=true
                managedNamespaceMetadata:
                    labels:
                        iidp.itema.no/application: notes
                        iidp.itema.no/environment: pr-{{.number}}
                        pod-security.kubernetes.io/audit: restricted
                        pod-security.kubernetes.io/enforce: baseline
                        pod-security.kubernetes.io/warn: restricted
                    annotations:
                        argocd.argoproj.io/tracking-id: notes-pr-{{.number}}:/Namespace:/notes-pr-{{.number}}
                retry:
                    limit: 3
                    refresh: true
                    backoff:
                        duration: 10s
                        factor: 2
                        maxDuration: 3m
