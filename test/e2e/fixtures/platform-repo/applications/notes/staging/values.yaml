# Never released: it is the base notes's Preview Environments render
# from. Each setting here is one a preview must keep (database, migration command,
# sign-in groups) or override (size, Scheduled task, backups, Environment,
# image tag).
application:
  name: notes
environment: staging
platform:
  baseDomain: app.example.test
  loginCookieDomain: example.test
  backupsBucket: iidp-backups
  objectStorageEndpoint: https://objectstorage.invalid
kind: web-service
image:
  repository: docker.io/nginxinc/nginx-unprivileged
  tag: ""
size: medium
port: 8080
probe:
  path: /
env: {}
domains: []
postgres:
  enabled: true
  migrationCommand: >-
    test -n "$DATABASE_URL" && echo "migrated: DATABASE_URL set"
  backupRetention: 30d
  # Staging's default levels, read-write for push, with the password a
  # preview's Database tunnel session logs in with.
  readWritePasswordSecret: notes-staging-db-write
tasks:
  - name: heartbeat
    schedule: "* * * * *"
    command: echo tick
login:
  enabled: true
  groups:
    - 6e1d2c3b-4a5f-4b6c-8d7e-9f0a1b2c3d4e
