# The shape iidp app create --staging --postgres --login --previews
# writes, except that the chart comes from iidp.git served in-cluster, as
# for shop, because kind has no GHCR. notes exists for its Preview
# Environments; its own Environments are never released, so they cost the
# node nothing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes-prod
  namespace: argocd
  labels:
    iidp.itema.no/application: notes
    iidp.itema.no/environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: http://git-server.iidp-e2e.svc.cluster.local/git/iidp.git
      targetRevision: main
      path: chart/application
      helm:
        valueFiles:
          - $values/applications/notes/prod/values.yaml
    - repoURL: http://git-server.iidp-e2e.svc.cluster.local/git/iidp-platform.git
      targetRevision: main
      ref: values
    - repoURL: http://git-server.iidp-e2e.svc.cluster.local/git/iidp-platform.git
      targetRevision: main
      path: applications/notes/prod/sops
  destination:
    server: https://kubernetes.default.svc
    namespace: notes-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        iidp.itema.no/application: notes
        iidp.itema.no/environment: prod
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
