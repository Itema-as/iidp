# Values for notes's prod Environment: never released in the test, so the
# chart renders nothing and ArgoCD applies only the backups-credentials
# Secret from the sops/ source. Its image is Docker Hub's nginx, like
# shop's, since kind has no GHCR.
application:
  name: notes
environment: prod
platform:
  baseDomain: app.example.test
  loginCookieDomain: example.test
  backupsBucket: iidp-backups
  objectStorageEndpoint: https://objectstorage.invalid
kind: web-service
image:
  repository: docker.io/library/nginx
  tag: ""
size: medium
port: 80
probe:
  path: /
env: {}
domains: []
postgres:
  enabled: true
  migrationCommand: ""
  backupRetention: 30d
login:
  enabled: true
  groups:
    - 6e1d2c3b-4a5f-4b6c-8d7e-9f0a1b2c3d4e
