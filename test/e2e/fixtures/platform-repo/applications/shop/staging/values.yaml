# Like prod/values.yaml, plus login, a custom domain and a reachable
# backup endpoint.
application:
  name: shop
environment: staging
platform:
  baseDomain: app.example.test
  # platform.yaml's cloudflareZone, so the custom domain below is
  # protected too.
  loginCookieDomain: example.test
  backupsBucket: iidp-backups
  # The harness's in-cluster S3 stand-in: TestBootstrap deletes this
  # Environment and needs its final Backup to really complete.
  objectStorageEndpoint: http://object-storage.iidp-e2e.svc.cluster.local:7070
kind: web-service
image:
  repository: docker.io/nginxinc/nginx-unprivileged
  tag: "1.30-alpine"
size: small
port: 8080
probe:
  path: /
env: {}
postgres:
  enabled: true
  migrationCommand: >-
    test -n "$DATABASE_URL" && nc -z -w 5 shop-staging-db-rw 5432 && echo "migrated: DATABASE_URL set, shop-staging-db-rw:5432 reachable"
  # The chart's 30-minute default would outlast the test's budget if the
  # backup got stuck; an empty database backs up in well under a minute.
  finalBackupTimeout: 120
  # Read-write for push, as staging's default, and read-only for pull, so
  # the kind test can connect through the Database tunnel both ways.
  access:
    readWrite: push
    readOnly: pull
  readWritePasswordSecret: shop-staging-db-write
  readOnlyPasswordSecret: shop-staging-db-read
# Login on staging only, so prod shows that an unprotected address still
# answers 200.
# The group, a made-up GUID, routes sign-in through the Environment's own
# Middleware rather than the shared one.
login:
  enabled: true
  groups:
    - 0f3b6a4e-8c1d-4e2f-9a7b-5c6d7e8f9a0b
# The CLI writes custom domains for prod only, but the chart takes them
# anywhere, and this is the protected Environment. Neither is under the
# base domain, so each gets an Ingress of its own with a certificate from
# the HTTP-01 issuer. The first is inside the zone, behind the shared
# login. The second is outside it, so it signs in through the host-only
# oauth2-proxy.
domains:
  - shop-staging.example.test
  - shop-staging.other.test
