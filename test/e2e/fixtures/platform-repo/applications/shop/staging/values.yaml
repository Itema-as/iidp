# Values for shop's staging Environment. See prod/values.yaml for what each
# key is for; only the Environment, the read-write Service the migration
# checks (shop-staging-db-rw, staging's own CloudNativePG Cluster), and
# login.enabled (see below) differ.
application:
  name: shop
environment: staging
platform:
  baseDomain: app.example.test
  # The login cookie's domain the CLI writes with login.enabled:
  # platform.yaml's cloudflareZone, so the custom domain below can be
  # protected too.
  loginCookieDomain: example.test
  backupsBucket: iidp-backups
  # Unlike prod's (see prod/values.yaml), this Environment's endpoint is a
  # real, in-cluster S3-compatible store (test/e2e's harness runs a small
  # versitygw server with this bucket, Cluster.InstallObjectStorage) rather
  # than the unreachable objectstorage.invalid: TestBootstrap deletes this
  # Environment and needs its final Backup PreDelete hook to genuinely
  # complete, not merely run (docs/implementation-notes/39-final-backup-predelete-hook.md,
  # docs/implementation-notes/71-e2e-s3-server.md).
  objectStorageEndpoint: http://object-storage.iidp-e2e.svc.cluster.local:7070
kind: web-service
image:
  repository: docker.io/library/nginx
  tag: "1.27-alpine"
size: small
port: 80
probe:
  path: /
env: {}
postgres:
  enabled: true
  migrationCommand: >-
    test -n "$DATABASE_URL" && nc -z -w 5 shop-staging-db-rw 5432 && echo "migrated: DATABASE_URL set, shop-staging-db-rw:5432 reachable"
  # The chart's default (1800s/30 minutes) is far more than a real backup
  # against the harness's S3 server needs, but also far more than
  # TestBootstrap's own fifteen-minute budget can spend waiting on one that
  # is stuck; a small, empty database backing up in-cluster typically finishes in
  # well under a minute.
  finalBackupTimeout: 120
# The Itema login Capability, on staging only: TestBootstrap proves an
# unauthenticated request to a protected Platform address gets redirected
# to the provider's sign-in while the unprotected prod address still answers 200
# (docs/implementation-notes/18-itema-login.md), reusing this Environment
# rather than adding a third Application.
login:
  enabled: true
# A custom domain inside the fixture zone (example.test) but not under the
# base domain, so it goes on the chart's HTTP-01 Ingress: TestBootstrap
# proves it redirects to sign-in too, and that cert-manager's challenge
# path on it does not (docs/implementation-notes/76-login-in-zone-domains.md).
# The CLI writes custom domains for prod only; the chart takes them on any
# Environment, and this one is the fixture's protected one. Let's Encrypt
# staging never issues for .test, so the host keeps Traefik's default
# certificate, which the harness does not verify anyway.
domains:
  - shop-staging.example.test
