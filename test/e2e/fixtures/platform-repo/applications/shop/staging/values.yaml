# Values for shop's staging Environment. See prod/values.yaml for what each
# key is for; only the Environment, the read-write Service the migration
# checks (shop-staging-db-rw, staging's own CloudNativePG Cluster), and
# login.enabled (see below) differ.
application:
  name: shop
environment: staging
platform:
  baseDomain: app.example.test
  backupsBucket: iidp-backups
  # Unlike prod's (see prod/values.yaml), this Environment's endpoint is a
  # real, in-cluster S3-compatible store (test/e2e's harness runs a small
  # MinIO server and creates this bucket, Cluster.InstallMinIO) rather than
  # the unreachable objectstorage.invalid: TestBootstrap deletes this
  # Environment and needs its final Backup PreDelete hook to genuinely
  # complete, not merely run (docs/implementation-notes/39-final-backup-predelete-hook.md).
  objectStorageEndpoint: http://minio.iidp-e2e.svc.cluster.local:9000
kind: web-service
image:
  repository: docker.io/library/nginx
  tag: "1.27-alpine"
size: small
port: 80
probe:
  path: /
env: {}
postgres:
  enabled: true
  migrationCommand: >-
    test -n "$DATABASE_URL" && nc -z -w 5 shop-staging-db-rw 5432 && echo "migrated: DATABASE_URL set, shop-staging-db-rw:5432 reachable"
  # The chart's default (1800s/30 minutes) is far more than a real backup
  # against MinIO needs, but also far more than TestBootstrap's own
  # fifteen-minute budget can spend waiting on one that is stuck; a small,
  # empty database backing up to an in-cluster MinIO typically finishes in
  # well under a minute.
  finalBackupTimeout: 120
# The Itema login Capability, on staging only: TestBootstrap proves an
# unauthenticated request to a protected Platform address gets redirected
# towards oauth2-proxy while the unprotected prod address still answers 200
# (docs/implementation-notes/18-itema-login.md), reusing this Environment
# rather than adding a third Application.
login:
  enabled: true
