# Like prod/values.yaml, plus login, a custom domain and a reachable
# backup endpoint.
application:
  name: shop
environment: staging
platform:
  baseDomain: app.example.test
  # platform.yaml's cloudflareZone, so the custom domain below is
  # protected too.
  loginCookieDomain: example.test
  backupsBucket: iidp-backups
  # The harness's in-cluster S3 stand-in: TestBootstrap deletes this
  # Environment and needs its final Backup to really complete.
  objectStorageEndpoint: http://object-storage.iidp-e2e.svc.cluster.local:7070
kind: web-service
image:
  repository: docker.io/nginxinc/nginx-unprivileged
  tag: "1.30-alpine"
size: small
port: 8080
probe:
  path: /
env: {}
postgres:
  enabled: true
  migrationCommand: >-
    test -n "$DATABASE_URL" && nc -z -w 5 shop-staging-db-rw 5432 && echo "migrated: DATABASE_URL set, shop-staging-db-rw:5432 reachable"
  # The chart's 30-minute default would outlast the test's budget if the
  # backup got stuck; an empty database backs up in well under a minute.
  finalBackupTimeout: 120
# On staging only, so prod shows an unprotected address still answers 200.
# The group, a made-up GUID, routes sign-in through the Environment's own
# Middleware rather than the shared one.
login:
  enabled: true
  groups:
    - 0f3b6a4e-8c1d-4e2f-9a7b-5c6d7e8f9a0b
# Inside the zone but not under the base domain, so it goes on the chart's
# HTTP-01 Ingress. The CLI writes custom domains for prod only, but the
# chart takes them anywhere, and this is the protected Environment.
domains:
  - shop-staging.example.test
