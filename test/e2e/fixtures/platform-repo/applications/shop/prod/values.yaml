# Hand-written in the shape the CLI writes.
application:
  name: shop
environment: prod
platform:
  baseDomain: app.example.test
  # Required with postgres.enabled; neither exists in kind, so prod's
  # backups never succeed.
  backupsBucket: iidp-backups
  objectStorageEndpoint: https://objectstorage.invalid
kind: web-service
image:
  # Runs as non-root, answers 200 on /, and its Alpine base has the
  # busybox nc the migration command uses.
  repository: docker.io/nginxinc/nginx-unprivileged
  tag: "1.30-alpine"
size: small
# nginx listens on 8080; PORT is injected but unused.
port: 8080
probe:
  path: /
env: {}
postgres:
  enabled: true
  # Fails unless DATABASE_URL is set and the database's read-write Service
  # accepts connections.
  migrationCommand: >-
    test -n "$DATABASE_URL" && nc -z -w 5 shop-db-rw 5432 && echo "migrated: DATABASE_URL set, shop-db-rw:5432 reachable"
