# The shape the CLI writes, except that the chart comes from iidp.git
# served in-cluster rather than the OCI reference, because kind has no GHCR.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-prod
  namespace: argocd
  labels:
    iidp.itema.no/application: shop
    iidp.itema.no/environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: http://git-server.iidp-e2e.svc.cluster.local/git/iidp.git
      targetRevision: main
      path: chart/application
      helm:
        valueFiles:
          - $values/applications/shop/prod/values.yaml
    - repoURL: http://git-server.iidp-e2e.svc.cluster.local/git/iidp-platform.git
      targetRevision: main
      ref: values
    - repoURL: http://git-server.iidp-e2e.svc.cluster.local/git/iidp-platform.git
      targetRevision: main
      path: applications/shop/prod/sops
  destination:
    server: https://kubernetes.default.svc
    namespace: shop-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        iidp.itema.no/application: shop
        iidp.itema.no/environment: prod
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
