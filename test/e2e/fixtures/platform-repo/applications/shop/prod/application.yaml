# The ArgoCD Application for shop's prod Environment, in exactly the shape
# docs/platform-repository.md describes, discovered by bootstrap/applications.yaml.
# The one deviation from what the CLI writes: the chart source is this
# repository's iidp.git served in-cluster (path chart/application) rather
# than the OCI reference, because kind has no GHCR. See
# docs/implementation-notes/09-e2e-fixture-application.md. The third source
# (sops/) is what iidp app create --postgres itself writes once the
# Postgres Capability copies bootstrap/templates/backups-credentials.enc.yaml into
# this Environment (docs/implementation-notes/42-backups-credentials.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-prod
  namespace: argocd
  labels:
    iidp.itema.no/application: shop
    iidp.itema.no/environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: http://git-server.iidp-e2e.svc.cluster.local/git/iidp.git
      targetRevision: main
      path: chart/application
      helm:
        valueFiles:
          - $values/applications/shop/prod/values.yaml
    - repoURL: http://git-server.iidp-e2e.svc.cluster.local/git/iidp-platform.git
      targetRevision: main
      ref: values
    - repoURL: http://git-server.iidp-e2e.svc.cluster.local/git/iidp-platform.git
      targetRevision: main
      path: applications/shop/prod/sops
  destination:
    server: https://kubernetes.default.svc
    namespace: shop-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        iidp.itema.no/application: shop
        iidp.itema.no/environment: prod
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/warn: restricted
