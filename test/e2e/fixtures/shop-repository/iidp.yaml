# shop's iidp.yaml, which testMigrationCommandFromIidpYAML deploys. The
# last words of each command are a marker the test looks for in the log.
migrationCommand: test -n "$DATABASE_URL" && nc -z -w 5 shop-db-rw 5432 && echo "migrated by the command in iidp.yaml"

# Every minute, so a run starts while the test waits.
tasks:
  - name: heartbeat
    schedule: "* * * * *"
    command: test -n "$DATABASE_URL" && echo "scheduled task ran with DATABASE_URL"
