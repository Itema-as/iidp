# The iidp.yaml of shop's Application repository, at the commit the kind
# e2e deploys (testMigrationCommandFromIidpYAML). The test reads it with the
# same code iidp ci set-image uses and sends its migrationCommand and tasks
# to the Deploy gate with the image tag, as the deploy workflow does. The
# gate writes them into shop's prod values.yaml, and the test asserts that
# the migration Job ran this command and that the task's CronJob ran a Job
# that succeeded: the last words of each are a marker the log must show.
#
# Like the fixture Platform repository's own command for shop, the
# migration fails unless DATABASE_URL is set and shop's CloudNativePG
# read-write Service accepts connections.
migrationCommand: test -n "$DATABASE_URL" && nc -z -w 5 shop-db-rw 5432 && echo "migrated by the command in iidp.yaml"

# Every minute, so a run starts while the test waits, and done in a moment:
# the kind runner's two vCPUs have room for one small Pod at a time.
tasks:
  - name: heartbeat
    schedule: "* * * * *"
    command: test -n "$DATABASE_URL" && echo "scheduled task ran with DATABASE_URL"
