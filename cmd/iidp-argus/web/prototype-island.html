<!doctype html>
<!--
  PROTOTYPE, throwaway. Not Argus. Answers one question for the Argus map (#97):
  "What does the island look like, and how is it laid out?" (#102).

  Three structurally different directions, switchable with ?variant=A|B|C, the
  bottom bar, or the arrow keys. The data is fake and lives in memory; the
  buttons on the right push it through the states decided in #100.

  Layout rule shared by all three: an Application takes a slot when it
  arrives, the next free slot in a fixed spiral (or grid) order, and keeps it
  for life. A deleted Application frees its slot for the next arrival. Nothing
  already on the map ever moves.

  Open the file directly in a browser. No server, no build.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE · Argus island</title>
<style>
  :root { --panel:#11161c; --ink:#e6edf3; --muted:#8b98a5; --line:#26303a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; color:var(--ink);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #stage { position:fixed; inset:0 330px 0 0; }
  body.nopanel #stage { right:0; }
  #map { width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  #map.dragging { cursor:grabbing; }
  #panel { position:fixed; top:0; right:0; bottom:0; width:330px; overflow:auto;
    background:var(--panel); border-left:1px solid var(--line); padding:14px 16px 90px; }
  body.nopanel #panel { display:none; }
  h1 { font-size:15px; font-weight:650; margin:0 0 2px; }
  h2 { font-size:11.5px; font-weight:650; text-transform:uppercase; letter-spacing:.07em;
    color:var(--muted); margin:18px 0 8px; }
  .note { color:var(--muted); font-size:12px; margin:0; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  button { font:inherit; font-size:12.5px; color:var(--ink); background:#1b232c;
    border:1px solid #2c3845; border-radius:4px; padding:7px 8px; text-align:left; cursor:pointer; }
  button:hover { background:#243039; }
  #feed { list-style:none; margin:0; padding:0; font-size:12.5px; }
  #feed li { padding:3px 0; border-bottom:1px solid #1c242d; }
  #feed time { color:var(--muted); margin-right:6px; font-variant-numeric:tabular-nums; }
  #state { font-size:12px; }
  #state .app { margin:8px 0 2px; font-weight:600; }
  #state .app small { color:var(--muted); font-weight:400; }
  #state .env { display:flex; justify-content:space-between; gap:8px; padding-left:10px; color:#c9d4dd; }
  #state .env span:last-child { color:var(--muted); text-align:right; }
  .c-degraded { color:#ff7b72 !important; } .c-unknown { color:#9aa5b1 !important; }
  .stuckc { color:#ffa657 !important; }

  /* Prototype chrome: deliberately plain so it reads as not-the-design. */
  #switcher { position:fixed; left:calc((100% - 330px) / 2); bottom:18px; transform:translateX(-50%);
    display:flex; align-items:center; gap:2px; background:#0d1117; color:#f0f6fc;
    border:1px solid #3d444d; border-radius:6px; box-shadow:0 6px 24px rgba(0,0,0,.45);
    font-size:13px; z-index:10; }
  body.nopanel #switcher { left:50%; }
  #switcher button { background:none; border:0; color:inherit; padding:8px 12px; font-size:16px; }
  #switcher button:hover { background:#1f2630; }
  #switcher .label { padding:0 10px; min-width:190px; text-align:center; }
  #togglePanel { position:fixed; top:12px; right:342px; z-index:10; background:#0d1117ee; }
  body.nopanel #togglePanel { right:12px; }
  #tip { position:fixed; pointer-events:none; background:#0d1117f2; color:#e6edf3; border:1px solid #3d444d;
    border-radius:4px; padding:6px 8px; font-size:12px; white-space:pre; display:none; z-index:20; }
  #lost { position:fixed; top:14px; left:calc((100% - 330px) / 2); transform:translateX(-50%);
    background:#2b3137; color:#e6edf3; border:1px solid #57606a; border-radius:4px; padding:7px 12px;
    font-size:13px; display:none; z-index:10; }
  body.nopanel #lost { left:50%; }
  #title { position:fixed; top:14px; left:16px; font-size:13px; font-weight:600; z-index:10;
    background:#0d1117cc; color:#e6edf3; padding:5px 9px; border-radius:4px; }

  /* SVG text */
  .lbl { font-size:13px; font-weight:650; fill:var(--lbl); paint-order:stroke; stroke:var(--halo); stroke-width:3px; }
  .sub { font-size:10.5px; fill:var(--sub); text-anchor:middle; paint-order:stroke; stroke:var(--halo); stroke-width:3px; }
  .chip { font-size:10.5px; text-anchor:middle; font-weight:600; paint-order:stroke; stroke:var(--halo); stroke-width:3px; }
  .newtag { font-size:10px; font-weight:750; letter-spacing:.08em; fill:var(--new); }
  .fogq { font-size:15px; font-weight:700; fill:#52606b; text-anchor:middle; }
  .badgeq { font-size:12px; font-weight:800; fill:#fff; text-anchor:middle; }

  /* State animations. Everything respects reduced motion. */
  .scaffold * { stroke-dasharray:3 3; animation:march 1s linear infinite; }
  .scaffold.halted * { animation:none; stroke-dasharray:none; }
  @keyframes march { to { stroke-dashoffset:-12; } }
  .smoke { transform-box:fill-box; transform-origin:center; animation:rise 2.7s ease-out infinite; opacity:0; }
  @keyframes rise { 0% { transform:translate(0,0) scale(.5); opacity:.85; } 100% { transform:translate(8px,-34px) scale(1.9); opacity:0; } }
  .dust { transform-box:fill-box; transform-origin:center; animation:puff 1.8s ease-out infinite; opacity:0; }
  @keyframes puff { 0% { transform:scale(.4); opacity:.8; } 100% { transform:scale(2.2) translateY(-4px); opacity:0; } }
  .hook { animation:bob 1.6s ease-in-out infinite alternate; }
  @keyframes bob { to { transform:translateY(7px); } }
  .badge { animation:throb 1.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center bottom; }
  @keyframes throb { 50% { transform:scale(1.12); } }
  .flicker { animation:flick 1.3s steps(2) infinite; }
  @keyframes flick { 50% { opacity:.25; } }
  .blink { animation:flick 1s steps(2) infinite; }
  .lamp { animation:lamp 3s ease-in-out infinite; }
  .lamp.fast { animation-duration:.8s; }
  @keyframes lamp { 50% { opacity:.35; } }
  .ghost { opacity:.55; }
  .faded { opacity:.32; }
  .pop { animation:pop .9s cubic-bezier(.2,1.4,.4,1); transform-box:fill-box; transform-origin:center bottom; }
  @keyframes pop { from { transform:translateY(-18px) scale(.7); opacity:0; } }
  .crumble { animation:crumble 1.2s ease-in forwards; transform-box:fill-box; transform-origin:center bottom; }
  @keyframes crumble { 30% { transform:translateX(2px) rotate(1deg); } to { transform:scaleY(.04); opacity:0; } }
  .fogdrift { animation:drift 6s ease-in-out infinite alternate; }
  @keyframes drift { to { transform:translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</head>
<body>
<div id="stage">
  <svg id="map" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
      <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    </defs>
    <g id="world"></g>
    <g id="labels"></g>
    <g id="overlay"></g>
  </svg>
</div>
<div id="title">Argus · island prototype (throwaway)</div>
<div id="lost">Argus has lost the cluster. Showing the last known state.</div>
<button id="togglePanel">Hide panel</button>
<div id="switcher">
  <button id="prev" aria-label="Previous variant">‹</button>
  <div class="label" id="variantLabel"></div>
  <button id="next" aria-label="Next variant">›</button>
</div>
<div id="tip"></div>

<aside id="panel">
  <h1>Push the Platform around</h1>
  <p class="note">Fake data. Drag to pan, scroll to zoom, hover anything. Switch direction with the bar or ← →.</p>
  <h2>Events</h2>
  <div class="actions">
    <button data-act="arrive">An Application arrives</button>
    <button data-act="firstDeploy">wiki gets its first image</button>
    <button data-act="deploy">Deploy an Environment</button>
    <button data-act="stuck">A Deploy gets stuck</button>
    <button data-act="update">Set a secret (Updating)</button>
    <button data-act="degrade">An Environment degrades</button>
    <button data-act="unknown">One Environment goes Unknown</button>
    <button data-act="warn">A database backup fails</button>
    <button data-act="preview">Open a preview</button>
    <button data-act="closePreview">Close a preview</button>
    <button data-act="deleteApp">Delete an Application</button>
    <button data-act="bump">Bump cert-manager</button>
    <button data-act="traefik">Traefik degrades / recovers</button>
    <button data-act="lose">Lose / regain the cluster</button>
    <button data-act="settle">Settle everything</button>
    <button data-act="fit">Fit view</button>
  </div>
  <h2>Feed</h2>
  <ul id="feed"></ul>
  <h2>State</h2>
  <div id="state"></div>
</aside>

<script type="module">
// ---------------------------------------------------------------- geometry
const NS = 'http://www.w3.org/2000/svg';
const U = 16, CS = Math.cos(Math.PI / 6);
// Ground (x, y) and height z to screen. +x runs right-down, +y left-down.
const P = (x, y, z = 0) => [(x - y) * CS * U, (x + y) * 0.5 * U - z * U];
const pts = a => a.map(p => P(...p).map(n => n.toFixed(1)).join(',')).join(' ');
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(parent, x, y, s, cls, extra = {}) {
  const t = el('text', { x: x.toFixed(1), y: y.toFixed(1), class: cls, ...extra }, parent);
  t.textContent = s;
  return t;
}
function prism(g, x, y, w, d, h, c, z0 = 0, attrs = {}) {
  const grp = el('g', attrs, g), z1 = z0 + h;
  el('polygon', { points: pts([[x + w, y, z0], [x + w, y + d, z0], [x + w, y + d, z1], [x + w, y, z1]]), fill: c.right }, grp);
  el('polygon', { points: pts([[x, y + d, z0], [x + w, y + d, z0], [x + w, y + d, z1], [x, y + d, z1]]), fill: c.left }, grp);
  el('polygon', { points: pts([[x, y, z1], [x + w, y, z1], [x + w, y + d, z1], [x, y + d, z1]]), fill: c.top }, grp);
  return grp;
}
function cyl(g, cx, cy, r, h, c, z0 = 0) {
  const [tx, ty] = P(cx, cy, z0 + h), [bx, by] = P(cx, cy, z0);
  const rx = r * 1.414 * CS * U, ry = r * 1.414 * 0.5 * U;
  el('path', { d: `M${tx - rx},${ty} L${bx - rx},${by} A${rx},${ry} 0 0 0 ${bx + rx},${by} L${tx + rx},${ty} Z`, fill: c.left }, g);
  el('ellipse', { cx: tx, cy: ty, rx, ry, fill: c.top }, g);
  return [tx, ty - ry];
}
function flat(g, poly, z, attrs) { return el('polygon', { points: pts(poly.map(([x, y]) => [x, y, z])), ...attrs }, g); }
function extrude(g, poly, z0, h, c) {
  const n = poly.length, cx = poly.reduce((s, p) => s + p[0], 0) / n, cy = poly.reduce((s, p) => s + p[1], 0) / n;
  const sides = [];
  for (let i = 0; i < n; i++) {
    const a = poly[i], b = poly[(i + 1) % n], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    let nx = b[1] - a[1], ny = -(b[0] - a[0]);
    if (nx * (mx - cx) + ny * (my - cy) < 0) { nx = -nx; ny = -ny; }
    if (nx + ny > 0) sides.push({ a, b, depth: mx + my, fill: nx > ny ? c.right : c.left });
  }
  sides.sort((p, q) => p.depth - q.depth);
  for (const s of sides) el('polygon', { points: pts([[...s.a, z0], [...s.b, z0], [...s.b, z0 + h], [...s.a, z0 + h]]), fill: s.fill }, g);
  flat(g, poly, z0 + h, { fill: c.top });
}
const hexPoly = (cx, cy, R) => Array.from({ length: 6 }, (_, i) => {
  const a = Math.PI / 180 * (60 * i + 30);
  return [cx + R * Math.cos(a), cy + R * Math.sin(a)];
});
function octagon(cx, cy, r) {
  return Array.from({ length: 8 }, (_, i) => {
    const a = Math.PI / 8 + i * Math.PI / 4;
    return (cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1);
  }).join(' ');
}

// ---------------------------------------------------------------- themes
const THEMES = {
  A: {
    name: 'One island', bg: 'radial-gradient(ellipse at 50% 45%, #134060 0%, #0a2336 55%, #06131f 100%)',
    lbl: '#f2f7fa', sub: '#b9cbd6', halo: '#0b2233', new: '#ffd166',
    shallow: '#1c5b73', land: { top: '#5f8062', left: '#3c543f', right: '#4a664c' }, plaza: '#6f8f70',
    bld: { top: '#e4eaee', left: '#98aab6', right: '#bfcdd6' }, bad: { top: '#f0aca1', left: '#9b473f', right: '#c0675c' },
    grey: { top: '#a3abb0', left: '#5b6367', right: '#798287' }, tank: { top: '#d9e2e8', left: '#8aa0ae' },
    gate: { top: '#f4d58d', left: '#b08f3e', right: '#cfae5c' }, flag: '#6cc4ff', win: '#ffd479', winOff: '#34424c',
    scaffold: '#ffd166', stuck: '#ff8a3d', fog: '#dfe7ec', smoke: '#50575c', dust: '#b5a88f', stake: '#f4efe0',
    ok: '#58d68d', bad2: '#ff6b5e', unk: '#a7b3bd', bridge: '#9aa39a',
  },
  B: {
    name: 'Tabletop board', bg: 'linear-gradient(180deg, #e3e8ec 0%, #cfd7de 100%)',
    lbl: '#f4f7f9', sub: '#c7d1d9', halo: '#26313b', new: '#ffd166',
    board: { top: '#2c3843', left: '#1b232b', right: '#232d36' }, plate: '#374654', plateEmpty: '#303d49', strip: '#23303a',
    bld: { top: '#fbfcfd', left: '#bfc8d0', right: '#dde3e8' }, bad: { top: '#ffd9d3', left: '#c4574b', right: '#df7e72' },
    grey: { top: '#aeb6bc', left: '#636b71', right: '#848d93' }, tank: { top: '#eef2f5', left: '#9eadb8' },
    gate: { top: '#ffe08a', left: '#b99a3e', right: '#d8b95e' }, flag: '#5ab0ff', win: '#7cc4ff', winOff: '#8e99a3',
    scaffold: '#ffd166', stuck: '#ff8a3d', fog: '#e4eaee', smoke: '#6b7277', dust: '#b9ae98', stake: '#e8edf1',
    ok: '#3fd08b', bad2: '#ff6b5e', unk: '#a9b4be', bridge: '#9aa39a', chips: true,
  },
  C: {
    name: 'Archipelago', bg: 'linear-gradient(180deg, #16394a 0%, #0c2330 60%, #081821 100%)',
    lbl: '#f3f0f8', sub: '#c4c9d6', halo: '#0c2330', new: '#ffd166',
    reef: '#1d4f5e', islet: { top: '#6c7d5f', left: '#3f4a37', right: '#536049' }, core: { top: '#7b8a86', left: '#485452', right: '#5e6b68' },
    bld: { top: '#ece8f3', left: '#9a93ab', right: '#c1bad0' }, bad: { top: '#f5b2a8', left: '#a24c43', right: '#c86e62' },
    grey: { top: '#a6a9ae', left: '#5c6066', right: '#7b7f85' }, tank: { top: '#e1dcea', left: '#958eaa' },
    gate: { top: '#f7cf86', left: '#b28c3f', right: '#d4ad5e' }, flag: '#7fd1ff', win: '#ffb86b', winOff: '#3b3a48',
    scaffold: '#ffd166', stuck: '#ff8a3d', fog: '#dfe4ea', smoke: '#4f5459', dust: '#b3a78f', stake: '#efeadf',
    ok: '#58d68d', bad2: '#ff6b5e', unk: '#a7b3bd', bridge: '#8e9a95',
  },
};

// ---------------------------------------------------------------- model
let seq = 0;
const cap = (kind, o = {}) => ({ kind, cond: 'healthy', warn: false, ...o });
const mkEnv = (app, name, caps = [], o = {}) => ({ id: ++seq, app, name, cond: 'healthy', activity: null, stuck: false, caps, seen: true, ...o });
const model = { apps: [], comps: [], clusterLost: false, free: [], high: 0, feed: [] };
function takeSlot() {
  if (model.free.length) { model.free.sort((a, b) => a - b); return model.free.shift(); }
  return ++model.high;
}
function addApp(name, envs, o = {}) {
  const a = { name, envs, slot: takeSlot(), crumbling: false, isNew: false, ...o };
  model.apps.push(a);
  return a;
}
function seed() {
  const A = (n, f) => addApp(n, f(n));
  A('shop', n => [mkEnv(n, 'prod', [cap('postgres'), cap('login')]), mkEnv(n, 'staging', [cap('postgres'), cap('login')]), mkEnv(n, 'pr-42', [cap('login')])]);
  A('iprofil', n => [mkEnv(n, 'prod', [cap('postgres'), cap('domain')]), mkEnv(n, 'staging', [cap('postgres')])]);
  A('hello', n => [mkEnv(n, 'prod')]);
  A('api', n => [mkEnv(n, 'prod', [cap('postgres', { warn: true })], { cond: 'degraded' }), mkEnv(n, 'staging', [cap('postgres')], { activity: 'deploying' })]);
  A('wiki', n => [mkEnv(n, 'prod', [], { activity: 'unreleased' })]);
  A('timesheet', n => [mkEnv(n, 'prod', [cap('postgres'), cap('task')]), mkEnv(n, 'staging', [cap('postgres')], { activity: 'deploying', stuck: true, why: 'migration Job failed' })]);
  A('booking', n => [mkEnv(n, 'prod', [cap('login')], { cond: 'unknown' }), mkEnv(n, 'staging', [cap('login')], { activity: 'updating' })]);
  const C = (kind, label, o = {}) => model.comps.push({ kind, label, cond: 'healthy', activity: null, stuck: false, ...o });
  C('argocd', 'ArgoCD'); C('traefik', 'Traefik'); C('deploy-gate', 'Deploy gate');
  C('cert-manager', 'cert-manager', { activity: 'updating' }); C('external-dns', 'external-dns');
  C('cnpg', 'CloudNativePG'); C('oauth2-proxy', 'Itema login'); C('alloy', 'Alloy');
}

// ---------------------------------------------------------------- labels
const actLabel = e => e.activity === null ? 'none' : e.activity[0].toUpperCase() + e.activity.slice(1) + (e.stuck ? ' (stuck)' : '');
const condLabel = e => e.cond[0].toUpperCase() + e.cond.slice(1);
function tipEnv(e) {
  const lines = [`${e.app} ${e.name}`, `Condition: ${e.activity === 'unreleased' ? 'n/a' : condLabel(e)}`, `Activity: ${actLabel(e)}`];
  if (e.stuck && e.why) lines.push(`Why stuck: ${e.why}`);
  for (const c of e.caps) lines.push(`  ${c.kind}: ${condLabel(c)}${c.warn ? ' · Warning: backups failing' : ''}`);
  return lines.join('\n');
}
const tipComp = c => `${c.label} (Platform component)\nCondition: ${condLabel(c)}\nActivity: ${actLabel(c)}`;

// ---------------------------------------------------------------- shared drawing
// Labels go on their own layer, drawn after every structure, so buildings never cover them.
let LAYER = null;
const DIMS = { prod: [1.8, 1.8, 2.6], staging: [1.5, 1.5, 1.9], preview: [1, 1, 1.2] };
const kindOf = e => e.name === 'prod' ? 'prod' : e.name === 'staging' ? 'staging' : 'preview';

function windows(g, b, e, T) {
  const { x, y, w, d, h } = b;
  const lit = e.cond === 'healthy' && e.activity !== 'leaving' && e.activity !== 'arriving';
  const rows = Math.max(1, Math.floor(h / 0.62)), cl = Math.max(1, Math.round(w / 0.5)), cr = Math.max(1, Math.round(d / 0.5));
  const cls = e.cond === 'degraded' ? 'flicker' : '';
  for (let j = 0; j < rows; j++) {
    const v0 = (j + 0.32) / rows, v1 = (j + 0.72) / rows;
    for (let i = 0; i < cl; i++) {
      const u0 = (i + 0.25) / cl, u1 = (i + 0.75) / cl;
      el('polygon', { points: pts([[x + u0 * w, y + d, v0 * h], [x + u1 * w, y + d, v0 * h], [x + u1 * w, y + d, v1 * h], [x + u0 * w, y + d, v1 * h]]),
        fill: lit ? T.win : T.winOff, opacity: lit && (i + j) % 3 === 1 ? 0.55 : 1, class: cls }, g);
    }
    for (let i = 0; i < cr; i++) {
      const a0 = (i + 0.25) / cr, a1 = (i + 0.75) / cr;
      el('polygon', { points: pts([[x + w, y + a0 * d, v0 * h], [x + w, y + a1 * d, v0 * h], [x + w, y + a1 * d, v1 * h], [x + w, y + a0 * d, v1 * h]]),
        fill: lit ? T.win : T.winOff, opacity: lit && (i + j) % 4 === 2 ? 0.5 : 0.9, class: cls }, g);
    }
  }
}
function warnFlag(g, sx, sy, T) {
  el('line', { x1: sx, y1: sy, x2: sx, y2: sy - 16, stroke: '#e8e8e8', 'stroke-width': 1.3 }, g);
  el('polygon', { points: `${sx},${sy - 16} ${sx + 11},${sy - 12.5} ${sx},${sy - 9}`, fill: '#ffcc33' }, g);
}
function drawCap(g, c, b, T) {
  const { x, y, w, d } = b;
  const cc = c.cond === 'degraded' ? T.bad : null;
  const tip = { 'data-tip': `${c.kind} of this Environment\nCondition: ${condLabel(c)}${c.warn ? '\nWarning: backups failing' : ''}` };
  const cg = el('g', tip, g);
  let top;
  if (c.kind === 'postgres') top = cyl(cg, x + w + 0.55, y + 0.55, 0.38, 0.9, cc || T.tank);
  if (c.kind === 'login') {
    const gx = x + 0.2, gy = y + d + 0.45, gw = Math.min(1.1, w * 0.8);
    prism(cg, gx, gy, 0.16, 0.16, 0.75, cc || T.gate); prism(cg, gx + gw, gy, 0.16, 0.16, 0.75, cc || T.gate);
    prism(cg, gx, gy, gw + 0.16, 0.16, 0.14, cc || T.gate, 0.75);
    top = P(gx + gw / 2, gy, 0.9);
  }

// Fixed places inside a 7 x 6.5 district. Previews beyond three collapse into "+n".

// ---------------------------------------------------------------- variant A: one island
// Slot 0 is the Platform quarter at the heart; Applications fill a square spiral around it.
function squareSpiral(n) {
  const out = [[0, 0]], dirs = [[1, 0], [0, 1], [-1, 0], [0, -1]];
  let x = 0, y = 0, step = 1, di = 0;
  while (out.length < n) {
    for (let k = 0; k < 2 && out.length < n; k++) {
      for (let s = 0; s < step && out.length < n; s++) { x += dirs[di][0]; y += dirs[di][1]; out.push([x, y]); }
      di = (di + 1) % 4;
    }
    step++;
  }
  return out;
}
function renderA(g, T) {
  const PITCH = 8.6, cells = squareSpiral(model.high + 1);
  const at = k => [cells[k][0] * PITCH, cells[k][1] * PITCH];
  // Land exists for every slot ever used, so the coast never jumps back when an Application leaves.
  const tiles = cells.map((c, k) => at(k)).sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]));
  for (const [x, y] of tiles) flat(g, [[x - 1.4, y - 1.4], [x + PITCH + 1.4, y - 1.4], [x + PITCH + 1.4, y + PITCH + 1.4], [x - 1.4, y + PITCH + 1.4]], -0.5, { fill: T.shallow, opacity: 0.8 });
  for (const [x, y] of tiles) prism(g, x, y, PITCH, PITCH, 0.5, T.land, -0.5);
  for (const [x, y] of tiles) flat(g, [[x + 0.4, y + 0.4], [x + PITCH - 0.4, y + 0.4], [x + PITCH - 0.4, y + PITCH - 0.4], [x + 0.4, y + PITCH - 0.4]], 0.003, { fill: T.plaza, opacity: 0.55 });
  const things = [{ k: 0, draw: (x, y) => drawPlatform(g, x + 0.6, y + 0.8, T) }];
  for (const a of model.apps) things.push({ k: a.slot, draw: (x, y) => drawDistrict(g, a, x + 0.8, y + 0.9, T) });
  things.sort((p, q) => { const [px, py] = at(p.k), [qx, qy] = at(q.k); return (px + py) - (qx + qy); });
  for (const t of things) t.draw(...at(t.k));
}

// ---------------------------------------------------------------- variant B: tabletop board
// A board with a fixed grid of plots in creation order, four across; Platform components line the back edge.
function renderB(g, T) {
  const COLS = 4, PX = 9.2, PY = 8.6, rows = Math.max(2, Math.ceil(model.high / COLS));
  const W = COLS * PX + 0.8, H = rows * PY + 0.8;
  prism(g, -1.2, -9.4, W + 1.2, H + 9.4, 0.7, T.board, -0.7);
  flat(g, [[-0.6, -8.8], [W - 0.6, -8.8], [W - 0.6, -1.2], [-0.6, -1.2]], 0.003, { fill: T.strip });
  const [sx, sy] = P(-0.6, -5.0, 0);
  txt(LAYER, sx - 10, sy, 'Platform', 'lbl', { 'text-anchor': 'end' });
  const at = k => [((k - 1) % COLS) * PX, Math.floor((k - 1) / COLS) * PY];
  for (let k = 1; k <= rows * COLS; k++) {
    const [x, y] = at(k), used = model.apps.some(a => a.slot === k);
    flat(g, [[x, y], [x + PX - 0.6, y], [x + PX - 0.6, y + PY - 0.6], [x, y + PY - 0.6]], 0.004,
      used ? { fill: T.plate } : { fill: T.plateEmpty, stroke: '#4a5966', 'stroke-dasharray': '5 4' });
    if (!used) { const [ex, ey] = P(x + PX / 2 - 0.3, y + PY / 2 - 0.3, 0); txt(g, ex, ey, 'free plot', 'sub'); }
  }
  const STRIP = { argocd: [1.2, -6.2], traefik: [4.8, -7.6], 'deploy-gate': [9.3, -7.4], 'cert-manager': [13.6, -6.9],
    'external-dns': [18.2, -6.2], cnpg: [21.2, -7.2], 'oauth2-proxy': [26.4, -7.0], alloy: [31.5, -5.6] };
  drawPlatform(g, 0, 0, T, STRIP, false);
  const apps = [...model.apps].sort((a, b) => { const [ax, ay] = at(a.slot), [bx, by] = at(b.slot); return (ax + ay) - (bx + by); });
  for (const a of apps) { const [x, y] = at(a.slot); drawDistrict(g, a, x + 0.6, y + 0.4, T, [-0.4, 7.4], 'end'); }

// ---------------------------------------------------------------- variant C: archipelago
// The Platform is the central island; each Application is its own islet on a hex spiral, bridged to it.
function hexSpiral(n) {
  const dirs = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]], out = [[0, 0]];
  for (let k = 1; out.length < n; k++) {
    let q = -k, r = k;
    for (let i = 0; i < 6; i++) for (let j = 0; j < k; j++) { if (out.length >= n) return out; out.push([q, r]); q += dirs[i][0]; r += dirs[i][1]; }
  }
  return out;
}
function renderC(g, T) {
  const S = 7.9, R = 5.7, R0 = 6.6, cells = hexSpiral(model.high + 1);
  const at = k => { const [q, r] = cells[k]; return [S * (Math.sqrt(3) * q + Math.sqrt(3) / 2 * r), S * 1.5 * r]; };
  // Bridges first, under everything.
  for (const a of model.apps) {
    const [cx, cy] = at(a.slot), len = Math.hypot(cx, cy), ux = cx / len, uy = cy / len;
    const s = [cx - ux * R * 0.8, cy - uy * R * 0.8], e = [ux * R0 * 0.85, uy * R0 * 0.85];
    const plank = a.envs.every(v => v.activity === 'unreleased') ? { 'stroke-dasharray': '3 5' } : {};
    el('polyline', { points: pts([[...s, -0.1], [...e, -0.1]]), stroke: T.bridge, 'stroke-width': 4, fill: 'none', ...plank }, g);
  }
  const isles = [{ k: 0, core: true }, ...model.apps.map(a => ({ k: a.slot, a }))]
    .sort((p, q) => { const [px, py] = at(p.k), [qx, qy] = at(q.k); return (px + py) - (qx + qy); });
  for (const it of isles) {
    const [cx, cy] = at(it.k), ig = el('g', it.a && it.a.crumbling ? { class: 'crumble' } : {}, g);
    const rad = it.core ? R0 : R;
    flat(ig, hexPoly(cx, cy, rad + 1.3), -0.7, { fill: T.reef, opacity: 0.8 });
    const bare = it.a && it.a.envs.every(v => v.activity === 'unreleased');
    if (bare) flat(ig, hexPoly(cx, cy, rad), -0.05, { fill: T.islet.top, opacity: 0.35, stroke: T.stake, 'stroke-dasharray': '5 4' });
    else extrude(ig, hexPoly(cx, cy, rad), -0.7, 0.7, it.core ? T.core : T.islet);
    if (it.core) drawPlatform(ig, cx - 3.6, cy - 3.4, T);
    else drawDistrict(ig, it.a, cx - 3.5, cy - 3.1, T, [0.6, 6.6]);
  }
}

const VARIANTS = ['A', 'B', 'C'];

if (!VARIANTS.includes(variant)) variant = 'A';

  const T = THEMES[variant];
  document.getElementById('stage').style.background = T.bg;
  svg.style.setProperty('--lbl', T.lbl); svg.style.setProperty('--sub', T.sub);
  svg.style.setProperty('--halo', T.halo); svg.style.setProperty('--new', T.new);
  const labels = document.getElementById('labels');
  world.replaceChildren(); labels.replaceChildren(); overlay.replaceChildren(); LAYER = labels;
  ({ A: renderA, B: renderB, C: renderC })[variant](world, T);
  world.setAttribute('class', model.clusterLost ? 'faded' : ''); labels.setAttribute('class', model.clusterLost ? 'faded' : '');
  document.getElementById('lost').style.display = model.clusterLost ? 'block' : 'none';
  declutter(labels);
  if (!fitted) { fit(); fitted = true; }
  if (model.clusterLost) {
    const bb = world.getBBox(), f = el('g', { filter: 'url(#blurBig)', class: 'fogdrift' }, overlay);
    for (let i = 0; i < 18; i++) {
      el('ellipse', { cx: bb.x + ((i * 37) % 100) / 100 * bb.width, cy: bb.y + ((i * 61) % 100) / 100 * bb.height,
        rx: bb.width * 0.18, ry: bb.height * 0.14, fill: T.fog, opacity: 0.55 }, f);
    }
  }
  document.getElementById('variantLabel').textContent = `${variant} · ${T.name}`;
  renderPanel();
}
function renderPanel() {
  const feed = document.getElementById('feed');
  feed.replaceChildren(...model.feed.slice(0, 14).map(f => { const li = document.createElement('li'); li.innerHTML = `<time>${f.t}</time>`; li.append(f.msg); return li; }));
  const st = document.getElementById('state'); st.replaceChildren();
  for (const a of [...model.apps].sort((p, q) => p.slot - q.slot)) {
    const h = document.createElement('div'); h.className = 'app'; h.innerHTML = `${a.name} <small>slot ${a.slot}</small>`; st.append(h);
    for (const e of a.envs) {
      const r = document.createElement('div'); r.className = 'env';
      const cl = e.stuck ? 'stuckc' : e.cond !== 'healthy' ? 'c-' + e.cond : '';
      r.innerHTML = `<span>${e.name}${e.caps.some(c => c.warn) ? ' ⚑' : ''}</span><span class="${cl}">${e.activity === 'unreleased' ? '' : condLabel(e) + ' · '}${actLabel(e)}</span>`;
      st.append(r);
    }
  }
  const h = document.createElement('div'); h.className = 'app'; h.innerHTML = 'Platform components <small>fixed</small>'; st.append(h);
  for (const c of model.comps) {
    const r = document.createElement('div'); r.className = 'env';
    r.innerHTML = `<span>${c.label}</span><span class="${c.stuck ? 'stuckc' : c.cond !== 'healthy' ? 'c-' + c.cond : ''}">${condLabel(c)} · ${actLabel(c)}</span>`;
    st.append(r);
  }
}

// Greedy label declutter: a label that overlaps one already placed moves down until it's free.
function declutter(layer) {
  const placed = [];
  const hit = (a, b) => a.x < b.x + b.width && b.x < a.x + a.width && a.y < b.y + b.height && b.y < a.y + a.height;
  for (const t of layer.querySelectorAll('text')) {
    for (let i = 0; i < 6; i++) {
      const bb = t.getBBox(), o = placed.find(p => hit(bb, p));
      if (!o) break;
      t.setAttribute('y', (parseFloat(t.getAttribute('y')) + (o.y + o.height - bb.y) + 1).toFixed(1));
    }
    placed.push(t.getBBox());
  }
}

// ---------------------------------------------------------------- pan and zoom
let vb = null;
const setVB = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
function fit() {
  const a = world.getBBox(), l = document.getElementById('labels').getBBox();
  const x0 = Math.min(a.x, l.x), y0 = Math.min(a.y, l.y), bb = { x: x0, y: y0, width: Math.max(a.x + a.width, l.x + l.width) - x0, height: Math.max(a.y + a.height, l.y + l.height) - y0 }, pad = 50;
  vb = { x: bb.x - pad, y: bb.y - pad - 30, w: bb.width + 2 * pad, h: bb.height + 2 * pad + 30 }; setVB();
}
const toWorld = (cx, cy) => { const p = svg.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(svg.getScreenCTM().inverse()); };
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const pt = toWorld(e.clientX, e.clientY), k = Math.exp(e.deltaY * 0.0015);
  vb.x = pt.x - (pt.x - vb.x) * k; vb.y = pt.y - (pt.y - vb.y) * k; vb.w *= k; vb.h *= k; setVB();
}, { passive: false });
let drag = null;
svg.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; svg.setPointerCapture(e.pointerId); svg.classList.add('dragging'); });
svg.addEventListener('pointermove', e => {
  const tip = document.getElementById('tip');
  if (drag) {
    const s = Math.max(vb.w / svg.clientWidth, vb.h / svg.clientHeight);
    vb.x -= (e.clientX - drag.x) * s; vb.y -= (e.clientY - drag.y) * s; drag = { x: e.clientX, y: e.clientY }; setVB();
    tip.style.display = 'none'; return;
  }
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (t) { tip.textContent = t.getAttribute('data-tip'); tip.style.display = 'block'; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 14 + 'px'; }
  else tip.style.display = 'none';
});
svg.addEventListener('pointerup', () => { drag = null; svg.classList.remove('dragging'); });
svg.addEventListener('pointerleave', () => { document.getElementById('tip').style.display = 'none'; });

// ---------------------------------------------------------------- switcher
function setVariant(v) {
  variant = v; fitted = false;
  const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u);
  render();
}
const step = d => setVariant(VARIANTS[(VARIANTS.indexOf(variant) + d + VARIANTS.length) % VARIANTS.length]);
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
document.getElementById('togglePanel').onclick = e => {
  document.body.classList.toggle('nopanel');
  e.target.textContent = document.body.classList.contains('nopanel') ? 'Show panel' : 'Hide panel';
};

// ---------------------------------------------------------------- events
const now = () => new Date().toTimeString().slice(0, 8);
const log = msg => model.feed.unshift({ t: now(), msg });
const later = (ms, fn) => setTimeout(() => { fn(); render(); }, ms);
const pick = a => a[Math.floor(Math.random() * a.length)];
const envs = () => model.apps.flatMap(a => a.envs);
const idle = () => envs().filter(e => e.activity === null && e.cond !== 'unknown');
const POOL = ['ledger', 'kantine', 'roomsy', 'fakturo', 'radar', 'intranet', 'onboard', 'crm', 'kudos', 'lunsj'];
const ACTIONS = {
  arrive() {
    const name = POOL.find(n => !model.apps.some(a => a.name === n)) || 'app' + seq;
    const withStaging = Math.random() < 0.5;
    const list = [mkEnv(name, 'prod', [cap('postgres')], { activity: 'arriving', seen: false, isNewApp: true })];
    if (withStaging) list.push(mkEnv(name, 'staging', [cap('postgres')], { activity: 'arriving', seen: false }));
    const a = addApp(name, list, { isNew: true });
    log(`${name} arrived in slot ${a.slot}, setting up`);
    later(6500, () => { for (const e of a.envs) if (e.activity === 'arriving') e.activity = null; a.isNew = false; log(`${name} is serving`); });
  },
  firstDeploy() {
    const e = envs().find(v => v.activity === 'unreleased');
    if (!e) return log('no Unreleased Environment left');
    e.activity = 'arriving'; e.seen = false; log(`${e.app} ${e.name} got its first image, arriving`);
    later(5000, () => { e.activity = null; log(`${e.app} ${e.name} is serving`); });
  },
  deploy() {
    const e = pick(idle()); if (!e) return;
    e.activity = 'deploying'; log(`Deploy to ${e.app} ${e.name}`);
    later(4500, () => { if (e.activity === 'deploying' && !e.stuck) { e.activity = null; log(`${e.app} ${e.name} deployed`); } });
  },
  stuck() {
    const e = pick(idle()); if (!e) return;
    e.activity = 'deploying'; log(`Deploy to ${e.app} ${e.name}`);
    later(2500, () => { e.stuck = true; e.why = 'migration Job failed'; log(`${e.app} ${e.name} Deploy stuck: migration Job failed`); });
  },
  update() {
    const e = pick(idle()); if (!e) return;
    e.activity = 'updating'; log(`${e.app} ${e.name} updating (secret set)`);
    later(4000, () => { if (!e.stuck) { e.activity = null; log(`${e.app} ${e.name} updated`); } });
  },
  degrade() { const e = pick(envs().filter(v => v.cond === 'healthy' && v.activity !== 'unreleased')); if (e) { e.cond = 'degraded'; log(`${e.app} ${e.name} Degraded: CrashLoopBackOff`); } },
  unknown() { const e = pick(envs().filter(v => v.cond === 'healthy' && v.activity !== 'unreleased')); if (e) { e.cond = 'unknown'; log(`${e.app} ${e.name} Unknown: pod status Unknown`); } },
  warn() { const c = pick(envs().flatMap(e => e.caps.filter(k => k.kind === 'postgres' && !k.warn).map(k => [e, k]))); if (c) { c[1].warn = true; log(`${c[0].app} ${c[0].name} database: backups failing`); } },
  preview() {
    const a = pick(model.apps.filter(x => x.envs.some(e => e.name === 'staging'))); if (!a) return;
    const n = 40 + Math.floor(Math.random() * 60), e = mkEnv(a.name, `pr-${n}`, [cap('login')], { activity: 'arriving', seen: false });
    a.envs.push(e); log(`${a.name} pr-${n} preview arriving`);
    later(4500, () => { e.activity = null; log(`${a.name} pr-${n} preview is serving`); });
  },
  closePreview() {
    const e = pick(envs().filter(v => v.name.startsWith('pr-') && v.activity !== 'leaving')); if (!e) return log('no preview open');
    e.activity = 'leaving'; log(`${e.app} ${e.name} leaving`);
    later(3000, () => { e.crumbling = true; });
    later(4300, () => { const a = model.apps.find(x => x.name === e.app); a.envs = a.envs.filter(v => v !== e); log(`${e.app} ${e.name} left`); });
  },
  deleteApp() {
    const a = pick(model.apps.filter(x => !x.crumbling && !x.envs.some(e => e.activity === 'leaving'))); if (!a) return;
    for (const e of a.envs) { if (e.activity === 'unreleased') e.wasUnreleased = true; e.activity = 'leaving'; e.stuck = false; }
    log(`${a.name} leaving: final backups running`);
    later(3500, () => { a.crumbling = true; for (const e of a.envs) e.crumbling = true; });
    later(4800, () => { model.apps = model.apps.filter(x => x !== a); model.free.push(a.slot); log(`${a.name} left; slot ${a.slot} is free`); });
  },
  bump() {
    const c = model.comps.find(k => k.kind === 'cert-manager'); c.activity = 'updating'; c.stuck = false; log('cert-manager updating (chart bump)');
    later(4000, () => { c.activity = null; log('cert-manager updated'); });
  },
  traefik() { const c = model.comps.find(k => k.kind === 'traefik'); c.cond = c.cond === 'healthy' ? 'degraded' : 'healthy'; log(`Traefik ${c.cond === 'healthy' ? 'recovered' : 'Degraded'}`); },
  lose() { model.clusterLost = !model.clusterLost; log(model.clusterLost ? 'Argus lost the cluster' : 'Argus reconnected'); },
  settle() {
    for (const e of envs()) { if (e.activity !== 'unreleased' && e.activity !== 'leaving') e.activity = null; e.stuck = false; e.cond = 'healthy'; for (const c of e.caps) { c.warn = false; c.cond = 'healthy'; } }
    for (const c of model.comps) { c.activity = null; c.stuck = false; c.cond = 'healthy'; }
    model.clusterLost = false; log('everything settled');
  },
  fit() { fit(); },
};
document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => { ACTIONS[b.dataset.act](); render(); }));

seed();
log('Argus connected (fake data)');
render();
// ?do=arrive,preview runs events on load, for linking straight to a scenario.
for (const a of (new URLSearchParams(location.search).get('do') || '').split(',').filter(Boolean)) { if (ACTIONS[a]) { ACTIONS[a](); render(); } }
</script>
