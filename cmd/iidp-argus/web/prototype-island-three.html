<!doctype html>
<!--
  PROTOTYPE, throwaway, out of curiosity. The Argus archipelago (iteration 2 of
  prototype-island.html) rendered with three.js instead of SVG, to compare.
  The rendering research for the Argus map (#99) chose SVG without WebGL; this
  file does not change that, it only shows what the other road looks like.

  Same fake model and events. Loads three.js from a CDN, so it needs internet.
  Left-drag pans, right-drag rotates, scroll zooms. ?variant=pale|night.
  ?do=arrive,deleteApp runs events on load.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE · Argus archipelago in three.js</title>
<style>
  :root { --panel:#11161c; --ink:#e6edf3; --muted:#8b98a5; --line:#26303a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; color:var(--ink);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #stage { position:fixed; inset:0 330px 0 0; }
  body.nopanel #stage { right:0; }
  #stage canvas { display:block; width:100%; height:100%; }
  #panel { position:fixed; top:0; right:0; bottom:0; width:330px; overflow:auto;
    background:var(--panel); border-left:1px solid var(--line); padding:14px 16px 90px; }
  body.nopanel #panel { display:none; }
  h1 { font-size:15px; font-weight:650; margin:0 0 2px; }
  h2 { font-size:11.5px; font-weight:650; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:18px 0 8px; }
  .note { color:var(--muted); font-size:12px; margin:0; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  button { font:inherit; font-size:12.5px; color:var(--ink); background:#1b232c; border:1px solid #2c3845;
    border-radius:4px; padding:7px 8px; text-align:left; cursor:pointer; }
  button:hover { background:#243039; }
  label.opt { display:flex; gap:8px; align-items:center; font-size:12.5px; margin-top:10px; color:#c9d4dd; }
  #feed { list-style:none; margin:0; padding:0; font-size:12.5px; }
  #feed li { padding:3px 0; border-bottom:1px solid #1c242d; }
  #feed time { color:var(--muted); margin-right:6px; font-variant-numeric:tabular-nums; }
  #switcher { position:fixed; left:calc((100% - 330px) / 2); bottom:18px; transform:translateX(-50%);
    display:flex; align-items:center; gap:2px; background:#0d1117; color:#f0f6fc; border:1px solid #3d444d;
    border-radius:6px; box-shadow:0 6px 24px rgba(0,0,0,.45); font-size:13px; z-index:10; }
  body.nopanel #switcher { left:50%; }
  #switcher button { background:none; border:0; color:inherit; padding:8px 12px; font-size:16px; }
  #switcher .label { padding:0 10px; min-width:200px; text-align:center; }
  #togglePanel { position:fixed; top:12px; right:342px; z-index:10; background:#0d1117ee; }
  body.nopanel #togglePanel { right:12px; }
  #tip { position:fixed; pointer-events:none; background:#0d1117f2; color:#e6edf3; border:1px solid #3d444d;
    border-radius:4px; padding:6px 8px; font-size:12px; white-space:pre; display:none; z-index:20; }
  #lost { position:fixed; top:14px; left:calc((100% - 330px) / 2); transform:translateX(-50%); background:#2b3137;
    color:#e6edf3; border:1px solid #57606a; border-radius:4px; padding:7px 12px; font-size:13px; display:none; z-index:10; }
  #title { position:fixed; top:14px; left:16px; font-size:13px; font-weight:600; z-index:10;
    background:#0d1117cc; color:#e6edf3; padding:5px 9px; border-radius:4px; }
  #err { position:fixed; inset:40% 30%; color:#ffb4ab; display:none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="title">Argus · archipelago in three.js (throwaway, curiosity)</div>
<div id="lost">Argus has lost the cluster. Showing the last known state.</div>
<div id="err">Couldn't load three.js from the CDN. This prototype needs internet.</div>
<button id="togglePanel">Hide panel</button>
<div id="switcher">
  <button id="prev" aria-label="Previous palette">‹</button>
  <div class="label" id="variantLabel"></div>
  <button id="next" aria-label="Next palette">›</button>
</div>
<div id="tip"></div>
<aside id="panel">
  <h1>Push the Platform around</h1>
  <p class="note">Fake data. Left-drag pans, right-drag rotates, scroll zooms. Hover anything.</p>
  <label class="opt"><input type="checkbox" id="flyNew" checked> Fly to Applications as they arrive</label>
  <h2>Events</h2>
  <div class="actions">
    <button data-act="arrive">An Application arrives</button>
    <button data-act="firstDeploy">wiki gets its first image</button>
    <button data-act="deploy">Deploy an Environment</button>
    <button data-act="stuck">A Deploy gets stuck</button>
    <button data-act="update">Set a secret (Updating)</button>
    <button data-act="degrade">An Environment degrades</button>
    <button data-act="unknown">One Environment goes Unknown</button>
    <button data-act="warn">A database backup fails</button>
    <button data-act="preview">Open a preview</button>
    <button data-act="closePreview">Close a preview</button>
    <button data-act="deleteApp">Delete an Application</button>
    <button data-act="deleteTwo">Delete two at once</button>
    <button data-act="bump">Bump cert-manager</button>
    <button data-act="traefik">Traefik degrades / recovers</button>
    <button data-act="lose">Lose / regain the cluster</button>
    <button data-act="settle">Settle everything</button>
    <button data-act="fit">Fit view</button>
  </div>
  <h2>Feed</h2>
  <ul id="feed"></ul>
</aside>

<script type="module">
window.addEventListener('error', () => { document.getElementById('err').style.display = 'block'; });
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------- palettes
const THEMES = {
  pale: { name: 'Slate on pale water', bg: '#dfe6ec', water: '#d0dae2', reef: '#bfcbd5', islet: '#3a4855', side: '#222c35',
    core: '#445361', road: '#1c242b', engDark: '#1b232a', engLight: '#5a6d7d', wall: '#f5f7f9', roof: '#dfe5ea',
    win: '#6fb6f5', winOff: '#8e99a3', glow: 0.1, hemi: 1.15, sun: 2.4, sunColor: '#ffffff' },
  night: { name: 'Slate at night', bg: '#0a121a', water: '#0c1720', reef: '#142532', islet: '#34414d', side: '#1a222a',
    core: '#3c4a57', road: '#141b21', engDark: '#131a20', engLight: '#4d5f6e', wall: '#cfd7dd', roof: '#aab5be',
    win: '#ffc861', winOff: '#39444d', glow: 1.6, hemi: 0.35, sun: 0.7, sunColor: '#a9c0ff' },
};
const COL = { bad: '#e2685c', grey: '#99a1a7', gate: '#e8c35a', tank: '#e9eef2', scaffold: '#ffc233', stuck: '#ff7a1a',
  sign: '#2f81f7', backup: '#58a6ff', pad: '#2c3843', mast: '#d8dee3' };

// ---------------------------------------------------------------- model and events (same as the SVG prototype)
let seq = 0;
const cap = (kind, o = {}) => ({ kind, cond: 'healthy', warn: false, ...o });
const mkEnv = (app, name, caps = [], o = {}) => ({ id: ++seq, app, name, cond: 'healthy', activity: null, stuck: false, caps, bornAt: -1e9, ...o });
const model = { apps: [], comps: [], clusterLost: false, free: [], high: 0, feed: [] };
const takeSlot = () => { if (model.free.length) { model.free.sort((a, b) => a - b); return model.free.shift(); } return ++model.high; };
const addApp = (name, envs, o = {}) => { const a = { name, envs, slot: takeSlot(), isNew: false, ...o }; model.apps.push(a); return a; };
function seed() {
  const A = (n, f) => addApp(n, f(n));
  A('shop', n => [mkEnv(n, 'prod', [cap('postgres'), cap('login')]), mkEnv(n, 'staging', [cap('postgres'), cap('login')]), mkEnv(n, 'pr-42', [cap('login')])]);
  A('iprofil', n => [mkEnv(n, 'prod', [cap('postgres'), cap('domain', { host: 'iprofil.no' })]), mkEnv(n, 'staging', [cap('postgres')])]);
  A('hello', n => [mkEnv(n, 'prod')]);
  A('api', n => [mkEnv(n, 'prod', [cap('postgres', { warn: true })], { cond: 'degraded' }), mkEnv(n, 'staging', [cap('postgres')], { activity: 'deploying' })]);
  A('wiki', n => [mkEnv(n, 'prod', [], { activity: 'unreleased' })]);
  A('timesheet', n => [mkEnv(n, 'prod', [cap('postgres'), cap('task')]), mkEnv(n, 'staging', [cap('postgres')], { activity: 'deploying', stuck: true, why: 'migration Job failed' })]);
  A('booking', n => [mkEnv(n, 'prod', [cap('login'), cap('domain', { host: 'booking.itema.no' })], { cond: 'unknown' }), mkEnv(n, 'staging', [cap('login')], { activity: 'updating' })]);
  const C = (kind, label, o = {}) => model.comps.push({ kind, label, cond: 'healthy', activity: null, stuck: false, ...o });
  C('argocd', 'ArgoCD'); C('traefik', 'Traefik'); C('deploy-gate', 'Deploy gate'); C('cert-manager', 'cert-manager', { activity: 'updating' });
  C('external-dns', 'external-dns'); C('cnpg', 'CloudNativePG'); C('oauth2-proxy', 'Itema login'); C('alloy', 'Alloy');
}
const actLabel = e => e.activity === null ? 'none' : e.activity[0].toUpperCase() + e.activity.slice(1) + (e.stuck ? ' (stuck)' : '');
const condLabel = e => e.cond[0].toUpperCase() + e.cond.slice(1);
function tipEnv(e) {
  const l = [`${e.app} ${e.name}`, `Condition: ${e.activity === 'unreleased' ? 'n/a' : condLabel(e)}`, `Activity: ${actLabel(e)}`];
  if (e.stuck && e.why) l.push(`Why stuck: ${e.why}`);
  if (e.activity === 'leaving' && e.caps.some(c => c.kind === 'postgres')) l.push('Final backup running');
  for (const c of e.caps) l.push(`  ${c.kind}${c.host ? ' ' + c.host : ''}: ${condLabel(c)}${c.warn ? ' · Warning: backups failing' : ''}`);
  return l.join('\n');
}
const tipComp = c => `${c.label} (Platform component)\nCondition: ${condLabel(c)}\nActivity: ${actLabel(c)}`;

// ---------------------------------------------------------------- three.js setup
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const FRUST = 30;
const camera = new THREE.OrthographicCamera(-FRUST, FRUST, FRUST, -FRUST, -500, 1000);
const OFFSET = new THREE.Vector3(60, 52, 60);
camera.position.copy(OFFSET);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.screenSpacePanning = false;
controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.maxPolarAngle = Math.PI * 0.42; controls.minPolarAngle = Math.PI * 0.12;
controls.minZoom = 0.3; controls.maxZoom = 6;
const hemi = new THREE.HemisphereLight('#ffffff', '#445566', 1);
const sun = new THREE.DirectionalLight('#ffffff', 2);
sun.position.set(-30, 60, 20); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 200 });
sun.shadow.bias = -0.0005;
scene.add(hemi, sun, sun.target);
const water = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshStandardMaterial({ roughness: 0.6 }));
water.rotation.x = -Math.PI / 2; water.position.y = -0.72; water.receiveShadow = true; scene.add(water);
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight, a = w / h;
  renderer.setSize(w, h, false);
  Object.assign(camera, { left: -FRUST * a, right: FRUST * a, top: FRUST, bottom: -FRUST }); camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- caches and helpers
const cache = new Map();
const C = (k, f) => { if (!cache.has(k)) cache.set(k, f()); return cache.get(k); };
const std = (color, o = {}) => C('std' + color + JSON.stringify(o), () => new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...o }));
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function add(parent, geo, mat, x = 0, y = 0, z = 0, shadow = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
}
const box = (p, w, h, d, mat, x, y, z) => add(p, new THREE.BoxGeometry(w, h, d), mat, x, y, z);
const cylinder = (p, r, h, mat, x, y, z, seg = 24) => add(p, new THREE.CylinderGeometry(r, r, h, seg), mat, x, y, z);
const softTex = () => C('soft', () => canvasTex(128, 128, (g, w) => {
  const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, w);
}));
// Sprites with their own material so each can fade; they are disposed on rebuild.
function puff(parent, color, opacity) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex(), color, transparent: true, opacity, depthWrite: false }));
  s.userData.own = true; parent.add(s); return s;
}
function textTex(s, { px = 64, color = '#fff', bg = null, weight = 800, stroke = null } = {}) {
  return C(`txt|${s}|${px}|${color}|${bg}|${weight}|${stroke}`, () => {
    const m = document.createElement('canvas').getContext('2d'); m.font = `${weight} ${px}px system-ui,sans-serif`;
    const w = Math.ceil(m.measureText(s).width) + px * 0.6, h = Math.ceil(px * 1.35);
    const t = canvasTex(w, h, g => {
      if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
      g.font = `${weight} ${px}px system-ui,sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      if (stroke) { g.lineWidth = px * 0.16; g.strokeStyle = stroke; g.strokeText(s, w / 2, h / 2); }
      g.fillStyle = color; g.fillText(s, w / 2, h / 2);
    });
    t.userData = { aspect: w / h }; return t;
  });
}
function label(parent, s, height, y, o = {}) {
  const tex = textTex(s, o);
  const sp = new THREE.Sprite(C('lbl' + tex.uuid, () => new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true })));
  sp.scale.set(height * tex.userData.aspect, height, 1); sp.position.y = y; sp.renderOrder = 10; parent.add(sp); return sp;
}
// Text laid flat on the ground, cut in: a light lip on the far edge under a dark fill.
function engraved(parent, s, x, z, height, T) {
  const tex = C(`eng|${s}|${T.name}`, () => {
    const px = 96, m = document.createElement('canvas').getContext('2d'); m.font = `800 ${px}px system-ui,sans-serif`;
    const w = Math.ceil(m.measureText(s).width) + 40, h = px + 30;
    const t = canvasTex(w, h, g => {
      g.font = `800 ${px}px system-ui,sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = T.engLight; g.fillText(s, w / 2, h / 2 + 5); g.fillStyle = T.engDark; g.fillText(s, w / 2, h / 2);
    });
    t.userData = { aspect: w / h }; return t;
  });
  const mat = C('engm' + tex.uuid, () => new THREE.MeshStandardMaterial({ map: tex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, roughness: 1 }));
  const m = new THREE.Mesh(new THREE.PlaneGeometry(height * tex.userData.aspect, height), mat);
  m.rotation.x = -Math.PI / 2; m.position.set(x, 0.015, z); m.receiveShadow = true; parent.add(m); return m;
}
// A wall texture with a window grid. The emissive map lights the windows at night.
function wallTex(cols, rows, wall, win, lit, emissive) {
  return C(`wall|${cols}|${rows}|${wall}|${win}|${lit}|${emissive}`, () => canvasTex(cols * 32, rows * 40, (g, w, h) => {
    g.fillStyle = emissive ? '#000' : wall; g.fillRect(0, 0, w, h);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const on = lit && (i * 7 + j * 3) % 5 !== 0;
      if (emissive && !on) continue;
      g.fillStyle = emissive ? '#fff' : on ? win : '#5b6670';
      g.globalAlpha = emissive ? (0.55 + ((i + j) % 3) * 0.2) : 1;
      g.fillRect(i * 32 + 8, j * 40 + 10, 16, 20);
    }
    g.globalAlpha = 1;
  }));
}
const hazardTex = () => C('hazard', () => { const t = canvasTex(64, 16, g => { g.fillStyle = '#1b1b1b'; g.fillRect(0, 0, 64, 16); g.fillStyle = '#ff8a1f'; for (let x = -16; x < 80; x += 16) { g.beginPath(); g.moveTo(x, 16); g.lineTo(x + 8, 0); g.lineTo(x + 16, 0); g.lineTo(x + 8, 16); g.fill(); } }); t.wrapS = THREE.RepeatWrapping; return t; });
const octTex = () => C('oct', () => canvasTex(128, 128, g => {
  g.beginPath(); for (let i = 0; i < 8; i++) { const a = Math.PI / 8 + i * Math.PI / 4; g.lineTo(64 + 56 * Math.cos(a), 64 + 56 * Math.sin(a)); }
  g.closePath(); g.fillStyle = COL.stuck; g.fill(); g.lineWidth = 6; g.strokeStyle = '#fff'; g.stroke();
  g.fillStyle = '#fff'; g.font = '900 76px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('!', 64, 68);
}));
const padTex = k => C('pad' + k, () => canvasTex(128, 128, g => {
  g.fillStyle = COL.pad; g.beginPath(); g.arc(64, 64, 62, 0, 7); g.fill();
  g.strokeStyle = '#eef2f5'; g.lineWidth = 5; g.beginPath(); g.arc(64, 64, 50, 0, 7); g.stroke();
  g.fillStyle = '#eef2f5'; g.font = '900 64px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(k, 64, 68);
}));

// ---------------------------------------------------------------- animation registry
// Animations read their start times from the model, so rebuilding the scene never restarts them.
let anims = [];
const anim = f => anims.push(f);
const dashMat = new THREE.LineDashedMaterial({ color: COL.scaffold, dashSize: 0.18, gapSize: 0.12 });
const stillMat = new THREE.LineBasicMaterial({ color: '#8d98a2', transparent: true, opacity: 0.6 });

// ---------------------------------------------------------------- buildings
const DIMS = { prod: [1.8, 1.8, 2.6], staging: [1.5, 1.5, 1.9], preview: [1, 1, 1.2] };
const kindOf = e => e.name === 'prod' ? 'prod' : e.name === 'staging' ? 'staging' : 'preview';
function buildingMats(w, d, h, wallKey, lit, alpha, T) {
  const wall = wallKey === 'bad' ? COL.bad : wallKey === 'grey' ? COL.grey : T.wall;
  return C(`bm|${w}|${d}|${h}|${wallKey}|${lit}|${alpha}|${T.name}`, () => {
    const rows = Math.max(1, Math.floor(h / 0.62));
    const face = cols => new THREE.MeshStandardMaterial({ map: wallTex(cols, rows, wall, T.win, lit, false), roughness: 0.8,
      emissiveMap: lit ? wallTex(cols, rows, wall, T.win, lit, true) : null, emissive: lit ? T.win : '#000', emissiveIntensity: lit ? T.glow : 0,
      transparent: alpha < 1, opacity: alpha });
    const sx = face(Math.max(1, Math.round(d / 0.5))), sz = face(Math.max(1, Math.round(w / 0.5)));
    const top = new THREE.MeshStandardMaterial({ color: wallKey === 'ok' ? T.roof : wall, roughness: 0.9, transparent: alpha < 1, opacity: alpha });
    return [sx, sx, top, top, sz, sz];
  });
}
function scaffoldLines(w, d, h, still) {
  const x0 = -w / 2 - 0.15, x1 = w / 2 + 0.15, z0 = -d / 2 - 0.15, z1 = d / 2 + 0.15, H = h + 0.3, p = [];
  const seg = (a, b) => p.push(...a, ...b);
  for (const [x, z] of [[x0, z0], [x1, z0], [x1, z1], [x0, z1]]) seg([x, 0, z], [x, H, z]);
  for (let y = 0.6; y <= H + 0.01; y += 0.6) { seg([x0, y, z0], [x1, y, z0]); seg([x1, y, z0], [x1, y, z1]); seg([x1, y, z1], [x0, y, z1]); seg([x0, y, z1], [x0, y, z0]); }
  seg([x0, 0, z1], [x1, H, z1]); seg([x1, 0, z0], [x1, H, z1]);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  const l = new THREE.LineSegments(g, still ? stillMat : dashMat); l.computeLineDistances(); return l;
}
function stateOverlays(g, b, s, dbTop, T) {
  const { w, d, h } = b, act = s.activity, changing = act === 'arriving' || act === 'deploying' || act === 'updating';
  if (changing) g.add(scaffoldLines(w, d, h, s.stuck));
  if (act === 'arriving' && !s.stuck) {
    const m = std(COL.scaffold), cx = w / 2 + 0.15, cz = -d / 2 - 0.15, top = h + 2;
    box(g, 0.08, top, 0.08, m, cx, top / 2, cz); box(g, 2.2, 0.08, 0.08, m, cx - 0.9, top, cz);
    const hook = new THREE.Group(); hook.position.set(cx - 1.6, top, cz); g.add(hook);
    const cable = box(hook, 0.02, 0.8, 0.02, std('#444'), 0, -0.4, 0), blk = box(hook, 0.16, 0.16, 0.16, m, 0, -0.85, 0);
    anim(t => { const k = Math.sin(t / 500) * 0.2; cable.scale.y = 1 + k; cable.position.y = -0.4 * (1 + k); blk.position.y = -0.85 - 0.8 * k; });
  }
  if (s.stuck) {
    const p = 0.4, W = w + 2 * p, D = d + 2 * p, mat = C('haz', () => new THREE.MeshStandardMaterial({ map: hazardTex(), roughness: 0.7 }));
    for (const [bw, bd, x, z] of [[W, 0.06, 0, D / 2], [W, 0.06, 0, -D / 2], [0.06, D, W / 2, 0], [0.06, D, -W / 2, 0]]) box(g, bw, 0.22, bd, mat, x, 0.3, z);
    const sp = new THREE.Sprite(C('octm', () => new THREE.SpriteMaterial({ map: octTex(), depthTest: false })));

  if (fly) {
    const q = Math.min(1, (t - fly.t0) / 1400), e = q < 0.5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2;
    controls.target.lerpVectors(fly.from, fly.to, e); camera.position.copy(controls.target).add(fly.off);
    camera.zoom = THREE.MathUtils.lerp(fly.z0, fly.z1, e); camera.updateProjectionMatrix();
    if (q >= 1) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
});

// Hover: the nearest ancestor with a tip wins.
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tip = document.getElementById('tip');
renderer.domElement.addEventListener('pointermove', e => {
  if (e.buttons) { tip.style.display = 'none'; return; }
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(root, true).find(h => { let o = h.object; while (o && !o.userData.tip) o = o.parent; return o; });
  let o = hit && hit.object; while (o && !o.userData.tip) o = o.parent;
  if (o) { tip.textContent = o.userData.tip; tip.style.display = 'block'; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 14 + 'px'; }
  else tip.style.display = 'none';
});
renderer.domElement.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

// ---------------------------------------------------------------- panel, switcher, events
function renderPanel() {
  const feed = document.getElementById('feed');
  feed.replaceChildren(...model.feed.slice(0, 14).map(f => { const li = document.createElement('li'); li.innerHTML = `<time>${f.t}</time>`; li.append(f.msg); return li; }));
}
const VARIANTS = Object.keys(THEMES);
function setVariant(v) { variant = v; const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u); rebuild(); }
const step = d => setVariant(VARIANTS[(VARIANTS.indexOf(variant) + d + VARIANTS.length) % VARIANTS.length]);
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
document.getElementById('togglePanel').onclick = e => {
  document.body.classList.toggle('nopanel'); resize();
  e.target.textContent = document.body.classList.contains('nopanel') ? 'Show panel' : 'Hide panel';
};

const clock = () => new Date().toTimeString().slice(0, 8);
const log = msg => model.feed.unshift({ t: clock(), msg });
const later = (ms, fn) => setTimeout(() => { fn(); rebuild(); }, ms);
const pick = a => a[Math.floor(Math.random() * a.length)];
const envs = () => model.apps.flatMap(a => a.envs);
const idle = () => envs().filter(e => e.activity === null && e.cond !== 'unknown');
const POOL = ['ledger', 'kantine', 'roomsy', 'fakturo', 'radar', 'intranet', 'onboard', 'crm', 'kudos', 'lunsj'];
function removeApp(a) {
  for (const e of a.envs) { if (e.activity === 'unreleased') e.wasUnreleased = true; e.activity = 'leaving'; e.stuck = false; }
  log(`${a.name} leaving: final backups running`);
  later(3500, () => { const t = performance.now(); a.envs.forEach((e, i) => { e.crumbleAt = t + i * 150; }); });
  later(5000, () => { a.sinkAt = performance.now(); });
  later(6700, () => { model.apps = model.apps.filter(x => x !== a); model.free.push(a.slot); log(`${a.name} left`); });
}
const deletable = () => model.apps.filter(x => !x.sinkAt && !x.envs.some(e => e.activity === 'leaving'));
const ACTIONS = {
  arrive() {
    const name = POOL.find(n => !model.apps.some(a => a.name === n)) || 'app' + seq, t = performance.now();
    const list = [mkEnv(name, 'prod', [cap('postgres')], { activity: 'arriving', bornAt: t, isNewApp: true })];
    if (Math.random() < 0.5) list.push(mkEnv(name, 'staging', [cap('postgres')], { activity: 'arriving', bornAt: t + 200, quiet: true }));
    const a = addApp(name, list, { isNew: true });
    log(`${name} arrived, setting up`);
    if (document.getElementById('flyNew').checked) { cells = hexSpiral(model.high + 1); const [x, z] = cellAt(a.slot); flyTo(x, z); }
    later(7000, () => { for (const e of a.envs) if (e.activity === 'arriving') e.activity = null; a.isNew = false; log(`${name} is serving`); });
  },
  firstDeploy() {
    const e = envs().find(v => v.activity === 'unreleased'); if (!e) return log('no Unreleased Environment left');
    e.activity = 'arriving'; e.bornAt = performance.now(); log(`${e.app} ${e.name} got its first image, arriving`);
    later(5000, () => { e.activity = null; log(`${e.app} ${e.name} is serving`); });
  },
  deploy() { const e = pick(idle()); if (!e) return; e.activity = 'deploying'; log(`Deploy to ${e.app} ${e.name}`); later(4500, () => { if (e.activity === 'deploying' && !e.stuck) { e.activity = null; log(`${e.app} ${e.name} deployed`); } }); },
  stuck() { const e = pick(idle()); if (!e) return; e.activity = 'deploying'; log(`Deploy to ${e.app} ${e.name}`); later(2500, () => { e.stuck = true; e.why = 'migration Job failed'; log(`${e.app} ${e.name} Deploy stuck: migration Job failed`); }); },
  update() { const e = pick(idle()); if (!e) return; e.activity = 'updating'; log(`${e.app} ${e.name} updating (secret set)`); later(4000, () => { if (!e.stuck) { e.activity = null; log(`${e.app} ${e.name} updated`); } }); },
  degrade() { const e = pick(envs().filter(v => v.cond === 'healthy' && v.activity !== 'unreleased')); if (e) { e.cond = 'degraded'; log(`${e.app} ${e.name} Degraded: CrashLoopBackOff`); } },
  unknown() { const e = pick(envs().filter(v => v.cond === 'healthy' && v.activity !== 'unreleased')); if (e) { e.cond = 'unknown'; log(`${e.app} ${e.name} Unknown: pod status Unknown`); } },
  warn() { const c = pick(envs().flatMap(e => e.caps.filter(k => k.kind === 'postgres' && !k.warn).map(k => [e, k]))); if (c) { c[1].warn = true; log(`${c[0].app} ${c[0].name} database: backups failing`); } },
  preview() {
    const a = pick(model.apps.filter(x => !x.sinkAt && x.envs.some(e => e.name === 'staging'))); if (!a) return;
    const n = 40 + Math.floor(Math.random() * 60), e = mkEnv(a.name, `pr-${n}`, [cap('login')], { activity: 'arriving', bornAt: performance.now() });
    a.envs.push(e); log(`${a.name} pr-${n} preview arriving`); later(4500, () => { e.activity = null; log(`${a.name} pr-${n} preview is serving`); });
  },
  closePreview() {
    const e = pick(envs().filter(v => v.name.startsWith('pr-') && v.activity !== 'leaving')); if (!e) return log('no preview open');
    e.activity = 'leaving'; log(`${e.app} ${e.name} leaving`);
    later(3000, () => { e.crumbleAt = performance.now(); });
    later(4400, () => { const a = model.apps.find(x => x.name === e.app); if (a) a.envs = a.envs.filter(v => v !== e); log(`${e.app} ${e.name} left`); });
  },
  deleteApp() { const a = pick(deletable()); if (a) removeApp(a); },
  deleteTwo() { const a = pick(deletable()); if (!a) return; removeApp(a); setTimeout(() => { const b = pick(deletable()); if (b) { removeApp(b); rebuild(); } }, 1200); },
  bump() { const c = model.comps.find(k => k.kind === 'cert-manager'); c.activity = 'updating'; c.stuck = false; log('cert-manager updating (chart bump)'); later(4000, () => { c.activity = null; log('cert-manager updated'); }); },
  traefik() { const c = model.comps.find(k => k.kind === 'traefik'); c.cond = c.cond === 'healthy' ? 'degraded' : 'healthy'; log(`Traefik ${c.cond === 'healthy' ? 'recovered' : 'Degraded'}`); },
  lose() { model.clusterLost = !model.clusterLost; log(model.clusterLost ? 'Argus lost the cluster' : 'Argus reconnected'); },
  settle() {
    for (const e of envs()) { if (e.activity !== 'unreleased' && e.activity !== 'leaving') e.activity = null; e.stuck = false; e.cond = 'healthy'; for (const c of e.caps) { c.warn = false; c.cond = 'healthy'; } }
    for (const c of model.comps) { c.activity = null; c.stuck = false; c.cond = 'healthy'; }
    model.clusterLost = false; log('everything settled');
  },
  fit() { fit(); },
};
document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => { ACTIONS[b.dataset.act](); rebuild(); }));

seed();
log('Argus connected (fake data)');
rebuild();
for (const a of (new URLSearchParams(location.search).get('do') || '').split(',').filter(Boolean)) { if (ACTIONS[a]) { ACTIONS[a](); rebuild(); } }
</script>
</body>
