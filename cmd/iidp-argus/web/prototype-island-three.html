<!doctype html>
<!--
  PROTOTYPE, throwaway. The Argus archipelago redrawn from scratch for three.js
  (the SVG iterations are prototype-island.html). Same model, states and events;
  new visuals. The rendering decision for the Argus map (#99) is still SVG
  without WebGL; this file is for comparison.

  Two ways to connect islets to the Platform, and only to the Platform:
    ?variant=lines    aerial cableways from the Platform spire; islets on fixed orbits, never move
    ?variant=bridges  one orbit, a straight bridge each; the orbit widens and islets glide as it fills
  The Night toggle is separate. Loads three.js from a CDN, so it needs internet.
  Left-drag pans, right-drag rotates, scroll zooms. ?do=arrive,deleteApp runs events on load.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE · Argus in three.js</title>
<style>
  :root { --panel:#11161c; --ink:#e6edf3; --muted:#8b98a5; --line:#26303a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; color:var(--ink);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #stage { position:fixed; inset:0 330px 0 0; }
  body.nopanel #stage { right:0; }
  #stage canvas { display:block; width:100%; height:100%; }
  #panel { position:fixed; top:0; right:0; bottom:0; width:330px; overflow:auto; background:var(--panel);
    border-left:1px solid var(--line); padding:14px 16px 90px; }
  body.nopanel #panel { display:none; }
  h1 { font-size:15px; font-weight:650; margin:0 0 2px; }
  h2 { font-size:11.5px; font-weight:650; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:18px 0 8px; }
  .note { color:var(--muted); font-size:12px; margin:0; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  button { font:inherit; font-size:12.5px; color:var(--ink); background:#1b232c; border:1px solid #2c3845;
    border-radius:4px; padding:7px 8px; text-align:left; cursor:pointer; }
  button:hover { background:#243039; }
  label.opt { display:flex; gap:8px; align-items:center; font-size:12.5px; margin-top:8px; color:#c9d4dd; }
  #feed { list-style:none; margin:0; padding:0; font-size:12.5px; }
  #feed li { padding:3px 0; border-bottom:1px solid #1c242d; }
  #feed time { color:var(--muted); margin-right:6px; font-variant-numeric:tabular-nums; }
  #switcher { position:fixed; left:calc((100% - 330px) / 2); bottom:18px; transform:translateX(-50%); display:flex;
    align-items:center; gap:2px; background:#0d1117; color:#f0f6fc; border:1px solid #3d444d; border-radius:6px;
    box-shadow:0 6px 24px rgba(0,0,0,.45); font-size:13px; z-index:10; }
  body.nopanel #switcher { left:50%; }
  #switcher button { background:none; border:0; color:inherit; padding:8px 12px; font-size:16px; }
  #switcher .label { padding:0 10px; min-width:260px; text-align:center; }
  #togglePanel { position:fixed; top:12px; right:342px; z-index:10; background:#0d1117ee; }
  body.nopanel #togglePanel { right:12px; }
  #tip { position:fixed; pointer-events:none; background:#0d1117f2; color:#e6edf3; border:1px solid #3d444d;
    border-radius:4px; padding:6px 8px; font-size:12px; white-space:pre; display:none; z-index:20; }
  #lost { position:fixed; top:14px; left:calc((100% - 330px) / 2); transform:translateX(-50%); background:#2b3137;
    color:#e6edf3; border:1px solid #57606a; border-radius:4px; padding:7px 12px; font-size:13px; display:none; z-index:10; }
  #title { position:fixed; top:14px; left:16px; font-size:13px; font-weight:600; z-index:10;
    background:#0d1117cc; color:#e6edf3; padding:5px 9px; border-radius:4px; }
  #err { position:fixed; top:45%; left:20%; right:350px; color:#ffb4ab; display:none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<body>
<div id="stage"></div>
<div id="title">Argus · three.js, drawn from scratch (throwaway)</div>
<div id="lost">Argus has lost the cluster. Showing the last known state.</div>
<div id="err">Couldn't start. This prototype loads three.js from a CDN and needs WebGL.</div>
<button id="togglePanel">Hide panel</button>
<div id="switcher">
  <button id="prev" aria-label="Previous variant">‹</button>
  <div class="label" id="variantLabel"></div>
  <button id="next" aria-label="Next variant">›</button>
</div>
<div id="tip"></div>
<aside id="panel">
  <h1>Push the Platform around</h1>
  <p class="note">Fake data. Left-drag pans, right-drag rotates, scroll zooms. Hover anything.</p>
  <label class="opt"><input type="checkbox" id="night"> Night</label>
  <label class="opt"><input type="checkbox" id="flyNew" checked> Fly to Applications as they arrive</label>
  <h2>Events</h2>
  <div class="actions">
    <button data-act="arrive">An Application arrives</button>
    <button data-act="firstDeploy">wiki gets its first image</button>
    <button data-act="deploy">Deploy an Environment</button>
    <button data-act="stuck">A Deploy gets stuck</button>
    <button data-act="update">Set a secret (Updating)</button>
    <button data-act="degrade">An Environment degrades</button>
    <button data-act="unknown">One Environment goes Unknown</button>
    <button data-act="warn">A database backup fails</button>
    <button data-act="preview">Open a preview</button>
    <button data-act="closePreview">Close a preview</button>
    <button data-act="deleteApp">Delete an Application</button>
    <button data-act="deleteTwo">Delete two at once</button>
    <button data-act="bump">Bump cert-manager</button>
    <button data-act="traefik">Traefik degrades / recovers</button>
    <button data-act="lose">Lose / regain the cluster</button>
    <button data-act="settle">Settle everything</button>
    <button data-act="fit">Fit view</button>
  </div>
  <h2>Feed</h2>
  <ul id="feed"></ul>
</aside>

<script type="module">
window.addEventListener('error', () => { document.getElementById('err').style.display = 'block'; });
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================================================================ model and events (unchanged logic)
let seq = 0;
const cap = (kind, o = {}) => ({ kind, cond: 'healthy', warn: false, ...o });
const mkEnv = (app, name, caps = [], o = {}) => ({ id: ++seq, app, name, cond: 'healthy', activity: null, stuck: false, caps, bornAt: -1e9, ...o });
const model = { apps: [], comps: [], clusterLost: false, free: [], high: 0, feed: [] };
const takeSlot = () => { if (model.free.length) { model.free.sort((a, b) => a - b); return model.free.shift(); } return ++model.high; };
const addApp = (name, envs, o = {}) => { const a = { name, envs, slot: takeSlot(), isNew: false, ...o }; model.apps.push(a); return a; };
function seed() {
  const A = (n, f) => addApp(n, f(n));
  A('shop', n => [mkEnv(n, 'prod', [cap('postgres'), cap('login')]), mkEnv(n, 'staging', [cap('postgres'), cap('login')]), mkEnv(n, 'pr-42', [cap('login')])]);
  A('iprofil', n => [mkEnv(n, 'prod', [cap('postgres'), cap('domain', { host: 'iprofil.no' })]), mkEnv(n, 'staging', [cap('postgres')])]);
  A('hello', n => [mkEnv(n, 'prod')]);
  A('api', n => [mkEnv(n, 'prod', [cap('postgres', { warn: true })], { cond: 'degraded' }), mkEnv(n, 'staging', [cap('postgres')], { activity: 'deploying' })]);
  A('wiki', n => [mkEnv(n, 'prod', [], { activity: 'unreleased' })]);
  A('timesheet', n => [mkEnv(n, 'prod', [cap('postgres'), cap('task')]), mkEnv(n, 'staging', [cap('postgres')], { activity: 'deploying', stuck: true, why: 'migration Job failed' })]);
  A('booking', n => [mkEnv(n, 'prod', [cap('login'), cap('domain', { host: 'booking.itema.no' })], { cond: 'unknown' }), mkEnv(n, 'staging', [cap('login')], { activity: 'updating' })]);
  const C = (kind, label, o = {}) => model.comps.push({ kind, label, cond: 'healthy', activity: null, stuck: false, ...o });
  C('argocd', 'ArgoCD'); C('traefik', 'Traefik'); C('deploy-gate', 'Deploy gate'); C('cert-manager', 'cert-manager', { activity: 'updating' });
  C('external-dns', 'external-dns'); C('cnpg', 'CloudNativePG'); C('oauth2-proxy', 'Itema login'); C('alloy', 'Alloy');
}
const actLabel = e => e.activity === null ? 'none' : e.activity[0].toUpperCase() + e.activity.slice(1) + (e.stuck ? ' (stuck)' : '');
const condLabel = e => e.cond[0].toUpperCase() + e.cond.slice(1);
function tipEnv(e) {
  const l = [`${e.app} ${e.name}`, `Condition: ${e.activity === 'unreleased' ? 'n/a' : condLabel(e)}`, `Activity: ${actLabel(e)}`];
  if (e.stuck && e.why) l.push(`Why stuck: ${e.why}`);
  if (e.activity === 'leaving' && e.caps.some(c => c.kind === 'postgres')) l.push('Final backup running');
  for (const c of e.caps) l.push(`  ${c.kind}${c.host ? ' ' + c.host : ''}: ${condLabel(c)}${c.warn ? ' · Warning: backups failing' : ''}`);
  return l.join('\n');
}
const tipComp = c => `${c.label} (Platform component)\nCondition: ${condLabel(c)}\nActivity: ${actLabel(c)}`;

// ================================================================ look
const DAY = { sky: '#dfe7ee', water: '#b7c8d6', shallows: '#c9d6e0', ripple: 'rgba(255,255,255,0.16)', rock: '#2b3540', top: '#3c4a58',
  plaza: '#4c5c6c', curb: '#6d7e8e', path: '#57687a', engDark: '#232d36', engLight: '#6a7d8e', wall: '#f5f7f9', plinth: '#c5ced6',
  parapet: '#d5dce2', glass: '#86bde9', glassDark: '#50606d', glow: 0.08, lamp: 0.2, hemi: 1.2, sun: 2.6, sunColor: '#fff6e8', cable: '#c9d4dd' };
const NIGHT = { ...DAY, sky: '#070e15', water: '#0a1620', shallows: '#10233a', ripple: 'rgba(160,200,255,0.05)', rock: '#161d24', top: '#2c3743',
  plaza: '#374452', curb: '#4d5c6b', path: '#3f4d5b', engDark: '#141b21', engLight: '#4a5b6a', wall: '#c7d0d8', plinth: '#8a96a0',
  parapet: '#a3aeb7', glass: '#ffcb6b', glassDark: '#26313a', glow: 1.7, lamp: 2.2, hemi: 0.3, sun: 0.55, sunColor: '#9fb7ff', cable: '#5f7486' };
const ACCENT = { build: '#5fd3ff', work: '#ffc233', stuck: '#ff7a1a', bad: '#e0655a', grey: '#9aa2a8', gold: '#e5bf57',
  silo: '#e7ecf0', backup: '#58a6ff', warn: '#ffcc33', lamp: '#ffe2a0' };
const VARIANTS = { lines: 'Lines: cableways from the Platform', bridges: 'Bridges: one orbit, glides as it fills' };

// ================================================================ three.js setup
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const FRUST = 30, OFFSET = new THREE.Vector3(70, 62, 70);
const camera = new THREE.OrthographicCamera(-FRUST, FRUST, FRUST, -FRUST, -600, 1200);
camera.position.copy(OFFSET);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.screenSpacePanning = false;
controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.maxPolarAngle = Math.PI * 0.43; controls.minPolarAngle = Math.PI * 0.1; controls.minZoom = 0.25; controls.maxZoom = 7;
const hemi = new THREE.HemisphereLight('#ffffff', '#3a4a5a', 1);
const sun = new THREE.DirectionalLight('#ffffff', 2);
sun.position.set(-40, 80, 25); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -90, right: 90, top: 90, bottom: -90, near: 1, far: 260 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(hemi, sun, sun.target);
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight, a = w / h;
  renderer.setSize(w, h, false);
  Object.assign(camera, { left: -FRUST * a, right: FRUST * a, top: FRUST, bottom: -FRUST }); camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ================================================================ helpers
const cache = new Map();
const C = (k, f) => { if (!cache.has(k)) cache.set(k, f()); return cache.get(k); };
const mat = (color, o = {}) => C('m' + color + JSON.stringify(o), () => new THREE.MeshStandardMaterial({ color, roughness: 0.82, ...o }));
const glowMat = (color, i = 1.5) => C('g' + color + i, () => new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: i, roughness: 0.4 }));
function tex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function mesh(parent, geo, m, x = 0, y = 0, z = 0, cast = true) {
  const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = cast; o.receiveShadow = true; parent.add(o); return o;
}
const boxM = (p, w, h, d, m, x, y, z, cast) => mesh(p, new THREE.BoxGeometry(w, h, d), m, x, y, z, cast);
const cylM = (p, rt, rb, h, m, x, y, z, seg = 28, cast) => mesh(p, new THREE.CylinderGeometry(rt, rb, h, seg), m, x, y, z, cast);
const group = (p, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); p.add(g); return g; };
const soft = () => C('soft', () => tex(128, 128, (g, w) => {
  const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, w);
}));
function puff(parent, color, opacity, additive = false) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: soft(), color, transparent: true, opacity, depthWrite: false,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending }));
  s.userData.own = true; parent.add(s); return s;
}
function textTex(s, { px = 64, color = '#fff', bg = null, weight = 800, stroke = null } = {}) {
  return C(`t|${s}|${px}|${color}|${bg}|${weight}|${stroke}`, () => {
    const m = document.createElement('canvas').getContext('2d'); m.font = `${weight} ${px}px system-ui,sans-serif`;
    const w = Math.ceil(m.measureText(s).width) + px * 0.7, h = Math.ceil(px * 1.4);
    const t = tex(w, h, g => {
      if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
      g.font = `${weight} ${px}px system-ui,sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      if (stroke) { g.lineJoin = 'round'; g.lineWidth = px * 0.18; g.strokeStyle = stroke; g.strokeText(s, w / 2, h / 2); }
      g.fillStyle = color; g.fillText(s, w / 2, h / 2);
    });
    t.userData = { aspect: w / h }; return t;
  });
}
function sprite(parent, s, height, y, o = {}) {
  const t = textTex(s, o), sp = new THREE.Sprite(C('sp' + t.uuid, () => new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true })));
  sp.scale.set(height * t.userData.aspect, height, 1); sp.position.y = y; sp.renderOrder = 20; parent.add(sp); return sp;
}
// Screen-facing directions for this camera: U runs right on screen, V towards the viewer.
const Ux = Math.SQRT1_2, Uz = -Math.SQRT1_2, Vx = Math.SQRT1_2, Vz = Math.SQRT1_2;
const uv = (u, v) => [u * Ux + v * Vx, u * Uz + v * Vz];
// A name cut into stone: a lit lower lip and a shadowed upper wall, then the dark floor of the cut.
function carve(parent, s, u, v, height, P) {
  const t = C(`carve|${s}|${P.engDark}`, () => {
    const px = 110, m = document.createElement('canvas').getContext('2d'); m.font = `800 ${px}px system-ui,sans-serif`;
    const w = Math.ceil(m.measureText(s).width) + 60, h = px + 40;
    const x = tex(w, h, g => {
      g.font = `800 ${px}px system-ui,sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillText(s, w / 2, h / 2 - 5);
      g.fillStyle = P.engLight; g.fillText(s, w / 2, h / 2 + 5);
      g.fillStyle = P.engDark; g.fillText(s, w / 2, h / 2);
    });
    x.userData = { aspect: w / h }; return x;
  });
  const m = C('carvem' + t.uuid, () => new THREE.MeshStandardMaterial({ map: t, transparent: true, depthWrite: false, roughness: 1, polygonOffset: true, polygonOffsetFactor: -4 }));
  const o = new THREE.Mesh(new THREE.PlaneGeometry(height * t.userData.aspect, height), m);
  const [x, z] = uv(u, v);
  // Flat on the ground, then turned so it reads left to right on screen.
  o.rotation.order = 'YXZ'; o.rotation.set(-Math.PI / 2, Math.PI / 4, 0);
  o.position.set(x, 0.09, z); o.receiveShadow = true; parent.add(o); return o;
}

// ================================================================ animation
// Everything animated reads its start time from the model, so rebuilding the scene never restarts it.
let anims = [];
const anim = f => anims.push(f);
const ease = q => q < 0.5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2;
const clamp01 = q => Math.min(1, Math.max(0, q));

// ================================================================ textures
// Ribbon windows: a continuous glass band per floor with mullions. The emissive map lights some panes at night.
function facade(cols, floors, P, wall, lit, emissive) {
  return C(`fac|${cols}|${floors}|${wall}|${lit}|${emissive}|${P.glass}`, () => tex(cols * 28, floors * 44, (g, w, h) => {
    g.fillStyle = emissive ? '#000' : wall; g.fillRect(0, 0, w, h);
    for (let f = 0; f < floors; f++) {
      const y = f * 44 + 12;
      if (!emissive) { g.fillStyle = lit ? P.glass : P.glassDark; g.fillRect(0, y, w, 22); }
      for (let c = 0; c < cols; c++) {
        const on = lit && ((c * 13 + f * 7) % 9) > 2;
        if (emissive && on) { g.fillStyle = '#fff'; g.globalAlpha = 0.5 + ((c + f) % 3) * 0.25; g.fillRect(c * 28 + 2, y + 2, 24, 18); g.globalAlpha = 1; }
        if (!emissive) { g.fillStyle = wall; g.fillRect(c * 28, y, 3, 22); }
      }
      if (!emissive) { g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(0, y, w, 3); }
    }
  }));
}
const hazard = () => C('hz', () => { const t = tex(64, 16, g => { g.fillStyle = '#1b1b1b'; g.fillRect(0, 0, 64, 16); g.fillStyle = '#ff8a1f'; for (let x = -16; x < 80; x += 16) { g.beginPath(); g.moveTo(x, 16); g.lineTo(x + 8, 0); g.lineTo(x + 16, 0); g.lineTo(x + 8, 16); g.fill(); } }); t.wrapS = THREE.RepeatWrapping; return t; });
const octTex = () => C('oct', () => tex(128, 128, g => {
  g.beginPath(); for (let i = 0; i < 8; i++) { const a = Math.PI / 8 + i * Math.PI / 4; g.lineTo(64 + 56 * Math.cos(a), 64 + 56 * Math.sin(a)); }
  g.closePath(); g.fillStyle = ACCENT.stuck; g.fill(); g.lineWidth = 7; g.strokeStyle = '#fff'; g.stroke();
  g.fillStyle = '#fff'; g.font = '900 78px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('!', 64, 68);
}));
const padTex = k => C('pad' + k, () => tex(128, 128, g => {
  g.fillStyle = '#2b3641'; g.beginPath(); g.arc(64, 64, 62, 0, 7); g.fill();
  g.strokeStyle = '#f2f5f7'; g.lineWidth = 5; g.beginPath(); g.arc(64, 64, 50, 0, 7); g.stroke();
  g.fillStyle = '#f2f5f7'; g.font = '900 66px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(k, 64, 69);
}));
const rippleTex = P => C('rip' + P.ripple, () => {
  const t = tex(256, 256, g => {
    g.strokeStyle = P.ripple; g.lineWidth = 2;
    for (let i = 0; i < 14; i++) { const x = (i * 97) % 256, y = (i * 53) % 256, l = 10 + (i % 5) * 5; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + l / 2, y - 3, x + l, y); g.stroke(); }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(140, 140); return t;
});

// ================================================================ buildings
const DIMS = { prod: { w: 2.2, d: 2.2, h: 3.4 }, staging: { w: 1.8, d: 1.8, h: 2.5 }, preview: { w: 1.1, d: 1.1, h: 1.3 } };
const kindOf = e => e.name === 'prod' ? 'prod' : e.name === 'staging' ? 'staging' : 'preview';
function facadeMats(b, key, lit, alpha, P) {
  const wall = key === 'bad' ? ACCENT.bad : key === 'grey' ? ACCENT.grey : P.wall;
  return C(`fm|${b.w}|${b.h}|${key}|${lit}|${alpha}|${P.glass}|${P.glow}`, () => {
    const floors = Math.max(1, Math.round(b.h / 0.6)), cols = Math.max(2, Math.round(b.w / 0.3));
    const side = new THREE.MeshStandardMaterial({ map: facade(cols, floors, P, wall, lit, false), roughness: 0.55, metalness: 0.05,
      emissiveMap: lit ? facade(cols, floors, P, wall, lit, true) : null, emissive: lit ? P.glass : '#000', emissiveIntensity: lit ? P.glow : 0,
      transparent: alpha < 1, opacity: alpha });
    const roof = new THREE.MeshStandardMaterial({ color: key === 'ok' ? P.parapet : wall, roughness: 0.9, transparent: alpha < 1, opacity: alpha });
    return [side, side, roof, roof, side, side];
  });
}
// Blueprint envelope for Arriving: glowing edges, a translucent volume that fills from the ground, a scan plane.
function blueprint(g, b, bornAt, dur) {
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(b.w + 0.1, b.h, b.d + 0.1)), C('bpl', () => new THREE.LineBasicMaterial({ color: ACCENT.build, transparent: true, opacity: 0.9 })));
  edges.position.y = b.h / 2; g.add(edges);

    if (kind === 'deploy-gate') {

      const arm = group(cg, 0.75, 0.9, 0.7); boxM(cg, 0.16, 0.95, 0.16, mat('#39444e'), 0.75, 0.47, 0.7);
      const bar = boxM(arm, 2.4, 0.1, 0.1, C('hzm', () => new THREE.MeshStandardMaterial({ map: hazard(), roughness: 0.6 })), 1.2, 0, 0);
      bar.material.map.repeat.set(4, 1);
      anim(() => { const up = deploying() ? 1.2 : 0; arm.rotation.z += (up - arm.rotation.z) * 0.06; });
      h = 1.5;
    }
    if (kind === 'cert-manager') {
      boxM(cg, 1.4, 1.2, 1.2, wall, 0, 0.6, 0);
      const seal = mesh(cg, new THREE.CylinderGeometry(0.38, 0.38, 0.08, 32), gold, 0, 0.7, 0.62); seal.rotation.x = Math.PI / 2;
      h = 1.3;
    }
    if (kind === 'cnpg') {
      boxM(cg, 1.2, 0.9, 1.0, wall, -0.4, 0.45, 0);
      for (const sx of [0.6, 1.25]) { cylM(cg, 0.32, 0.32, 1.4, mat(ACCENT.silo), sx, 0.7, 0); mesh(cg, new THREE.SphereGeometry(0.32, 18, 10, 0, 6.283, 0, Math.PI / 2), mat(ACCENT.silo), sx, 1.4, 0); }
      const pipe = mesh(cg, new THREE.TorusGeometry(0.33, 0.05, 8, 20, Math.PI), mat('#8fa0ad'), 0.93, 1.15, 0); pipe.rotation.z = 0;
      h = 1.8;
    }
    if (kind === 'external-dns') {
      cylM(cg, 0.08, 0.12, 1.5, mat('#8fa0ad'), 0, 0.75, 0, 12);
      const head = group(cg, 0, 1.55, 0);
      const dish = mesh(head, new THREE.SphereGeometry(0.8, 24, 12, 0, Math.PI * 2, 0, Math.PI / 3), C('dish', () => new THREE.MeshStandardMaterial({ color: '#eef2f5', side: THREE.DoubleSide, roughness: 0.5 })), 0, 0, 0);
      dish.rotation.x = -Math.PI / 2.4;

      h = 2.3;
    }
    if (kind === 'oauth2-proxy') {

      mesh(cg, new THREE.SphereGeometry(0.16, 12, 8), glowMat(ACCENT.lamp, P.lamp + 0.4), 0, 3.15, 0, false);
      h = 3.2;
    }
    if (kind === 'alloy') {
      cylM(cg, 0.05, 0.1, 4, mat('#d8dee3'), 0, 2, 0, 8);
      for (let k = 1; k <= 4; k++) boxM(cg, 0.7 - k * 0.12, 0.04, 0.04, mat('#d8dee3'), 0, 4 - k * 0.7, 0);
      const tip = mesh(cg, new THREE.SphereGeometry(0.13, 12, 8), glowMat('#ff5c5c', 2.5), 0, 4.05, 0, false);
      anim(t => { tip.visible = Math.floor(t / 500) % 2 === 0; });
      // Signals to Grafana Cloud rise off the mast.
      for (let i = 0; i < 3; i++) {
        const r = mesh(cg, new THREE.TorusGeometry(0.3, 0.02, 6, 32), C('sig', () => new THREE.MeshBasicMaterial({ color: '#ff8a80', transparent: true, opacity: 0.8 })), 0, 4.2, 0, false);
        r.rotation.x = Math.PI / 2; r.material = r.material.clone(); r.userData.own = true;
        anim(t => { const k = ((t / 1000 + i * 0.7) % 2.1) / 2.1; r.position.y = 4.2 + k * 1.6; r.scale.setScalar(1 + k * 2.5); r.material.opacity = 0.7 * (1 - k); });
      }
      h = 4.2;
    }
    sprite(cg, c.label, 0.62, h + 0.7, { px: 44, color: '#eef2f5', stroke: '#1b232a', weight: 700 });
    if (c.activity) sweep(cg, { w: 1.6, d: 1.4, h }, c.stuck);
    if (c.stuck) siren(cg, h);
    if (c.cond === 'degraded') smoke(cg, h);
  }
  return g;
}

// ================================================================ layout and connections
// Lines: fixed orbits. Ring k holds 6k islets, every other ring offset half a step. Nothing ever moves.
function orbitSlot(slot) {
  let s = slot - 1, k = 1;
  while (s >= 6 * k) { s -= 6 * k; k++; }
  const n = 6 * k, a = (s / n) * Math.PI * 2 + (k % 2 === 0 ? Math.PI / n : 0) + Math.PI / 4;
  const r = 20 + (k - 1) * 15;
  return { x: Math.cos(a) * r, z: Math.sin(a) * r };
}
// Bridges: every islet on one orbit that widens as it fills, so no bridge crosses an islet.
function ringLayout() {
  const apps = [...model.apps].sort((a, b) => a.slot - b.slot), n = Math.max(apps.length, 1);
  const r = Math.max(22, (n * 15.5) / (2 * Math.PI));
  return new Map(apps.map((a, i) => { const ang = Math.PI / 4 + (i / n) * Math.PI * 2; return [a, { x: Math.cos(ang) * r, z: Math.sin(ang) * r }]; }));
}
const target = (a, lay) => variant === 'lines' ? orbitSlot(a.slot) : lay.get(a);
// A cable from the spire's gold ring to the islet's pylon. Deploys run along it as light.
function cableway(root, app, pos, P) {
  const dir = new THREE.Vector3(pos.x, 0, pos.z).normalize();
  const pylonAt = new THREE.Vector3(pos.x, 0, pos.z).addScaledVector(dir, -(RI - 0.7));
  const planned = app.isNew || app.envs.every(e => e.activity === 'unreleased');
  const pg = group(root, pylonAt.x, 0, pylonAt.z);
  cylM(pg, 0.08, 0.16, 4.6, mat('#5d6d7b'), 0, 2.3, 0, 8);
  for (let y = 1; y < 4.5; y += 0.9) boxM(pg, 0.5, 0.05, 0.05, mat('#5d6d7b'), 0, y, 0).rotation.y = Math.atan2(dir.x, dir.z);
  mesh(pg, new THREE.TorusGeometry(0.22, 0.05, 8, 20), mat(ACCENT.gold, { metalness: 0.5 }), 0, 4.65, 0).rotation.y = Math.atan2(dir.x, dir.z) + Math.PI / 2;
  const a = dir.clone().multiplyScalar(0.8).setY(9.1), b = pylonAt.clone().setY(4.65);
  const sag = new THREE.Vector3(0, -1.6, 0);
  const curve = new THREE.CubicBezierCurve3(a, a.clone().lerp(b, 0.33).add(sag), a.clone().lerp(b, 0.66).add(sag), b);
  const cm = planned ? C('cabP' + P.cable, () => new THREE.MeshStandardMaterial({ color: P.cable, transparent: true, opacity: 0.3 })) : mat(P.cable, { metalness: 0.3, roughness: 0.4 });
  const cable = mesh(root, new THREE.TubeGeometry(curve, 48, 0.06, 6), cm, 0, 0, 0, true);
  pulses(root, app, i => curve.getPointAt(i));
  if (app.sinkAt) anim(t => { const q = clamp01((t - app.sinkAt) / 1200); cable.visible = pg.visible = q < 1; pg.position.y = -q * 5; });
}
// A bridge from the Platform's edge to the islet's dock. Its ends follow the islets as they glide.
function bridge(root, app, P) {
  const bg = group(root);
  const planned = app.isNew || app.envs.every(e => e.activity === 'unreleased');
  const deck = boxM(bg, 1, 0.2, 1.3, planned ? C('deckP' + P.path, () => new THREE.MeshStandardMaterial({ color: P.path, transparent: true, opacity: 0.35 })) : mat(P.path), 0, -0.05, 0);
  const rails = [0.62, -0.62].map(o => boxM(bg, 1, 0.1, 0.06, mat('#a7b6c2'), 0, 0.25, o));
  const posts = [];
  const ends = () => { const c = app.cur, d = new THREE.Vector3(c.x, 0, c.z), L = d.length(), u = d.clone().divideScalar(L); return { a: u.clone().multiplyScalar(RC - 0.3), b: u.clone().multiplyScalar(L - RI + 0.3), u }; };
  anim(t => {
    const { a, b, u } = ends(), mid = a.clone().add(b).multiplyScalar(0.5), len = a.distanceTo(b), ang = -Math.atan2(u.z, u.x);
    bg.position.set(mid.x, 0, mid.z); bg.rotation.y = ang;
    deck.scale.x = len; for (const r of rails) r.scale.x = len;
    if (app.sinkAt) { const q = clamp01((t - app.sinkAt) / 1400); bg.position.y = -q * 3; bg.visible = q < 1; }
  });
  pulses(root, app, i => { const { a, b } = ends(); return a.clone().lerp(b, i).setY(0.3); });
}
// Deploys run from the Platform to the islet as beads of light; a stuck one halts, orange.
function pulses(root, app, at) {
  const envs = app.envs.filter(e => e.activity === 'deploying');
  envs.forEach((e, j) => {
    for (let i = 0; i < (e.stuck ? 1 : 3); i++) {
      const bead = mesh(root, new THREE.SphereGeometry(0.2, 12, 8), glowMat(e.stuck ? ACCENT.stuck : ACCENT.work, 2.2), 0, 0, 0, false);
      const halo = puff(bead, e.stuck ? ACCENT.stuck : ACCENT.work, 0.6, true); halo.scale.setScalar(1.2);
      anim(t => { const k = e.stuck ? 0.72 : ((t / 1000 + i * 0.55 + j * 0.2) % 1.65) / 1.65; bead.position.copy(at(k)); });
    }
  });
}

// ================================================================ build, loop, camera
let root = null, variant = new URLSearchParams(location.search).get('variant');
if (!VARIANTS[variant]) variant = 'lines';
let water = null, fitted = false;
const P = () => document.getElementById('night').checked ? NIGHT : DAY;
function dispose(o) { o.traverse(x => { if (x.geometry) x.geometry.dispose(); if (x.userData.own && x.material) x.material.dispose(); }); }
function rebuild() {
  const p = P();
  scene.background = new THREE.Color(p.sky); scene.fog = new THREE.Fog(p.sky, 120, 320);
  hemi.intensity = p.hemi; sun.intensity = p.sun; sun.color.set(p.sunColor);
  if (!water) {
    water = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.1 }));
    water.rotation.x = -Math.PI / 2; water.position.y = -0.7; water.receiveShadow = true; scene.add(water);
    const rip = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false }));
    rip.rotation.x = -Math.PI / 2; rip.position.y = -0.68; scene.add(rip); water.userData.rip = rip;
  }
  water.material.color.set(p.water); water.userData.rip.material.map = rippleTex(p); water.userData.rip.material.needsUpdate = true;
  if (root) { scene.remove(root); dispose(root); }
  anims = []; root = new THREE.Group(); scene.add(root);
  platform(root, p);
  const lay = ringLayout();
  for (const a of model.apps) {
    const tgt = target(a, lay);
    if (!a.cur || variant === 'lines') a.cur = { ...tgt };
    const dirTo = () => { const v = new THREE.Vector3(-a.cur.x, 0, -a.cur.z).normalize(); return v; };
    const g = islet(root, a, a.cur, dirTo(), p, variant);
    if (variant === 'lines') cableway(root, a, a.cur, p);
    else {
      bridge(root, a, p);
      anim(() => { a.cur.x += (tgt.x - a.cur.x) * 0.04; a.cur.z += (tgt.z - a.cur.z) * 0.04; g.position.x = a.cur.x; g.position.z = a.cur.z; });
    }
  }
  if (model.clusterLost) {
    const bb = new THREE.Box3().setFromObject(root);
    for (let i = 0; i < 22; i++) {
      const f = puff(root, '#e8eef2', 0.75), x = THREE.MathUtils.lerp(bb.min.x, bb.max.x, ((i * 37) % 100) / 100), z = THREE.MathUtils.lerp(bb.min.z, bb.max.z, ((i * 61) % 100) / 100);
      anim(t => { f.position.set(x + Math.sin(t / 3000 + i) * 2, 3 + (i % 4), z); f.scale.setScalar(20); });
    }
  }
  document.getElementById('lost').style.display = model.clusterLost ? 'block' : 'none';
  document.getElementById('variantLabel').textContent = VARIANTS[variant];
  if (!fitted) { fit(); fitted = true; }
  renderPanel();
}
function fit() {
  const bb = new THREE.Box3().setFromObject(root), c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3());
  controls.target.set(c.x, 0, c.z); camera.position.copy(controls.target).add(OFFSET);
  camera.zoom = FRUST / (Math.max(s.x, s.z) * 0.4); camera.updateProjectionMatrix(); controls.update();
}
let fly = null;
function flyTo(x, z, zoom = 2) {
  const off = camera.position.clone().sub(controls.target);
  fly = { from: controls.target.clone(), to: new THREE.Vector3(x, 0, z), off, z0: camera.zoom, z1: zoom, t0: performance.now() };
}
renderer.setAnimationLoop(() => {
  const t = performance.now();
  for (const f of anims) f(t);
  if (water) { const m = water.userData.rip.material.map; if (m) { m.offset.x = t / 90000; m.offset.y = t / 140000; } }
  if (fly) {
    const q = clamp01((t - fly.t0) / 1500), e = ease(q);
    controls.target.lerpVectors(fly.from, fly.to, e); camera.position.copy(controls.target).add(fly.off);
    camera.zoom = THREE.MathUtils.lerp(fly.z0, fly.z1, e); camera.updateProjectionMatrix();
    if (q >= 1) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tip = document.getElementById('tip');
renderer.domElement.addEventListener('pointermove', e => {
  if (e.buttons) { tip.style.display = 'none'; return; }
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  let o = null;
  for (const h of ray.intersectObject(root, true)) { let x = h.object; while (x && !x.userData.tip) x = x.parent; if (x) { o = x; break; } }
  if (o) { tip.textContent = o.userData.tip; tip.style.display = 'block'; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 14 + 'px'; }
  else tip.style.display = 'none';
});
renderer.domElement.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

// ================================================================ panel and events
function renderPanel() {
  document.getElementById('feed').replaceChildren(...model.feed.slice(0, 14).map(f => { const li = document.createElement('li'); li.innerHTML = `<time>${f.t}</time>`; li.append(f.msg); return li; }));
}
const KEYS = Object.keys(VARIANTS);
function setVariant(v) { variant = v; fitted = false; const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u); rebuild(); }
const step = d => setVariant(KEYS[(KEYS.indexOf(variant) + d + KEYS.length) % KEYS.length]);
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.addEventListener('keydown', e => { if (e.target.closest('input')) return; if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
document.getElementById('night').onchange = () => rebuild();
document.getElementById('togglePanel').onclick = e => { document.body.classList.toggle('nopanel'); resize(); e.target.textContent = document.body.classList.contains('nopanel') ? 'Show panel' : 'Hide panel'; };

const clock = () => new Date().toTimeString().slice(0, 8);
const log = msg => model.feed.unshift({ t: clock(), msg });
const later = (ms, fn) => setTimeout(() => { fn(); rebuild(); }, ms);
const pick = a => a[Math.floor(Math.random() * a.length)];
const envs = () => model.apps.flatMap(a => a.envs);
const idle = () => envs().filter(e => e.activity === null && e.cond !== 'unknown');
const POOL = ['ledger', 'kantine', 'roomsy', 'fakturo', 'radar', 'intranet', 'onboard', 'crm', 'kudos', 'lunsj'];
function removeApp(a) {
  const t0 = performance.now();
  for (const e of a.envs) { if (e.activity === 'unreleased') e.wasUnreleased = true; e.activity = 'leaving'; e.leaveAt = t0; e.stuck = false; }
  log(`${a.name} leaving: final backups running`);
  later(3500, () => { const t = performance.now(); a.envs.forEach((e, i) => { e.crumbleAt = t + i * 150; }); });
  later(5000, () => { a.sinkAt = performance.now(); });
  later(6700, () => { model.apps = model.apps.filter(x => x !== a); model.free.push(a.slot); log(`${a.name} left`); });
}
const deletable = () => model.apps.filter(x => !x.sinkAt && !x.envs.some(e => e.activity === 'leaving'));
const ACTIONS = {
  arrive() {
    const name = POOL.find(n => !model.apps.some(a => a.name === n)) || 'app' + seq, t = performance.now();
    const list = [mkEnv(name, 'prod', [cap('postgres')], { activity: 'arriving', bornAt: t, isNewApp: true })];
    if (Math.random() < 0.5) list.push(mkEnv(name, 'staging', [cap('postgres')], { activity: 'arriving', bornAt: t + 300, quiet: true }));
    const a = addApp(name, list, { isNew: true });
    log(`${name} arrived, setting up`);
    if (document.getElementById('flyNew').checked) { const p = target(a, ringLayout()); flyTo(p.x, p.z); }
    later(7000, () => { for (const e of a.envs) if (e.activity === 'arriving') e.activity = null; a.isNew = false; log(`${name} is serving`); });
  },
  firstDeploy() {
    const e = envs().find(v => v.activity === 'unreleased'); if (!e) return log('no Unreleased Environment left');
    e.activity = 'arriving'; e.bornAt = performance.now(); log(`${e.app} ${e.name} got its first image, arriving`);
    later(6500, () => { e.activity = null; log(`${e.app} ${e.name} is serving`); });
  },
  deploy() { const e = pick(idle()); if (!e) return; e.activity = 'deploying'; log(`Deploy to ${e.app} ${e.name}`); later(4500, () => { if (e.activity === 'deploying' && !e.stuck) { e.activity = null; log(`${e.app} ${e.name} deployed`); } }); },
  stuck() { const e = pick(idle()); if (!e) return; e.activity = 'deploying'; log(`Deploy to ${e.app} ${e.name}`); later(2500, () => { e.stuck = true; e.why = 'migration Job failed'; log(`${e.app} ${e.name} Deploy stuck: migration Job failed`); }); },
  update() { const e = pick(idle()); if (!e) return; e.activity = 'updating'; log(`${e.app} ${e.name} updating (secret set)`); later(4000, () => { if (!e.stuck) { e.activity = null; log(`${e.app} ${e.name} updated`); } }); },
  degrade() { const e = pick(envs().filter(v => v.cond === 'healthy' && v.activity !== 'unreleased')); if (e) { e.cond = 'degraded'; log(`${e.app} ${e.name} Degraded: CrashLoopBackOff`); } },
  unknown() { const e = pick(envs().filter(v => v.cond === 'healthy' && v.activity !== 'unreleased')); if (e) { e.cond = 'unknown'; log(`${e.app} ${e.name} Unknown: pod status Unknown`); } },
  warn() { const c = pick(envs().flatMap(e => e.caps.filter(k => k.kind === 'postgres' && !k.warn).map(k => [e, k]))); if (c) { c[1].warn = true; log(`${c[0].app} ${c[0].name} database: backups failing`); } },
  preview() {
    const a = pick(model.apps.filter(x => !x.sinkAt && x.envs.some(e => e.name === 'staging'))); if (!a) return;
    const n = 40 + Math.floor(Math.random() * 60), e = mkEnv(a.name, `pr-${n}`, [cap('login')], { activity: 'arriving', bornAt: performance.now() });
    a.envs.push(e); log(`${a.name} pr-${n} preview arriving`); later(6500, () => { e.activity = null; log(`${a.name} pr-${n} preview is serving`); });
  },
  closePreview() {
    const e = pick(envs().filter(v => v.name.startsWith('pr-') && v.activity !== 'leaving')); if (!e) return log('no preview open');
    e.activity = 'leaving'; e.leaveAt = performance.now(); log(`${e.app} ${e.name} leaving`);
    later(3000, () => { e.crumbleAt = performance.now(); });
    later(4400, () => { const a = model.apps.find(x => x.name === e.app); if (a) a.envs = a.envs.filter(v => v !== e); log(`${e.app} ${e.name} left`); });
  },
  deleteApp() { const a = pick(deletable()); if (a) removeApp(a); },
  deleteTwo() { const a = pick(deletable()); if (!a) return; removeApp(a); setTimeout(() => { const b = pick(deletable()); if (b) { removeApp(b); rebuild(); } }, 1200); },
  bump() { const c = model.comps.find(k => k.kind === 'cert-manager'); c.activity = 'updating'; c.stuck = false; log('cert-manager updating (chart bump)'); later(4000, () => { c.activity = null; log('cert-manager updated'); }); },
  traefik() { const c = model.comps.find(k => k.kind === 'traefik'); c.cond = c.cond === 'healthy' ? 'degraded' : 'healthy'; log(`Traefik ${c.cond === 'healthy' ? 'recovered' : 'Degraded'}`); },
  lose() { model.clusterLost = !model.clusterLost; log(model.clusterLost ? 'Argus lost the cluster' : 'Argus reconnected'); },
  settle() {
    for (const e of envs()) { if (e.activity !== 'unreleased' && e.activity !== 'leaving') e.activity = null; e.stuck = false; e.cond = 'healthy'; for (const c of e.caps) { c.warn = false; c.cond = 'healthy'; } }
    for (const c of model.comps) { c.activity = null; c.stuck = false; c.cond = 'healthy'; }
    model.clusterLost = false; log('everything settled');
  },
  fit() { fit(); },
};
document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => { ACTIONS[b.dataset.act](); rebuild(); }));

seed();
log('Argus connected (fake data)');
rebuild();
const params = new URLSearchParams(location.search);
if (params.get('night') === '1') { document.getElementById('night').checked = true; rebuild(); }
for (const a of (params.get('do') || '').split(',').filter(Boolean)) { if (ACTIONS[a]) { ACTIONS[a](); rebuild(); } }
</script>
