<!doctype html>
<!--
  Argus (#115, #119): the Platform, live, drawn as a particle network from
  the stream at /events. Everything the page loads comes from Argus itself:
  the modules in js/, and three.js r170 vendored in vendor/three
  (vendor/three/README.md). The server allows nothing else
  (internal/argus/server.go, ContentSecurityPolicy); the import map below
  is allowed by its hash.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Argus</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="argus.css">
  <script type="importmap">{"imports": {"three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/"}}</script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main id="stage" aria-label="The Platform, live"></main>
  <header id="brand"><strong>Argus</strong><span>the Platform, live</span></header>
  <button id="chip" type="button" data-state="on" aria-pressed="true"><span class="dot" aria-hidden="true"></span><span class="words">Automatic camera watching</span></button>
  <div id="banner" role="status" hidden></div>
  <div id="edges"></div>
  <ol id="feed" aria-label="Recent changes"></ol>
  <section id="card" aria-live="polite" hidden></section>
  <div id="meter" hidden></div>
  <div id="fallback" hidden>Argus needs WebGL to draw the Platform, and this browser could not start it.</div>
  <noscript><div id="noscript">Argus needs JavaScript to draw the Platform.</div></noscript>
</body>
</html>
