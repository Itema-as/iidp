name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  # The chart tests skip themselves when helm or kubeconform is missing, so
  # the Go job above stays tool-free and this job is where they really run.
  chart:
    name: Chart
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Install kubeconform
        run: |
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          rm kubeconform kubeconform.tar.gz
          kubeconform -v
      # The chart has required values, so a bare lint only warns. Linting
      # with every rendering fixture under --strict turns warnings into
      # errors. Fixtures named refuse-* exist to be refused by the templates
      # and are covered by the tests instead.
      - name: helm lint
        run: |
          for values in chart/application/testdata/*.yaml; do
            case "$(basename "$values")" in refuse-*) continue ;; esac
            helm lint --strict chart/application --values "$values"
          done
      - name: go test
        # The chart tests skip when a tool is missing; here that must fail.
        env:
          IIDP_REQUIRE_CHART_TOOLS: "1"
        run: go test -v ./chart/...

  # Renders each built-in Create template with cmd/renderfixture, builds its
  # Dockerfile and curls / for a 200: the same check done locally with
  # Podman before this ticket's pull request, kept running on every PR.
  # "other" is excluded: its stub Dockerfile is not meant to build.
  templates:
    name: Templates
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - framework: nextjs
            container_port: 3000
            run_args: -e PORT=3000
          - framework: vite-react
            container_port: 80
            run_args: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Render the template
        run: go run ./cmd/renderfixture ${{ matrix.framework }} demoapp fixture
      - name: Build the image
        run: docker build -t iidp-template-${{ matrix.framework }} fixture
      - name: Run it and curl /
        run: |
          docker run -d --name fixture -p 8080:${{ matrix.container_port }} ${{ matrix.run_args }} iidp-template-${{ matrix.framework }}
          status=000
          for _ in $(seq 1 30); do
            status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)"
            [ "$status" = "200" ] && break
            sleep 1
          done
          docker logs fixture || true
          docker rm -f fixture
          if [ "$status" != "200" ]; then
            echo "GET / on the ${{ matrix.framework }} template returned $status, want 200"
            exit 1
          fi

  release-config:
    name: GoReleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # shellcheck and bash ship on the runner image; test/wizard/run.sh runs the
  # wizard's wrapper functions with IIDP_WIZARD_FAKE=1 (no network, no real
  # tofu/gh/sops/az/ssh calls) and the full script with --dry-run, so this
  # needs no Hetzner, Cloudflare, GitHub App or Entra credentials.
  wizard:
    name: Wizard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/bootstrap-wizard.sh test/wizard/run.sh
      - name: fake run
        run: bash test/wizard/run.sh
