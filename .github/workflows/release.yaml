name: Release

on:
  push:
    tags:
      # Release tags only (v0.2.2, v1.0.0-rc1), never the moving major tag
      # (v0) the major-tag job below keeps pointing at the newest release.
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The Deploy gate's image, ghcr.io/<owner>/iidp-deploy-gate
      # (.goreleaser.yaml, dockers_v2).
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser needs the full history and all tags for the changelog.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # See "Releasing" in README.md.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # Turns on the Deploy gate's image in .goreleaser.yaml, now that
          # this job can push it (docs/implementation-notes/60-deploy-gate.md).
          IIDP_PUBLISH_DEPLOY_GATE: "true"

  # Publishes chart/application to GHCR as an OCI artifact with the tag's
  # version, so the Platform repository can pin the same version the CLI
  # reports. See chart/application/README.md.
  chart:
    name: Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Package and push chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The owner is read from the repository, so this keeps working when
          # the repository moves between GitHub accounts. GHCR namespaces are
          # lowercase.
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "${GITHUB_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          helm package chart/application --version "${version}" --destination dist
          helm push "dist/application-${version}.tgz" "oci://ghcr.io/${owner}/charts"

  # Moves the major tag (v0 for v0.x.y) to this release, so every
  # Application repository calling the reusable deploy workflow at @v0
  # (.github/workflows/application-deploy.yaml) gets it with no edit.
  # Only forward: a release that finishes after a newer one leaves the tag
  # alone. Pre-releases (v1.0.0-rc1) never move it. A tag pushed with the
  # workflow's GITHUB_TOKEN starts no workflow run, and the release
  # trigger above only matches vX.Y.Z tags anyway
  # (docs/implementation-notes/74-reusable-deploy-workflow.md).
  major-tag:
    name: Move the major tag
    needs: [goreleaser, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: major-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move the major tag forward to this release
        run: |
          set -euo pipefail
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "${GITHUB_REF_NAME} is a pre-release; the major tag stays where it is."
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          release="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          git fetch --force origin "refs/tags/${major}:refs/tags/${major}" 2>/dev/null || true
          if current="$(git rev-parse -q --verify "refs/tags/${major}^{commit}")"; then
            if ! git merge-base --is-ancestor "${current}" "${release}"; then
              echo "${major} is at ${current}, which ${GITHUB_REF_NAME} doesn't descend from; a newer release has moved it already. Leaving it."
              exit 0
            fi
          fi
          git tag --force "${major}" "${release}"
          git push --force origin "refs/tags/${major}"
          echo "${major} now points at ${GITHUB_REF_NAME} (${release})."
