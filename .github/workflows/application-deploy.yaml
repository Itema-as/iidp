# The deploy workflow every Application repository calls. The caller that
# `iidp app create` writes holds only the triggers, the permissions and the
# inputs below.
#
# On push to main: builds and pushes the image tagged with the commit SHA,
# then deploys it with `iidp ci set-image`. On a v* tag: retags that image
# with the version, with no rebuild, and promotes it to prod. On a pull
# request labelled `preview`: builds and pushes the head, which its Preview
# Environment runs; the Platform finds the pull request itself.
#
# `iidp ci set-image` runs in a checkout of the commit it deploys because it
# sends that commit's iidp.yaml (migration command, Scheduled tasks) with the
# image. In a called workflow the github context is the caller's, so
# actions/checkout checks out the Application repository at the triggering
# ref.
#
# The Deploy gate authenticates the job's GitHub Actions OIDC token, so no
# secret is stored in any Application repository. The caller must grant
# id-token: write, because a called workflow can only keep or reduce the
# permissions it is given.
#
# Callers reference a major tag (@v0), which every iidp release moves
# forward. Breaking for callers, and so needing a new major: removing or
# renaming an input, adding a required one, needing a permission the caller
# doesn't grant today, or needing a different trigger.
name: Application deploy

on:
  workflow_call:
    inputs:
      application:
        description: The Application's name on the Platform, as `iidp app create` named it.
        type: string
        required: true
      # The default is Itema's own Deploy gate. Its address follows from
      # baseDomain in the Platform repository's platform.yaml, which is
      # private, so this workflow can't read it and repeats it here.
      # iidp app create writes deploy-gate-url into a caller only for a
      # Platform whose gate is somewhere else. If baseDomain changes, change
      # this default and platform.DefaultDeployGateURL together; a test
      # keeps the two equal.
      deploy-gate-url:
        description: The Platform's Deploy gate, https://deploy.<baseDomain>. Also the audience of the OIDC token.
        type: string
        required: false
        default: https://deploy.app.itma.no

env:
  IIDP_DEPLOY_GATE_URL: ${{ inputs.deploy-gate-url }}

jobs:
  build:
    name: Build, push and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          APPLICATION: ${{ inputs.application }}
        # GHCR names are lowercase; the Platform's values.yaml has
        # ghcr.io/<owner, lowercased>/<application>.
        run: echo "name=ghcr.io/${OWNER,,}/${APPLICATION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Install iidp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          # The iidp release this workflow file belongs to: the release tag
          # pointing at the commit the caller's @v0 resolved to
          # (job.workflow_sha), so the workflow and the CLI never drift.
          # Peeled lines (^{}) give an annotated tag's commit.
          tag="$(git ls-remote --tags https://github.com/Itema-as/iidp.git \
            | awk -v sha="${WORKFLOW_SHA}" '$1 == sha { ref = $2; sub(/^refs\/tags\//, "", ref); sub(/\^\{\}$/, "", ref); print ref }' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "${tag}" ]; then
            echo "::error::This workflow ran at iidp commit ${WORKFLOW_SHA:-(unknown)}, which no iidp release points at. Call it at the major tag (@v0) or a release tag (@vX.Y.Z)."
            exit 1
          fi
          echo "Installing iidp ${tag}"
          dir="$(mktemp -d)"
          gh release download "${tag}" --repo Itema-as/iidp --pattern 'iidp_*_linux_amd64.tar.gz' --dir "${dir}"
          tar -xzf "${dir}"/iidp_*_linux_amd64.tar.gz -C "${dir}"
          sudo install -m 0755 "${dir}/iidp" /usr/local/bin/iidp
          iidp version

      - name: Deploy through the Deploy gate
        env:
          APPLICATION: ${{ inputs.application }}
        run: iidp ci set-image "${APPLICATION}" auto "${GITHUB_SHA}"

  preview:
    name: Build and push the preview image
    # Builds only for a pull request labelled preview. When the event is the
    # pull request getting some other label, its code is unchanged, so the
    # job is skipped instead of building the same image again.
    if: >-
      github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'preview')
      && (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The pull request's head, not the merge commit a pull_request event
      # checks out by default: ArgoCD's Pull Request generator gives the
      # Preview Environment the head SHA as its image tag.
      - name: Checkout the pull request's head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          APPLICATION: ${{ inputs.application }}
        run: echo "name=ghcr.io/${OWNER,,}/${APPLICATION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.event.pull_request.head.sha }}

  promote:
    name: Promote to prod
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # The tagged commit, for its iidp.yaml: prod gets the migration
      # command and the Scheduled tasks that belong to the code it gets,
      # even when an older tag is promoted.
      - name: Checkout the tagged commit
        uses: actions/checkout@v7

      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          APPLICATION: ${{ inputs.application }}
        run: echo "name=ghcr.io/${OWNER,,}/${APPLICATION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag the SHA image as the version, without rebuilding
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create --tag "${IMAGE}:${version}" "${IMAGE}:${GITHUB_SHA}"

      - name: Install iidp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          # The iidp release this workflow file belongs to: the release tag
          # pointing at the commit the caller's @v0 resolved to
          # (job.workflow_sha), so the workflow and the CLI never drift.
          # Peeled lines (^{}) give an annotated tag's commit.
          tag="$(git ls-remote --tags https://github.com/Itema-as/iidp.git \
            | awk -v sha="${WORKFLOW_SHA}" '$1 == sha { ref = $2; sub(/^refs\/tags\//, "", ref); sub(/\^\{\}$/, "", ref); print ref }' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "${tag}" ]; then
            echo "::error::This workflow ran at iidp commit ${WORKFLOW_SHA:-(unknown)}, which no iidp release points at. Call it at the major tag (@v0) or a release tag (@vX.Y.Z)."
            exit 1
          fi
          echo "Installing iidp ${tag}"
          dir="$(mktemp -d)"
          gh release download "${tag}" --repo Itema-as/iidp --pattern 'iidp_*_linux_amd64.tar.gz' --dir "${dir}"
          tar -xzf "${dir}"/iidp_*_linux_amd64.tar.gz -C "${dir}"
          sudo install -m 0755 "${dir}/iidp" /usr/local/bin/iidp
          iidp version

      - name: Promote through the Deploy gate
        env:
          APPLICATION: ${{ inputs.application }}
        run: iidp ci set-image "${APPLICATION}" prod "${GITHUB_REF_NAME#v}"
