name: e2e

# The kind end-to-end test (test/e2e). The paths filter does not apply to
# tag pushes, so every release tag runs it. The Deploy gate's paths include
# the packages it uses, since the harness builds it from source.
on:
  pull_request:
    paths:
      - "bootstrap/**"
      - "chart/**"
      - "test/e2e/**"
      - "cmd/iidp-deploy-gate/**"
      - "internal/deploygate/**"
      - "internal/appconfig/**"
      - "internal/oidc/**"
      - "internal/platformrepo/**"
      - "internal/render/**"
      - "internal/git/**"
      - "internal/github/**"
      - "internal/githubapp/**"
      - "internal/platformstate/**"
      - ".github/workflows/e2e.yaml"
  push:
    branches: [main]
    # Release tags only, not the moving major tag (v0) the release moves.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
    paths:
      - "bootstrap/**"
      - "chart/**"
      - "test/e2e/**"
      - "cmd/iidp-deploy-gate/**"
      - "internal/deploygate/**"
      - "internal/appconfig/**"
      - "internal/oidc/**"
      - "internal/platformrepo/**"
      - "internal/render/**"
      - "internal/git/**"
      - "internal/github/**"
      - "internal/githubapp/**"
      - "internal/platformstate/**"
      - ".github/workflows/e2e.yaml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: helm lint bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - run: |
          helm lint --strict bootstrap --values test/e2e/fixtures/platform-repo/platform.yaml
          helm lint --strict bootstrap/components/tls
          helm lint --strict bootstrap/components/deploy-gate --set bootstrapRevision=v0.0.0
          helm lint --strict bootstrap/components/argus --set bootstrapRevision=v0.0.0
          helm lint --strict bootstrap/components/guardrails
      # The render tests, and the harness's reading of images from the
      # pinned charts, skip without helm (the Go job of ci.yaml has none);
      # here a missing helm must fail.
      - name: go test ./bootstrap ./test/e2e
        env:
          IIDP_REQUIRE_CHART_TOOLS: "1"
        run: go test -v ./bootstrap/... ./test/e2e/

  kind:
    name: kind bootstrap
    runs-on: ubuntu-latest
    # A run (platform components, then the fixture Application shop with
    # Postgres on staging and prod) takes well under fifteen minutes; the cap
    # leaves room for the test's own waits to expire and print diagnostics.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      # Only installs kind; the test creates the cluster itself so that CI
      # and a laptop run exactly the same code.
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          install_only: true
      # The images the node would otherwise pull from Docker Hub and ECR
      # Public, whose anonymous rate limits the shared runner addresses
      # exhaust. The primary key never matches, so the newest cache is
      # restored; the test pulls whatever is missing.
      - name: Restore the image cache
        id: image-cache
        uses: actions/cache/restore@v6
        with:
          path: .e2e-image-cache
          key: e2e-images-run-${{ github.run_id }}
          restore-keys: e2e-images-
      - name: go test -tags e2e
        env:
          IIDP_E2E_IMAGE_CACHE: ${{ github.workspace }}/.e2e-image-cache
        run: go test -tags e2e ./test/e2e/... -run TestBootstrap -v -timeout 23m
      # Keyed on the list of images the run loaded (images.txt, written
      # once every image is in the node), so a new cache is saved only when
      # that list changed, as it does when a pinned chart moves an image.
      - name: Save the image cache
        if: >-
          always()
          && hashFiles('.e2e-image-cache/images.txt') != ''
          && steps.image-cache.outputs.cache-matched-key != format('e2e-images-{0}', hashFiles('.e2e-image-cache/images.txt'))
        uses: actions/cache/save@v6
        with:
          path: .e2e-image-cache
          key: e2e-images-${{ hashFiles('.e2e-image-cache/images.txt') }}
