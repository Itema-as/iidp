name: e2e

# The kind end-to-end test: bootstraps the Platform components from a
# fixture Platform repository on a kind cluster (test/e2e). Runs only when
# the bootstrap, the chart, the harness or the Deploy gate change, and on
# every release tag. The paths filter does not apply to tag pushes, which is
# what makes tags always run it. The Deploy gate's paths are its own code,
# which the harness builds from source, and the packages it writes the
# Platform repository with.
on:
  pull_request:
    paths:
      - "bootstrap/**"
      - "chart/**"
      - "test/e2e/**"
      - "cmd/iidp-deploy-gate/**"
      - "internal/deploygate/**"
      - "internal/oidc/**"
      - "internal/platformrepo/**"
      - "internal/render/**"
      - "internal/git/**"
      - "internal/github/**"
      - "internal/githubapp/**"
      - ".github/workflows/e2e.yaml"
  push:
    branches: [main]
    # Release tags only, not the moving major tag (v0) the release moves.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
    paths:
      - "bootstrap/**"
      - "chart/**"
      - "test/e2e/**"
      - "cmd/iidp-deploy-gate/**"
      - "internal/deploygate/**"
      - "internal/oidc/**"
      - "internal/platformrepo/**"
      - "internal/render/**"
      - "internal/git/**"
      - "internal/github/**"
      - "internal/githubapp/**"
      - ".github/workflows/e2e.yaml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: helm lint bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - run: |
          helm lint --strict bootstrap --values test/e2e/fixtures/platform-repo/platform.yaml
          helm lint --strict bootstrap/components/tls
          helm lint --strict bootstrap/components/deploy-gate --set bootstrapRevision=v0.0.0
      # The render tests skip without helm (the Go job of ci.yaml has none);
      # here a missing helm must fail.
      - name: go test ./bootstrap
        env:
          IIDP_REQUIRE_CHART_TOOLS: "1"
        run: go test -v ./bootstrap/...

  kind:
    name: kind bootstrap
    runs-on: ubuntu-latest
    # A run (platform components, then the fixture Application shop with
    # Postgres on staging and prod) takes well under fifteen minutes; the cap
    # leaves room for the test's own waits to expire and print diagnostics.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      # Only installs kind; the test creates the cluster itself so that CI
      # and a laptop run exactly the same code.
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          install_only: true
      - name: go test -tags e2e
        run: go test -tags e2e ./test/e2e/... -run TestBootstrap -v -timeout 23m
