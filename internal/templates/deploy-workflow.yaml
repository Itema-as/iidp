# Deploy workflow for __IIDP_APP_NAME__, added by `iidp app create`.
#
# A push to main builds the image and deploys it; a v* tag promotes that
# image to prod. How is defined once, in the iidp repository's reusable
# workflow, which this file calls at its major tag:
#
#   __IIDP_DEPLOY_WORKFLOW__
#
# Every iidp release in that major version reaches this repository with no
# edit here. Moving to a new major is a one-line change to `uses:` below.
#
# No secret is stored in this repository. The reusable workflow deploys
# through the Platform's Deploy gate with this run's GitHub Actions OIDC
# token, hence id-token: write, and pushes to GHCR with the run's own
# GITHUB_TOKEN, hence packages: write. A called workflow can't be given
# more than the caller grants here.
name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  deploy:
    uses: __IIDP_DEPLOY_WORKFLOW_REF__
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      application: __IIDP_APP_NAME__
__IIDP_DEPLOY_GATE_URL_INPUT__
