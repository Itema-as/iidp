# Deploy workflow for __IIDP_APP_NAME__, added by `iidp app create`.
#
# On push to main: builds the image with buildx and pushes it to GHCR
# tagged with the commit SHA, then runs `iidp ci set-image` to write that
# tag into the Platform repository: staging when this Application has one,
# prod otherwise. iidp decides that from the Platform repository, not this
# workflow.
#
# On a v* tag: retags the already-built SHA image with the tag's version,
# with no rebuild, and runs `iidp ci set-image` for prod.
#
# `iidp app create` rewrites this file whenever it regenerates the
# template; a hand edit here has no effect on iidp itself. The same file
# is shared by every framework template (internal/templates/templates.go),
# so it exists once, not once per framework.
name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  IMAGE: ghcr.io/__IIDP_OWNER__/__IIDP_APP_NAME__

jobs:
  build:
    name: Build, push and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Install iidp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="__IIDP_VERSION__"
          echo "Installing iidp ${version}"
          dir="$(mktemp -d)"
          if [ "${version}" = "latest" ]; then
            gh release download --repo __IIDP_CLI_REPO__ --pattern 'iidp_*_linux_amd64.tar.gz' --dir "${dir}"
          else
            gh release download "v${version}" --repo __IIDP_CLI_REPO__ --pattern 'iidp_*_linux_amd64.tar.gz' --dir "${dir}"
          fi
          tar -xzf "${dir}"/iidp_*_linux_amd64.tar.gz -C "${dir}"
          sudo install -m 0755 "${dir}/iidp" /usr/local/bin/iidp
          iidp version

      - name: Write the image tag to the Platform repository
        env:
          IIDP_DEPLOY_APP_PRIVATE_KEY: ${{ secrets.IIDP_DEPLOY_APP_PRIVATE_KEY }}
          IIDP_DEPLOY_APP_ID: ${{ vars.IIDP_DEPLOY_APP_ID }}
        run: iidp ci set-image __IIDP_APP_NAME__ auto ${{ github.sha }}

  promote:
    name: Promote to prod
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag the SHA image as the version, without rebuilding
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "${{ env.IMAGE }}:${version}" \
            "${{ env.IMAGE }}:${{ github.sha }}"

      - name: Install iidp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="__IIDP_VERSION__"
          echo "Installing iidp ${version}"
          dir="$(mktemp -d)"
          if [ "${version}" = "latest" ]; then
            gh release download --repo __IIDP_CLI_REPO__ --pattern 'iidp_*_linux_amd64.tar.gz' --dir "${dir}"
          else
            gh release download "v${version}" --repo __IIDP_CLI_REPO__ --pattern 'iidp_*_linux_amd64.tar.gz' --dir "${dir}"
          fi
          tar -xzf "${dir}"/iidp_*_linux_amd64.tar.gz -C "${dir}"
          sudo install -m 0755 "${dir}/iidp" /usr/local/bin/iidp
          iidp version

      - name: Write the version to the Platform repository
        env:
          IIDP_DEPLOY_APP_PRIVATE_KEY: ${{ secrets.IIDP_DEPLOY_APP_PRIVATE_KEY }}
          IIDP_DEPLOY_APP_ID: ${{ vars.IIDP_DEPLOY_APP_ID }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          iidp ci set-image __IIDP_APP_NAME__ prod "${version}"
