# GoReleaser configuration for the iidp CLI. Run by .github/workflows/release.yaml
# on every v* tag. Verify locally with:
#   goreleaser check
#   goreleaser build --snapshot --clean --single-target
version: 2

project_name: iidp

builds:
  - id: iidp
    main: ./cmd/iidp
    binary: iidp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Itema-as/iidp/internal/version.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The Deploy gate (cmd/iidp-deploy-gate), shipped only as the image below,
  # never in an archive: the Platform node is linux/amd64.
  - id: iidp-deploy-gate
    main: ./cmd/iidp-deploy-gate
    binary: iidp-deploy-gate
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Itema-as/iidp/internal/version.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# The Deploy gate's image, ghcr.io/itema-as/iidp-deploy-gate:<version>, the
# tag the bootstrap chart derives from the bootstrap revision it is pinned
# to (bootstrap/templates/deploy-gate.yaml). Built from
# cmd/iidp-deploy-gate/Dockerfile, the same file the kind harness builds
# from. Only linux/amd64: the node is, and one platform needs no emulation
# for the Dockerfile's RUN. Publishing needs the release job logged in to
# GHCR with packages: write, which the release workflow sets up together
# with IIDP_PUBLISH_DEPLOY_GATE=true; without that variable the image is
# skipped, so a release never fails on a push it has no credential for
# (docs/implementation-notes/60-deploy-gate.md).
dockers_v2:
  - id: iidp-deploy-gate
    ids:
      - iidp-deploy-gate
    dockerfile: cmd/iidp-deploy-gate/Dockerfile
    images:
      - ghcr.io/itema-as/iidp-deploy-gate
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
    labels:
      "org.opencontainers.image.source": '{{ trimsuffix .GitURL ".git" }}'
      "org.opencontainers.image.description": "The iidp Deploy gate"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
    sbom: false
    flags:
      - "--provenance=false"
    disable: '{{ ne (index .Env "IIDP_PUBLISH_DEPLOY_GATE") "true" }}'

archives:
  - id: iidp
    ids:
      - iidp
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc

# The release owner and name are read from the git remote, so releases keep
# working when the repository moves between GitHub accounts. The cask homepage
# below is derived from the same remote for the same reason.
release:
  draft: false
  prerelease: auto

# Homebrew publishes to the tap as a cask, which is what GoReleaser generates
# for plain binaries since v2.10 (the formula-based `brews` section is
# deprecated). Casks are macOS only; Linux users install from GitHub Releases.
homebrew_casks:
  - name: iidp
    ids:
      - iidp
    binaries:
      - iidp
    repository:
      owner: Itema-as
      name: homebrew-tap
      branch: main
      # A token with contents write access to the tap repository. The default
      # GITHUB_TOKEN of the release workflow cannot push to another repository.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    description: "Command line interface to Itema's Internal Developer Platform"
    homepage: "{{ trimsuffix .GitURL \".git\" }}"
    # Pre-release tags (v1.2.3-rc1) publish a GitHub Release but do not
    # update the cask, so brew users only ever get stable versions.
    skip_upload: auto
    # The binaries are not signed or notarized, so clear the quarantine bit
    # Gatekeeper would otherwise put on them.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/iidp"]
          end
