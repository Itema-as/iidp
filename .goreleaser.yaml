# GoReleaser configuration for the iidp CLI and the Deploy gate's, Argus's and
# the database tunnel's images. Run by .github/workflows/release.yaml on every v* tag. Verify
# locally with:
#   goreleaser check
#   goreleaser build --snapshot --clean --single-target
version: 2

project_name: iidp

builds:
  - id: iidp
    main: ./cmd/iidp
    binary: iidp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Itema-as/iidp/internal/version.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Shipped only as an image, never in an archive.
  - id: iidp-deploy-gate
    main: ./cmd/iidp-deploy-gate
    binary: iidp-deploy-gate
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Itema-as/iidp/internal/version.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Shipped only as an image, like the gate.
  - id: iidp-argus
    main: ./cmd/iidp-argus
    binary: iidp-argus
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Itema-as/iidp/internal/version.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Shipped only as an image, like the gate.
  - id: iidp-db-tunnel
    main: ./cmd/iidp-db-tunnel
    binary: iidp-db-tunnel
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Itema-as/iidp/internal/version.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# The image tags are the version the bootstrap chart derives from its pinned
# revision. Only linux/amd64: the node is, and one platform needs no
# emulation for the Dockerfile's RUN. Without IIDP_PUBLISH_DEPLOY_GATE=true,
# which the release workflow sets once logged in to GHCR, the image is
# skipped, so a release never fails on a push it has no credential for.
dockers_v2:
  - id: iidp-deploy-gate
    ids:
      - iidp-deploy-gate
    dockerfile: cmd/iidp-deploy-gate/Dockerfile
    images:
      - ghcr.io/itema-as/iidp-deploy-gate
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
    labels:
      "org.opencontainers.image.source": '{{ trimsuffix .GitURL ".git" }}'
      "org.opencontainers.image.description": "The iidp Deploy gate"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
    sbom: false
    flags:
      - "--provenance=false"
    disable: '{{ ne (index .Env "IIDP_PUBLISH_DEPLOY_GATE") "true" }}'

  # Published like the gate's, under IIDP_PUBLISH_ARGUS.
  - id: iidp-argus
    ids:
      - iidp-argus
    dockerfile: cmd/iidp-argus/Dockerfile
    images:
      - ghcr.io/itema-as/iidp-argus
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
    labels:
      "org.opencontainers.image.source": '{{ trimsuffix .GitURL ".git" }}'
      "org.opencontainers.image.description": "Argus, the live view of the iidp Platform"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
    sbom: false
    flags:
      - "--provenance=false"
    disable: '{{ ne (index .Env "IIDP_PUBLISH_ARGUS") "true" }}'

  # Published like the gate's, under IIDP_PUBLISH_DB_TUNNEL.
  - id: iidp-db-tunnel
    ids:
      - iidp-db-tunnel
    dockerfile: cmd/iidp-db-tunnel/Dockerfile
    images:
      - ghcr.io/itema-as/iidp-db-tunnel
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
    labels:
      "org.opencontainers.image.source": '{{ trimsuffix .GitURL ".git" }}'
      "org.opencontainers.image.description": "The iidp database tunnel"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
    sbom: false
    flags:
      - "--provenance=false"
    disable: '{{ ne (index .Env "IIDP_PUBLISH_DB_TUNNEL") "true" }}'

archives:
  - id: iidp
    ids:
      - iidp
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc

# The release owner and name are read from the git remote, so releases keep
# working when the repository moves between GitHub accounts. The cask homepage
# below is derived from the same remote for the same reason.
release:
  draft: false
  prerelease: auto

# Homebrew publishes to the tap as a cask, which is what GoReleaser generates
# for plain binaries since v2.10 (the formula-based `brews` section is
# deprecated). Casks are macOS only; Linux users install from GitHub Releases.
homebrew_casks:
  - name: iidp
    ids:
      - iidp
    binaries:
      - iidp
    repository:
      owner: Itema-as
      name: homebrew-tap
      branch: main
      # A token with contents write access to the tap repository. The default
      # GITHUB_TOKEN of the release workflow cannot push to another repository.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    description: "Command line interface to Itema's Internal Developer Platform"
    homepage: "{{ trimsuffix .GitURL \".git\" }}"
    # Pre-release tags (v1.2.3-rc1) publish a GitHub Release but do not
    # update the cask, so brew users only ever get stable versions.
    skip_upload: auto
    # The binaries are not signed or notarized, so clear the quarantine bit
    # Gatekeeper would otherwise put on them.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/iidp"]
          end
